<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopflow</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">shopflow</span>
    <nav>
      <button data-view="store">Storefront</button>
      <button data-view="orders">Orders</button>
      <button data-view="reviews">Reviews</button>
      <button data-view="imports">Imports</button>
      <button data-view="settings">Settings</button>
    </nav>
    <span id="who" class="who">signed out</span>
  </header>
  <main id="app">
    <section id="login" class="card">
      <h2>Merchant sign in</h2>
      <input id="email" placeholder="email" autocomplete="username" />
      <input id="password" type="password" placeholder="password" autocomplete="current-password" />
      <button id="signin">Sign in</button>
      <p id="loginError" class="error"></p>
    </section>
    <section id="view" class="card" hidden></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
