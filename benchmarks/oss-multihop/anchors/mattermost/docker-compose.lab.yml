# Isolated Docker Compose lab harness for oss-dev-mattermost-01 (Mattermost).
# Strictly enforces --internal network isolation (zero public egress), isolated loopback
# lab proxy port binding, synthetic oss_lab_* credentials, and paired vulnerable/patched tags.
#
# Vulnerable target (default): APP_IMAGE=mattermost/mattermost-team-edition APP_TAG=9.5.8
# Paired patched target:       APP_IMAGE=mattermost/mattermost-team-edition APP_TAG=9.11.4

networks:
  lab_internal:
    driver: bridge
    internal: true

services:
  mm_lab_proxy:
    image: "${PROXY_IMAGE:-guardian-lab/loopback-proxy:1.0.0}"
    ports:
      - "127.0.0.1:0:8065"
    networks:
      - lab_internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - mattermost_app
    environment:
      UPSTREAM_URL: "http://mattermost_app:8065"
    labels:
      guardian.oss_lab.target: "oss-dev-mattermost-01"
      guardian.oss_lab.role: "lab_proxy"
      guardian.oss_lab.egress_policy: "deny_all_internal_only"

  mattermost_app:
    image: "${APP_IMAGE:-mattermost/mattermost-team-edition}:${APP_TAG:-9.5.8}"
    networks:
      - lab_internal
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - mattermost_db
      - mattermost_idp
    environment:
      MM_SQLSETTINGS_DRIVERNAME: "postgres"
      MM_SQLSETTINGS_DATASOURCE: "postgres://oss_lab_user:oss_lab_pg_password_04@mattermost_db:5432/mm_lab?sslmode=disable"
      MM_SERVICESETTINGS_SITEURL: "http://127.0.0.1:8065"
      OSS_LAB_SEED_CRED: "oss_lab_mm_seed_01"
      OSS_LAB_MEMBER_CRED: "oss_lab_mm_member_a"
      OSS_LAB_SYSADMIN_CRED: "oss_lab_mm_sysadmin"
    labels:
      guardian.oss_lab.target: "oss-dev-mattermost-01"
      guardian.oss_lab.split: "dev"
      guardian.oss_lab.role: "app"

  mattermost_idp:
    image: "${IDP_IMAGE:-guardian-lab/oidc-stub:1.0.0}"
    networks:
      - lab_internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      OIDC_ISSUER: "http://mattermost_idp:8080"
      OSS_LAB_OIDC_SECRET: "oss_lab_mm_oidc_secret_01"
    labels:
      guardian.oss_lab.target: "oss-dev-mattermost-01"
      guardian.oss_lab.role: "idp"

  mattermost_db:
    image: "postgres:16.4-alpine"
    networks:
      - lab_internal
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_DB: "mm_lab"
      POSTGRES_USER: "oss_lab_user"
      POSTGRES_PASSWORD: "oss_lab_pg_password_04"
    labels:
      guardian.oss_lab.target: "oss-dev-mattermost-01"
      guardian.oss_lab.role: "db"
