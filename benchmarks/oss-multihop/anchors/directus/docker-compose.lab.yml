# Isolated Docker Compose lab harness for oss-dev-directus-01 (Directus).
# Strictly enforces --internal network isolation (zero public egress), loopback-only
# ephemeral port binding, synthetic oss_lab_* credentials, and paired vulnerable/patched tags.
#
# Vulnerable target (default): APP_IMAGE=directus/directus APP_TAG=10.10.7
# Paired patched target:       APP_IMAGE=directus/directus APP_TAG=10.13.1

networks:
  lab_internal:
    driver: bridge
    internal: true

services:
  directus_app:
    image: "${APP_IMAGE:-directus/directus}:${APP_TAG:-10.10.7}"
    ports:
      - "127.0.0.1:0:8055"
    networks:
      - lab_internal
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - directus_db
      - directus_cache
    environment:
      DB_CLIENT: "pg"
      DB_HOST: "directus_db"
      DB_PORT: "5432"
      DB_DATABASE: "directus_lab"
      DB_USER: "oss_lab_user"
      DB_PASSWORD: "oss_lab_pg_password_02"
      KEY: "oss_lab_directus_key_01"
      SECRET: "oss_lab_directus_secret_01"
      CACHE_ENABLED: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://directus_cache:6379"
      ADMIN_EMAIL: "admin_tenant_a@oss-lab.internal"
      ADMIN_PASSWORD: "oss_lab_directus_admin_a"
      OSS_LAB_MEMBER_CRED: "oss_lab_directus_member_b"
    labels:
      guardian.oss_lab.target: "oss-dev-directus-01"
      guardian.oss_lab.split: "dev"
      guardian.oss_lab.egress_policy: "deny_all_internal_only"

  directus_db:
    image: "postgres:16.4-alpine"
    networks:
      - lab_internal
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_DB: "directus_lab"
      POSTGRES_USER: "oss_lab_user"
      POSTGRES_PASSWORD: "oss_lab_pg_password_02"
    labels:
      guardian.oss_lab.target: "oss-dev-directus-01"
      guardian.oss_lab.role: "db"

  directus_cache:
    image: "redis:7.2.5-alpine"
    networks:
      - lab_internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    labels:
      guardian.oss_lab.target: "oss-dev-directus-01"
      guardian.oss_lab.role: "cache"
