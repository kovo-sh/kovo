# Isolated Docker Compose lab harness for oss-clean-outline-02 (Outline clean negative control).
# Enforces hard 0-FP precision gate (maxAllowedFindings: 0) with --internal network isolation,
# loopback-only ephemeral port binding, and synthetic oss_lab_* credentials.
#
# Clean patched control target: APP_IMAGE=outlinewiki/outline APP_TAG=0.80.1

networks:
  lab_internal:
    driver: bridge
    internal: true

services:
  outline_app:
    image: "${APP_IMAGE:-outlinewiki/outline}:${APP_TAG:-0.80.1}"
    ports:
      - "127.0.0.1:0:3000"
    networks:
      - lab_internal
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - outline_db
    environment:
      SECRET_KEY: "oss_lab_outline_secret_02"
      UTILS_SECRET: "oss_lab_outline_utils_02"
      DATABASE_URL: "postgres://oss_lab_user:oss_lab_pg_clean_02@outline_db:5432/outline_clean"
      OSS_LAB_VIEWER_CRED: "oss_lab_outline_viewer_a"
      OSS_LAB_ADMIN_CRED: "oss_lab_outline_admin_b"
    labels:
      guardian.oss_lab.target: "oss-clean-outline-02"
      guardian.oss_lab.split: "clean_control"
      guardian.oss_lab.egress_policy: "deny_all_internal_only"

  outline_db:
    image: "postgres:16.4-alpine"
    networks:
      - lab_internal
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_DB: "outline_clean"
      POSTGRES_USER: "oss_lab_user"
      POSTGRES_PASSWORD: "oss_lab_pg_clean_02"
    labels:
      guardian.oss_lab.target: "oss-clean-outline-02"
      guardian.oss_lab.role: "db"
