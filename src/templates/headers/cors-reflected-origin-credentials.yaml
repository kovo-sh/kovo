id: cors-reflected-origin-credentials
name: "CORS reflects arbitrary Origin with credentials"
severity: medium
description: "The server reflects an untrusted Origin in Access-Control-Allow-Origin and allows credentials."
tech: [generic]
tags: [cors, misconfig]
cwe: CWE-942
request:
  method: GET
  path: /
  headers:
    Origin: "https://guardian-probe.invalid"
control:
  headers: {}
matchers-condition: and
matchers:
  - type: regex
    part: header
    regex: ['^access-control-allow-origin:\s*https://guardian-probe\.invalid']
  - type: regex
    part: header
    regex: ['^access-control-allow-credentials:\s*true']
