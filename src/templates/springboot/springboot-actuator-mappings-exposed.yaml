id: springboot-actuator-mappings-exposed
name: "Spring Boot actuator /mappings exposed"
severity: medium
description: "The actuator mappings endpoint discloses every request mapping and handler in the application."
tech: [springboot]
tags: [actuator, exposure]
cwe: CWE-215
request:
  method: GET
  path: /actuator/mappings
control:
  path: "/actuator/kovo-none-{{rand}}"
matchers-condition: and
matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words: ["dispatcherServlets", "handlerMethods"]
    condition: or
