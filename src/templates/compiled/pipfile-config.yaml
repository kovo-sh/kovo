id: "pipfile-config"
name: "Pipfile Config - Detect"
severity: "info"
description: "Pipfile configuration information was detected."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "pip"
  - "devops"
  - "cicd"
  - "vuln"
cwe: "CWE-200"
reference: "https://pypi.org/project"
spaExclusion: true
request:
  method: "GET"
  path: "/Pipfile"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "[[source]]"
      - "[packages]"
    condition: "and"
  - type: "status"
    status:
      - 200
