id: "codeception-config"
name: "Codeception YAML Configuration File - Detect"
severity: "low"
description: "Codeception YAML configuration file was detected."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "devops"
  - "codeception"
  - "config"
  - "cicd"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/codeception.yml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "paths:"
      - "settings:"
    condition: "and"
  - type: "status"
    status:
      - 200
