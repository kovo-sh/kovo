id: "apachespark-ui-exposed"
name: "Apache Spark Application UI - Exposed"
severity: "medium"
description: "Detects exposed PySparkShell Application UI by Apache Spark on port 4040. The UI should not be exposed to the internet as it may leak sensitive job and cluster information."
tech:
  - "apache"
tags:
  - "spark"
  - "pyspark"
  - "ui"
  - "exposed"
  - "panel"
  - "apache"
  - "vuln"
reference: "https://spark.apache.org/docs/latest/web-ui.html"
spaExclusion: true
request:
  method: "GET"
  path: "/jobs/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Spark Jobs"
      - "application UI"
    condition: "and"
  - type: "status"
    status:
      - 200
