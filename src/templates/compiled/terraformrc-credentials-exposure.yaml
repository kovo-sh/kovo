id: "terraformrc-credentials-exposure"
name: "Terraform CLI Configuration - Credentials Exposure"
severity: "high"
description: "A Terraform CLI configuration file (.terraformrc or terraform.rc) containing a credentials block was found exposed. This file stores API tokens used to authenticate the Terraform CLI to remote backends such as Terraform Cloud or Terraform Enterprise, so exposure can leak a valid token that grants access to remote state and workspaces."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "config"
  - "terraform"
  - "iac"
  - "token"
cwe: "CWE-522"
reference: "https://developer.hashicorp.com/terraform/cli/config/config-file"
spaExclusion: true
request:
  method: "GET"
  path: "/.terraformrc"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "credentials\\s+\"[^\"]+\"\\s*\\{"
      - "token\\s*=\\s*\""
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
    negative: true
  - type: "status"
    status:
      - 200
