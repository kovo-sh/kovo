id: "service-pwd"
name: "service.pwd - Sensitive Information Disclosure"
severity: "high"
description: "service.pwd was discovered, which is likely to contain sensitive information."
tech:
  - "generic"
tags:
  - "exposure"
  - "listing"
  - "service"
  - "edb"
  - "misconfig"
  - "vuln"
reference: "https://www.exploit-db.com/ghdb/7256"
spaExclusion: true
request:
  method: "GET"
  path: "/_vti_pvt/service.pwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "# -FrontPage-"
  - type: "status"
    status:
      - 200
