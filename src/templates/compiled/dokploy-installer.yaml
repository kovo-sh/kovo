id: "dokploy-installer"
name: "Dokploy Installer Exposure"
severity: "high"
description: "Dokploy is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "dokploy"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/register"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Setup the server"
      - "Dokploy"
    condition: "and"
  - type: "status"
    status:
      - 200
