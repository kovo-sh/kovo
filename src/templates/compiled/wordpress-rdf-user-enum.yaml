id: "wordpress-rdf-user-enum"
name: "Wordpress RDF User Enumeration"
severity: "info"
description: "Leaked Wordpress RDF leads to User Emumeration."
tech:
  - "wordpress"
tags:
  - "wordpress"
  - "enum"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/feed/rdf"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "header"
    words:
      - "application/rdf+xml"
  - type: "word"
    part: "body"
    words:
      - "<rdf:RDF"
      - "<dc:creator>"
    condition: "and"
  - type: "status"
    status:
      - 200
