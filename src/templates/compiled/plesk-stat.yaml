id: "plesk-stat"
name: "Webalizer Log Analyzer Configuration - Detect"
severity: "medium"
description: "Webalizer log analyzer configuration was detected."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "exposure"
  - "plesk"
  - "vuln"
cwe: "CWE-200"
reference: "https://webalizer.net/"
spaExclusion: true
request:
  method: "GET"
  path: "/plesk-stat/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "Index of /plesk-stat"
      - "Parent Directory"
    condition: "and"
  - type: "word"
    part: "body"
    words:
      - "anon_ftpstat"
      - "ftpstat"
      - "webstat-ssl"
      - "webstat"
