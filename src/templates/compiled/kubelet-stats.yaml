id: "kubelet-stats"
name: "Kubelet Stats"
severity: "info"
description: "Scans for kubelet stats"
tech:
  - "kubernetes"
tags:
  - "tech"
  - "k8s"
  - "kubernetes"
  - "devops"
  - "kubelet"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/stats/summary"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "\"node\":"
      - "\"nodeName\":"
    condition: "and"
