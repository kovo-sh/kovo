id: "htpasswd-detection"
name: "Apache htpasswd Config - Detect"
severity: "high"
description: "Apache htpasswd configuration was detected."
tech:
  - "apache"
tags:
  - "config"
  - "exposure"
  - "discovery"
cwe: "CWE-200"
reference: "https://httpd.apache.org/docs/current/programs/htpasswd.html"
spaExclusion: true
request:
  method: "GET"
  path: "/.htpasswd"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - ":{SHA}"
      - ":$apr1$"
      - ":$2y$"
  - type: "status"
    status:
      - 200
