id: "teamcity-guest-login-enabled"
name: "JetBrains TeamCity - Guest User Access Enabled"
severity: "high"
description: "TeamCity provides the ability to turn on the guest login allowing anonymous access to the TeamCity UI."
tech:
  - "generic"
tags:
  - "misconfig"
  - "teamcity"
  - "jetbrains"
  - "vuln"
cwe: "CWE-200"
reference: "https://ph33r.medium.com/misconfig-in-teamcity-panel-lead-to-auth-bypass-in-apache-org-exploit-146f6a1a4e2b"
spaExclusion: true
request:
  method: "GET"
  path: "/guestLogin.html?guest=1"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "header"
    words:
      - "Location: /overview.html"
      - "TCSESSIONID="
    condition: "and"
  - type: "status"
    status:
      - 302
