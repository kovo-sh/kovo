id: "jboss-web-service"
name: "JBoss Web Service Console - Detect"
severity: "low"
description: "The JBoss Web Service console discloses the details of the remote system, The console displays all the web services and exposed by the system leading to a potential information disclosure."
tech:
  - "generic-web-exposure"
tags:
  - "jboss"
  - "misconfig"
  - "vuln"
reference: "https://github.com/PortSwigger/j2ee-scan/blob/master/src/main/java/burp/j2ee/issues/impl/JBossWS.java"
spaExclusion: true
request:
  method: "GET"
  path: "/jbossws/services"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "JBossWS/Services</div>"
  - type: "word"
    part: "body"
    words:
      - "no endpoints deployed"
    negative: true
  - type: "status"
    status:
      - 200
