id: "exposed-sharepoint-list"
name: "Sharepoint List - Detect"
severity: "medium"
description: "Sharepoint list was detected because of improper configuration. An anonymous user can access SharePoint Web Services."
tech:
  - "generic-web-exposure"
tags:
  - "hackerone"
  - "config"
  - "exposure"
  - "sharepoint"
  - "vuln"
cwe: "CWE-200"
reference: "https://hackerone.com/reports/761158"
spaExclusion: true
request:
  method: "GET"
  path: "/_vti_bin/lists.asmx?WSDL"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "GetListResponse"
      - "GetList"
    condition: "and"
  - type: "status"
    status:
      - 200
