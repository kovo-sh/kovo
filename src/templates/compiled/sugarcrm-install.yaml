id: "sugarcrm-install"
name: "SugarCRM Exposed Installation"
severity: "high"
description: "SugarCRM is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "sugar"
  - "sugarcrm"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Sugar Setup Wizard"
  - type: "status"
    status:
      - 200
