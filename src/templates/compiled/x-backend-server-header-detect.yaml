id: "x-backend-server-header-detect"
name: "X-Backend-Server Header - Exposure"
severity: "low"
description: "Detected that the website returned the X-Backend-Server header, which included potentially internal or hidden IP addresses or hostnames. By exposing these values, attackers might have attempted to circumvent security proxies and access these hosts directly."
tech:
  - "generic"
tags:
  - "headers"
  - "misconfig"
  - "exposure"
  - "vuln"
reference: "https://docs.gitlab.com/user/application_security/dast/browser/checks/16.4/"
spaExclusion: true
request:
  method: "GET"
  path: "/en"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "header"
    words:
      - "X-Backend-Server"
