id: "werkzeug-debugger-detect"
name: "Werkzeug debugger console"
severity: "info"
description: "Safe check derived from werkzeug-debugger-detect: Werkzeug debugger console"
tech:
  - "generic"
tags:
  - "tech"
  - "werkzeug"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/console"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<h1>Interactive Console</h1>"
