id: "wordpress-db-repair"
name: "Wordpress DB Repair Exposed"
severity: "low"
description: "Discover enabled Wordpress repair page."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "config"
  - "fpd"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-admin/maint/repair.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>WordPress"
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "define"
      - "WP_ALLOW_REPAIR"
      - "true"
    condition: "and"
    negative: true
