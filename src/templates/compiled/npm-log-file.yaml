id: "npm-log-file"
name: "Publicly accessible NPM Log file"
severity: "low"
description: "NPM log file is exposed to external users."
tech:
  - "generic"
tags:
  - "npm"
  - "logs"
  - "exposure"
  - "vuln"
reference: "https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt"
spaExclusion: true
request:
  method: "GET"
  path: "/npm-debug.log"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "info it worked if it ends with ok"
  - type: "status"
    status:
      - 200
