id: "salesforce-credentials"
name: "Salesforce Credentials - Detect"
severity: "high"
description: "Salesforce credentials information was detected."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "files"
  - "salesforce"
  - "vuln"
cwe: "CWE-200"
reference: "https://github.com/daveagp/websheets"
spaExclusion: true
request:
  method: "GET"
  path: "/js/salesforce.js"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "jsforce.Connection"
      - "conn.login"
      - "conn.query"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
  - type: "status"
    status:
      - 200
