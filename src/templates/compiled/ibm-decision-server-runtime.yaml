id: "ibm-decision-server-runtime"
name: "IBM Decision Server Runtime Panel- Detect"
severity: "info"
description: "IBM Decision Server Runtime was detected."
tech:
  - "generic"
tags:
  - "ibm"
  - "detect"
  - "tech"
  - "decision-server"
  - "discovery"
reference: "https://www.ibm.com/docs/en/odm/8.10?topic=services-hosted-transparent-decision"
spaExclusion: true
request:
  method: "GET"
  path: "/DecisionService/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Hosted Transparent Decision Service</title>"
  - type: "status"
    status:
      - 200
