id: "gerrit-account-enum"
name: "Gerrit Code Review - Account Enumeration"
severity: "medium"
description: "Gerrit Code Review exposes the /accounts/ REST API endpoint which can be used to enumerate user accounts.The endpoint allows querying for accounts by username, email, or name, potentially revealing sensitive user information including account IDs, names, emails, and usernames without authentication."
tech:
  - "generic-web-exposure"
tags:
  - "gerrit"
  - "enum"
  - "exposure"
  - "misconfig"
  - "vuln"
reference: "https://gerrit-review.googlesource.com/Documentation/rest-api-accounts.html"
spaExclusion: true
request:
  method: "GET"
  path: "/accounts/?q=a&n=10"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "_account_id"
      - "username"
    condition: "and"
  - type: "status"
    status:
      - 200
