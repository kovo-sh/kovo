id: "unauth-kubecost"
name: "KubeCost - Unauthenticated Dashboard Exposure"
severity: "medium"
description: "KubeCost Dashboard is exposed to external users."
tech:
  - "generic"
tags:
  - "misconfig"
  - "exposure"
  - "unauth"
  - "kubecost"
  - "vuln"
reference: "https://www.facebook.com/photo?fbid=470414125129112&set=pcb.470413798462478"
spaExclusion: true
request:
  method: "GET"
  path: "/overview.html"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Cluster Overview | Kubecost</title>"
      - "<title>Kubecost</title>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
