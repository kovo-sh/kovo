id: "git-credentials-disclosure"
name: "Git Credentials - Detect"
severity: "medium"
description: "Git credentials were detected."
tech:
  - "generic"
tags:
  - "exposure"
  - "config"
  - "vuln"
cwe: "CWE-200"
reference: "https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/git-credentials-disclosure.json"
spaExclusion: true
request:
  method: "GET"
  path: "/.git-credentials"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "https://"
      - "@github.com"
    condition: "and"
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "text/html"
    negative: true
