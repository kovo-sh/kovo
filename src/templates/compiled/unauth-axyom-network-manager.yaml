id: "unauth-axyom-network-manager"
name: "Unauthenticated Axyom Network Manager"
severity: "high"
description: "Axyom Network Manager exposed."
tech:
  - "generic"
tags:
  - "misconfig"
  - "axyom"
  - "exposure"
  - "unauth"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/home"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Axyom Network Manager"
  - type: "status"
    status:
      - 200
