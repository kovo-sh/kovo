id: "wp-email-subscribers-listing"
name: "WordPress Plugin Email Subscribers Listing"
severity: "low"
description: "Searches for sensitive directories present in the email-subscribers plugin."
tech:
  - "wordpress"
tags:
  - "wordpress"
  - "listing"
  - "plugin"
  - "edb"
  - "vuln"
reference: "https://www.exploit-db.com/ghdb/6428"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/email-subscribers"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Index of"
      - "wp-content/plugins/email-subscribers"
    condition: "and"
  - type: "status"
    status:
      - 200
