id: "umbraco-miniprofiler-exposure"
name: "Umbraco Mini Profiler - Exposure"
severity: "low"
description: "Detected the exposure of the MiniProfiler debugging interface in Umbraco CMS. When exposed, it can reveal sensitive information including SQL queries, execution times, stack traces, and internal application details."
tech:
  - "generic"
tags:
  - "umbraco"
  - "miniprofiler"
  - "exposure"
  - "debug"
  - "misconfig"
  - "vuln"
reference: "https://miniprofiler.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/mini-profiler-resources/results"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "StartupProfiler"
      - "var profiler ="
      - "\"DurationMilliseconds\""
    condition: "and"
  - type: "status"
    status:
      - 200
