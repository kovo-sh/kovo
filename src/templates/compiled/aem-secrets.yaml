id: "aem-secrets"
name: "AEM Secrets - Sensitive Information Disclosure"
severity: "high"
description: "Possible Juicy Files can be discovered at this endpoint. Search / Grep for secrets like hashed passwords ( SHA ) , internal email disclosure etc."
tech:
  - "generic"
tags:
  - "aem"
  - "adobe"
  - "misconfig"
  - "exposure"
  - "vuln"
reference: "https://www.linkedin.com/feed/update/urn:li:activity:7066003031271616513/"
spaExclusion: true
request:
  method: "GET"
  path: "/content/dam/formsanddocuments.form.validator.html/home/....children.tidy...infinity..json"
  headers:
    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
    "Accept-Language": "en-US,en;q=0.9,hi;q=0.8"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"jcr:uuid\""
      - "\"jcr:createdBy\""
      - "\"uri\""
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
