id: "arcade-php-sqli"
name: "Arcade.php - SQL Injection"
severity: "high"
description: "The arcade.php script is vulnerable to SQL injection. By exploiting this vulnerability, an attacker can manipulate the SQL queries executed by the script, potentially gaining unauthorized access to the database."
tech:
  - "php"
tags:
  - "arcade"
  - "php"
  - "vbulletin"
  - "sqli"
  - "vuln"
cwe: "CWE-89"
reference: "https://www.exploit-db.com/exploits/29604"
spaExclusion: true
request:
  method: "GET"
  path: "/arcade.php?act=Arcade&do=stats&comment=a&s_id=1'"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "mySQL query error"
  - type: "status"
    status:
      - 200
