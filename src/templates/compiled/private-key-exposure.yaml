id: "private-key-exposure"
name: "Private key exposure via helper detector"
severity: "high"
description: "Searches for private key exposure by attempting to query the helper endpoint on node_modules"
tech:
  - "node"
tags:
  - "exposure"
  - "node"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/node_modules/mqtt/test/helpers/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "Index of /node_modules/mqtt/test/helpers"
      - "Parent Directory"
    condition: "and"
