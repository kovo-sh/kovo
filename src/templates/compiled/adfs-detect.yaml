id: "adfs-detect"
name: "ADFS Detect"
severity: "info"
description: "Detects ADFS with forms-based authentication enabled."
tech:
  - "dotnet"
  - "iis"
tags:
  - "tech"
  - "adfs"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/adfs/ls/idpinitiatedsignon.aspx"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "/adfs/portal/css/style.css"
