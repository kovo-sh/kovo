id: "fastcgi-test-page"
name: "FastCGI Test Page"
severity: "info"
description: "FastCGI test page was discovered."
tech:
  - "generic"
tags:
  - "tech"
  - "fastcgi"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/test/fcgi/test.html"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "FastCGI test page"
      - "FastCGI possibilities test page"
    condition: "and"
  - type: "status"
    status:
      - 200
