id: "oracle-dbass-detect"
name: "Oracle DBaaS Monitor Detect"
severity: "info"
description: "Safe check derived from oracle-dbass-detect: Oracle DBaaS Monitor Detect"
tech:
  - "generic"
tags:
  - "oracle"
  - "tech"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/dbaas_monitor/login"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>DBaaS Monitor</title>"
  - type: "status"
    status:
      - 200
