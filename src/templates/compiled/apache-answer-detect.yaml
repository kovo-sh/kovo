id: "apache-answer-detect"
name: "Apache Answer - Detection"
severity: "info"
description: "Detects Apache Answer version through API endpoit"
tech:
  - "apache"
tags:
  - "detect"
  - "tech"
  - "apache"
  - "discovery"
reference: "https://answer.apache.org/"
spaExclusion: true
request:
  method: "GET"
  path: "/answer/api/v1/siteinfo"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"code\":"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
