id: "freescout-installer"
name: "FreeScout Installer Exposure"
severity: "high"
description: "FreeScout is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "exposure"
  - "install"
  - "freescout"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "FreeScout Installer"
      - "Easy Installation and Setup Wizard"
    condition: "and"
  - type: "status"
    status:
      - 200
