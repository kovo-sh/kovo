id: "drupal-install"
name: "Drupal Install"
severity: "high"
description: "Drupal Install panel exposed."
tech:
  - "drupal"
  - "php"
tags:
  - "misconfig"
  - "drupal"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install.php?profile=default"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Choose language | Drupal</title>"
