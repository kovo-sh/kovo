id: "hazelcast-management-exposure"
name: "Hazelcast Management Center - Configuration Exposure"
severity: "medium"
description: "Detected poor architectural configurations or unsecured REST API endpoints in Hazelcast by checking the cluster endpoint, which exposes internal member IPs, UUIDs, and version information."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "exposure"
  - "hazelcast"
cwe: "CWE-306"
reference: "https://docs.hazelcast.com/imdg/latest/management-center/rest-api"
spaExclusion: true
request:
  method: "GET"
  path: "/hazelcast/rest/cluster"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "memberVersion"
      - "members"
    condition: "and"
  - type: "status"
    status:
      - 200
