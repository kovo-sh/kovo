id: "hikvision-detect"
name: "Hikvision Panel"
severity: "info"
description: "Safe check derived from hikvision-detect: Hikvision Panel"
tech:
  - "generic"
tags:
  - "tech"
  - "hikvision"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/favicon.ico"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Hikvision Digital Technology"
  - type: "word"
    part: "header"
    words:
      - "Hikvision-Webs"
