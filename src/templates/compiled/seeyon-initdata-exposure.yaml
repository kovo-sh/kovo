id: "seeyon-initdata-exposure"
name: "Seeyon OA A6 initDataAssess.jsp - Information Disclosure"
severity: "medium"
description: "Seeyon OA A6 initDataAssess.jsp has leaked user sensitive information, attacker can use the obtained username to blast the user's password to enter the background for further attacks."
tech:
  - "tomcat"
  - "java"
tags:
  - "seeyon"
  - "oa"
  - "info-leak"
  - "vuln"
reference: "https://github.com/achuna33/MYExploit/blob/8ffbf7ee60cbd77ad90b0831b93846aba224ab29/src/main/java/com/achuna33/Controllers/SeeyonController.java"
spaExclusion: true
request:
  method: "GET"
  path: "/yyoa/assess/js/initDataAssess.jsp"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "personList"
      - "personHash.Add"
    condition: "and"
  - type: "status"
    status:
      - 200
