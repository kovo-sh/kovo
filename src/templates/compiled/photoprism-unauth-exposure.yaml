id: "photoprism-unauth-exposure"
name: "PhotoPrism - Unauthenticated Exposure"
severity: "high"
description: "PhotoPrism instance is running in public mode with authentication disabled (PHOTOPRISM_AUTH_MODE=public), exposing all photos, albums, GPS locations, face recognition data, and server configuration to unauthenticated users."
tech:
  - "generic-web-exposure"
tags:
  - "photoprism"
  - "exposure"
  - "unauth"
  - "misconfig"
cwe: "CWE-306"
reference: "https://docs.photoprism.app/getting-started/config-options/#authentication"
spaExclusion: true
request:
  method: "GET"
  path: "/api/v1/config"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "PhotoPrism"
      - "\"public\":true"
      - "\"authMode\":\"public\""
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
