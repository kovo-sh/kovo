id: "pagekit-installer"
name: "Pagekit Installer Exposure"
severity: "high"
description: "Pagekit is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "pagekit"
  - "install"
  - "exposure"
  - "vuln"
reference: "https://github.com/pagekit/pagekit"
spaExclusion: true
request:
  method: "GET"
  path: "/installer"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Pagekit Installer"
      - "Connect database"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
