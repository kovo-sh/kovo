id: "cockpit-detect"
name: "Detect Agentejo Cockpit"
severity: "info"
description: "Safe check derived from cockpit-detect: Detect Agentejo Cockpit"
tech:
  - "generic"
tags:
  - "tech"
  - "cockpit"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/auth/login"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Authenticate Please!</title>"
