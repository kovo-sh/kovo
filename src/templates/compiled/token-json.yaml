id: "token-json"
name: "Token Json File Disclosure"
severity: "low"
description: "Internal token.json file is exposed."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "cloud"
  - "google"
  - "devops"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/token.json"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"access_token\":"
      - "\"token_type\":"
    condition: "and"
  - type: "status"
    status:
      - 200
