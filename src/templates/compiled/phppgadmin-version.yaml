id: "phppgadmin-version"
name: "PhpPgAdmin Version Information - Detect"
severity: "info"
description: "PhpPgAdmin version information was detected via the intro.php file."
tech:
  - "php"
tags:
  - "tech"
  - "phppgadmin"
  - "discovery"
cwe: "CWE-200"
spaExclusion: true
request:
  method: "GET"
  path: "/phppgadmin/intro.php"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "<span class=\"appname\">phpPgAdmin</span> <span class=\"version\">.*</span>"
  - type: "status"
    status:
      - 200
