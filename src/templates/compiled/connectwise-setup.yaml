id: "connectwise-setup"
name: "ConnectWise Setup Wizard - Exposure"
severity: "high"
description: "Safe check derived from connectwise-setup: ConnectWise Setup Wizard - Exposure"
tech:
  - "dotnet"
  - "iis"
tags:
  - "misconfig"
  - "exposure"
  - "install"
  - "connectwise"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/SetupWizard.aspx"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "SetupWizardPage"
      - "ContentPanel SetupWizard"
    condition: "and"
  - type: "status"
    status:
      - 200
