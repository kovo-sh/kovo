id: "smokeping-grapher"
name: "SmokePing Latency Page for Network Latency Grapher"
severity: "low"
description: "SmokePing Latency Page is exposed."
tech:
  - "generic"
tags:
  - "misconfig"
  - "smokeping"
  - "latency"
  - "grapher"
  - "vuln"
reference: "https://www.facebook.com/photo/?fbid=620494143454442&set=a.467014098802448"
spaExclusion: true
request:
  method: "GET"
  path: "/smokeping/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "SmokePing Latency Page for"
  - type: "status"
    status:
      - 200
