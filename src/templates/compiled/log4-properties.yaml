id: "log4-properties"
name: "Log4j Properties - File Disclosure"
severity: "low"
description: "Log4j Properties file is exposed."
tech:
  - "generic"
tags:
  - "exposure"
  - "files"
  - "log4j"
  - "oracle"
  - "vuln"
reference: "https://docs.oracle.com/cd/E29578_01/webhelp/cas_webcrawler/src/cwcg_config_log4j_file.html"
spaExclusion: true
request:
  method: "GET"
  path: "/log4j.properties"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "log4j.rootLogger="
      - "log4j.logger"
    condition: "and"
  - type: "status"
    status:
      - 200
