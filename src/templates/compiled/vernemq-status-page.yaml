id: "vernemq-status-page"
name: "VerneMQ Status Page"
severity: "low"
description: "VerneMQ Status Page is exposed."
tech:
  - "generic"
tags:
  - "misconfig"
  - "vernemq"
  - "status"
  - "vuln"
reference: "https://github.com/vernemq/vernemq"
spaExclusion: true
request:
  method: "GET"
  path: "/status"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "VerneMQ"
      - "Issues"
      - "Cluster Overview"
      - "Node Status"
    condition: "and"
  - type: "status"
    status:
      - 200
