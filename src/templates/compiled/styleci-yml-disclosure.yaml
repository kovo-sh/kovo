id: "styleci-yml-disclosure"
name: "StyleCi Yaml File Disclosure"
severity: "info"
description: "Safe check derived from styleci-yml-disclosure: StyleCi Yaml File Disclosure"
tech:
  - "generic"
tags:
  - "config"
  - "exposure"
  - "devops"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/.styleci.yml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "php"
      - "preset"
      - "disabled"
    condition: "and"
  - type: "status"
    status:
      - 200
