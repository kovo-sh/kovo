id: "netsparker-enterprise-installer"
name: "Netsparker Enterprise Installer"
severity: "info"
description: "Netsparker Enterprise is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic"
tags:
  - "misconfig"
  - "exposure"
  - "install"
  - "netsparker"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/wizard/database/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Netsparker Enterprise - Installation Wizard"
      - "Netsparker Ltd"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
