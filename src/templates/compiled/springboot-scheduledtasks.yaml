id: "springboot-scheduledtasks"
name: "Spring Boot Scheduledtasks Actuator Panel - Detect"
severity: "info"
description: "Spring Boot Scheduledtasks Actuator panel was detected."
tech:
  - "springboot"
  - "actuator"
tags:
  - "misconfig"
  - "springboot"
  - "exposure"
  - "vuln"
cwe: "CWE-200"
reference: "https://docs.spring.io/spring-boot/docs/current/actuator-api/htmlsingle/#scheduled-tasks"
spaExclusion: true
request:
  method: "GET"
  path: "/scheduledtasks"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "cron"
      - "fixedDelay"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
      - "application/vnd.spring-boot.actuator"
      - "application/vnd.spring-boot.actuator.v1+json"
      - "application/vnd.spring-boot.actuator.v2+json"
  - type: "status"
    status:
      - 200
