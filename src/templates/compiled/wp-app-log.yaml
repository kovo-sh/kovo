id: "wp-app-log"
name: "Discover wp-app.log Files"
severity: "info"
description: "wp-app.log file is exposed."
tech:
  - "wordpress"
tags:
  - "exposure"
  - "logs"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-app.log"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "LANG"
      - "Array"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
      - "application/javascript"
    negative: true
  - type: "status"
    status:
      - 200
