id: "postgres-credentials-exposure"
name: "PostgreSQL Credentials - Exposure"
severity: "high"
description: "Detects the exposure of PostgreSQL credentials and history files (.pgpass) via HTTP. These files may contain plaintext database usernames and passwords, and their leakage could allow unauthorized access to sensitive databases or internal infrastructure."
tech:
  - "generic"
tags:
  - "exposure"
  - "config"
  - "postgres"
  - "database"
  - "vuln"
reference: "https://www.postgresql.org/docs/current/libpq-pgpass.html"
spaExclusion: true
request:
  method: "GET"
  path: "/.pgpass"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "([a-zA-Z0-9.-]+):5432:([a-zA-Z0-9_*-]+):([a-zA-Z0-9_-]+):(.+)"
  - type: "status"
    status:
      - 200
