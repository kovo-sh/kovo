id: "rancher-incomplete-setup"
name: "Rancher - Incomplete Setup Exposure"
severity: "low"
description: "Detected Rancher installation was found with an incomplete first-time setup. The bootstrap login page was publicly accessible at /dashboard/auth/login, indicating an unconfigured instance that could have been targeted for unauthorized setup completion."
tech:
  - "generic"
tags:
  - "rancher"
  - "misconfig"
  - "exposure"
  - "vuln"
reference: "https://rancher.com/docs/rancher/v2.6/en/installation/"
spaExclusion: true
request:
  method: "GET"
  path: "/v3/settings/first-login"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"value\":\"true\""
      - "\"name\":\"first-login\""
    condition: "and"
  - type: "status"
    status:
      - 200
