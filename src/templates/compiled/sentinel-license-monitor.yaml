id: "sentinel-license-monitor"
name: "Sentinel License Monitor - Detect"
severity: "info"
description: "Safe check derived from sentinel-license-monitor: Sentinel License Monitor - Detect"
tech:
  - "generic"
tags:
  - "misconfig"
  - "sentinel"
  - "license"
  - "monitor"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/keyinfo.html"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Sentinel License Monitor"
      - "Licenses-in-use"
    condition: "and"
  - type: "status"
    status:
      - 200
