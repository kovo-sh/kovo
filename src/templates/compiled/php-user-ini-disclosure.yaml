id: "php-user-ini-disclosure"
name: "Php User.ini Disclosure"
severity: "medium"
description: "PHP user.ini file is exposed."
tech:
  - "php"
tags:
  - "exposure"
  - "config"
  - "files"
  - "vuln"
reference: "https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/php-user-ini-disclosure.json"
spaExclusion: true
request:
  method: "GET"
  path: "/user.ini"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "assert"
      - "highlight"
      - "opcache"
      - "mssql"
      - "oci8"
      - "agent"
    condition: "and"
  - type: "status"
    status:
      - 200
