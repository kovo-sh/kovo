id: "springboot-threaddump"
name: "Detect Springboot Thread Dump page"
severity: "low"
description: "The threaddump endpoint provides a thread dump from the application's JVM."
tech:
  - "springboot"
tags:
  - "springboot"
  - "misconfig"
  - "vuln"
reference: "https://docs.spring.io/spring-boot/docs/2.4.11-SNAPSHOT/actuator-api/htmlsingle/#threaddump"
spaExclusion: true
request:
  method: "GET"
  path: "/threaddump"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"threads\":"
      - "\"threadName\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
      - "application/vnd.spring-boot.actuator"
      - "application/vnd.spring-boot.actuator.v2+json"
      - "application/vnd.spring-boot.actuator.v1+json"
  - type: "status"
    status:
      - 200
