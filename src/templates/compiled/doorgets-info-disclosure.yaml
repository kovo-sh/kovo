id: "doorgets-info-disclosure"
name: "DoorGets CMS v7.0 - Information Disclosure"
severity: "high"
description: "doorGets 7.0 has a sensitive information disclosure vulnerability in /setup/temp/admin.php. A remote unauthenticated attacker could exploit this vulnerability to obtain administrator's password."
tech:
  - "php"
tags:
  - "doorgets"
  - "cms"
  - "packetstorm"
  - "disclosure"
  - "vuln"
reference: "https://packetstormsecurity.com/files/174236/DoorGets-CMS-7.0-Information-Disclosure.html"
spaExclusion: true
request:
  method: "GET"
  path: "/v12/setup/temp/admin.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - ":\"email\";"
      - ":\"password\";"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
