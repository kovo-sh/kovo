id: "redpanda-console"
name: "Redpanda Console - Exposure"
severity: "medium"
description: "Unauthorized access to the Redpanda Console could allow attackers to view or manipulate streaming data, monitor clusters, or access configuration information, leading to potential data leaks or service disruption."
tech:
  - "generic"
tags:
  - "misconfig"
  - "redpanda"
  - "console"
  - "streaming"
  - "vuln"
reference: "https://github.com/redpanda-data/console"
spaExclusion: true
request:
  method: "GET"
  path: "/overview"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Redpanda Console"
  - type: "status"
    status:
      - 200
