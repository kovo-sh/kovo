id: "call-com-installer"
name: "Call.com Setup Page - Exposure"
severity: "high"
description: "Detects exposed Call.com Setup page."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "install"
  - "exposure"
  - "cal"
  - "vuln"
reference: "https://cal.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/auth/setup"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Setup | Cal.com"
      - "Minimum 15 characters long</li>"
    condition: "and"
  - type: "status"
    status:
      - 200
