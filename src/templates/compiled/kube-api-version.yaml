id: "kube-api-version"
name: "Kube API Version"
severity: "info"
description: "Searches for exposed Kubernetes API servers which return version information unauthenticated"
tech:
  - "kubernetes"
tags:
  - "tech"
  - "k8s"
  - "kubernetes"
  - "devops"
  - "kube"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/version"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "\"major\":"
      - "\"minor\":"
      - "\"goVersion\":"
    condition: "and"
