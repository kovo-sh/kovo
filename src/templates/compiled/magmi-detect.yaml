id: "magmi-detect"
name: "MAGMI (Magento Mass Importer) Plugin Detect"
severity: "info"
description: "Safe check derived from magmi-detect: MAGMI (Magento Mass Importer) Plugin Detect"
tech:
  - "generic"
tags:
  - "magento"
  - "magmi"
  - "plugin"
  - "tech"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/magmi/web/js/magmi_utils.js"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "magmi_multifield"
  - type: "status"
    status:
      - 200
