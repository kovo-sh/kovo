id: "glpi-status-page"
name: "GLPI Status Page - Detect"
severity: "info"
description: "A php status page that indicates if local or ldap identity is used for glpi."
tech:
  - "php"
tags:
  - "tech"
  - "status"
  - "glpi"
  - "discovery"
reference: "https://buildmedia.readthedocs.org/media/pdf/glpi-user-documentation/latest/glpi-user-documentation.pdf"
spaExclusion: true
request:
  method: "GET"
  path: "/status.php"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "GLPI_DB_OK"
      - "GLPI_SESSION_DIR_OK"
      - "GLPI_OK"
  - type: "status"
    status:
      - 200
