id: "db-xml-file"
name: "db.xml File - Detect"
severity: "medium"
description: "db.xml file was detected."
tech:
  - "generic"
tags:
  - "misconfig"
  - "db"
  - "files"
  - "exposure"
  - "vuln"
cwe: "CWE-200"
spaExclusion: true
request:
  method: "GET"
  path: "/db.xml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<ServerName>"
      - "<DBPASS>"
      - "<DBtype>"
    condition: "and"
  - type: "status"
    status:
      - 200
