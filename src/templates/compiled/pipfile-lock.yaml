id: "pipfile-lock"
name: "Pipfile.lock Disclosure"
severity: "info"
description: "Safe check derived from pipfile-lock: Pipfile.lock Disclosure"
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "pip"
  - "devops"
  - "cicd"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/Pipfile.lock"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"pipfile-spec\":"
      - "\"requires\""
    condition: "and"
  - type: "status"
    status:
      - 200
