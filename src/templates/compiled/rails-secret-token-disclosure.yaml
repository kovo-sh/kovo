id: "rails-secret-token-disclosure"
name: "Ruby on Rails Secret Token Disclosure"
severity: "medium"
description: "Ruby on Rails Secret Token file is exposed."
tech:
  - "rails"
tags:
  - "exposure"
  - "files"
  - "rails"
  - "ruby"
  - "token"
  - "vuln"
reference: "https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/ruby-on-rails-secret-token-disclosure.json"
spaExclusion: true
request:
  method: "GET"
  path: "/config/initializers/secret_token.rb"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "secret_key_base ="
      - "config.secret_token ="
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
    negative: true
  - type: "status"
    status:
      - 200
