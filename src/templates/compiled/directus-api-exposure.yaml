id: "directus-api-exposure"
name: "Directus Server Info - Unauthenticated Fingerprint"
severity: "info"
description: "Directus /server/info endpoint is exposed without authentication, leaking project metadata and license configuration."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "directus"
  - "fingerprint"
  - "unauth"
reference: "https://directus.io/docs/api/server"
spaExclusion: true
request:
  method: "GET"
  path: "/server/info"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"display_powered_by\""
      - "\"DIRECTUS\""
      - "\"entitlements\""
    condition: "and"
  - type: "status"
    status:
      - 200
