id: "owncloud-status-page"
name: "Owncloud StatusPage detection"
severity: "info"
description: "Safe check derived from owncloud-status-page: Owncloud StatusPage detection"
tech:
  - "php"
tags:
  - "tech"
  - "owncloud"
  - "status"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/status.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"versionstring\":"
      - "\"installed\":"
      - "\"edition\":"
    condition: "and"
