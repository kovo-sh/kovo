id: "cisco-ucm-cluster-enum"
name: "Cisco Unified Communications Manager - Cluster Enumeration"
severity: "low"
description: "Enumerated Cisco UCM cluster nodes (servers) using the unauthenticated UDS API (XML), allowing identification of backend servers without authentication."
tech:
  - "cisco"
tags:
  - "cisco"
  - "ucm"
  - "misconfig"
  - "vuln"
reference: "https://developer.cisco.com/site/user-data-services/develop-and-test/api-reference/#servers"
spaExclusion: true
request:
  method: "GET"
  path: "/cucm-uds/servers"
  headers:
    "Accept": "application/xml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "text/xml"
      - "application/xml"
  - type: "word"
    part: "body"
    words:
      - "<servers uri"
      - "<server>"
    condition: "and"
