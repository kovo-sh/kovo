id: "joomla-installer"
name: "Joomla! Installer Exposure"
severity: "high"
description: "Joomla is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "joomla"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/installation/index.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Joomla! Web Installer"
      - "Configuration"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
