id: "sound4-directory-listing"
name: "SOUND4 Impact/Pulse/First/Eco <=2.x - Information Disclosure"
severity: "medium"
description: "The application is vulnerable to sensitive directory indexing / information disclosure vulnerability. An unauthenticated attacker can visit the log directory and disclose the server's log files containing sensitive and system information."
tech:
  - "generic"
tags:
  - "misconfig"
  - "listing"
  - "sound4"
  - "disclosure"
  - "packetstorm"
  - "vuln"
reference: "https://packetstormsecurity.com/files/170259/SOUND4-IMPACT-FIRST-PULSE-Eco-2.x-Information-Disclosure.html"
spaExclusion: true
request:
  method: "GET"
  path: "/log/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Index of /log</title>"
      - "Parent Directory"
    condition: "and"
  - type: "status"
    status:
      - 200
