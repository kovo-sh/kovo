id: "ruckus-smartzone-install"
name: "Ruckus SmartZone Exposed Installation"
severity: "high"
description: "Ruckus SmartZone is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "ruckus"
  - "smartzone"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/adminweb/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Welcome to the Ruckus"
      - "Setup Wizard"
    condition: "and"
  - type: "status"
    status:
      - 200
