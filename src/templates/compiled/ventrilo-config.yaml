id: "ventrilo-config"
name: "Ventrilo Configuration File - Detect"
severity: "high"
description: "Ventrilo configuration file was detected, The file discloses the application's Adminpassword and Password."
tech:
  - "generic-web-exposure"
tags:
  - "ventrilo"
  - "config"
  - "exposure"
  - "vuln"
cwe: "CWE-200"
reference: "https://www.ventrilo.com/setup.php"
spaExclusion: true
request:
  method: "GET"
  path: "/ventrilo_srv.ini"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "[Server]"
      - "Name"
      - "Phonetic"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
  - type: "status"
    status:
      - 200
