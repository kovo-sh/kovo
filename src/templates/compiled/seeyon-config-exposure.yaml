id: "seeyon-config-exposure"
name: "Seeyon OA A6 config.jsp - Information Disclosure"
severity: "medium"
description: "The Seeyon OA A6 config.jsp page can be accessed without authorization, resulting in sensitive information leakage vulnerabilities, through which attackers can obtain sensitive information in the server"
tech:
  - "tomcat"
  - "java"
tags:
  - "seeyon"
  - "oa"
  - "config"
  - "info-leak"
  - "vuln"
reference: "https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/oa/%E8%87%B4%E8%BF%9COA/%E8%87%B4%E8%BF%9COA%20A6%20config.jsp%20%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E6%B3%84%E6%BC%8F%E6%BC%8F%E6%B4%9E.md"
spaExclusion: true
request:
  method: "GET"
  path: "/yyoa/ext/trafaxserver/SystemManage/config.jsp"
  headers:
    "Content-Type": "application/x-www-form-urlencoded"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DatabaseName="
      - "请在文本框内配置传真插件所需服务器的信息"
    condition: "and"
  - type: "status"
    status:
      - 200
