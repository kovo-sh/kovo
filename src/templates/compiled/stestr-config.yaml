id: "stestr-config"
name: "Stestr Configuration File - Detect"
severity: "info"
description: "Stestr configuration file was detected."
tech:
  - "generic"
tags:
  - "exposure"
  - "stestr"
  - "config"
  - "files"
  - "vuln"
cwe: "CWE-200"
reference: "https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt"
spaExclusion: true
request:
  method: "GET"
  path: "/.stestr.conf"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "[DEFAULT]"
      - "test_path="
    condition: "and"
  - type: "status"
    status:
      - 200
