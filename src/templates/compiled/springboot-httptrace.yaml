id: "springboot-httptrace"
name: "Detect Springboot httptrace"
severity: "low"
description: "View recent HTTP requests and responses"
tech:
  - "springboot"
tags:
  - "springboot"
  - "exposure"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/httptrace"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"traces\""
      - "\"timestamp\""
      - "\"principal\""
      - "\"session\""
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
      - "application/vnd.spring-boot.actuator"
      - "application/vnd.spring-boot.actuator.v1+json"
  - type: "status"
    status:
      - 200
