id: "imprivata-installer"
name: "Imprivata Appliance Installation Exposure"
severity: "medium"
description: "Imprivata Appliance is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "imprivata"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/wizard/base.php"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Appliance Setup Wizard"
      - "Imprivata"
    condition: "and"
  - type: "status"
    status:
      - 200
