id: "repetier-unauth"
name: "Repetier Server Dashboard - Unauthenticated"
severity: "high"
description: "Repetier Server Dashboard has been exposed."
tech:
  - "generic"
tags:
  - "repetier"
  - "dashboard"
  - "unauth"
  - "misconfig"
  - "intrusive"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/#!/printer/Prusa_I3/print"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Global Settings"
      - "Edit Profile"
      - "Logout"
      - "Clear all Messages"
    condition: "and"
  - type: "status"
    status:
      - 200
