id: "kyan-credential-exposure"
name: "Kyan Credential - Exposure"
severity: "medium"
description: "Kyan Network login panel was detected. Password and other credential theft is possible via accessing this panel."
tech:
  - "generic-web-exposure"
tags:
  - "kyan"
  - "exposure"
  - "config"
  - "vuln"
cwe: "CWE-200"
reference: "https://mp.weixin.qq.com/s/6phWjDrGG0pCpGuCdLusIg"
spaExclusion: true
request:
  method: "GET"
  path: "/hosts"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "UserName="
      - "Password="
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
  - type: "status"
    status:
      - 200
