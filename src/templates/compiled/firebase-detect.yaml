id: "firebase-detect"
name: "firebase detect"
severity: "low"
description: "Safe check derived from firebase-detect: firebase detect"
tech:
  - "generic"
tags:
  - "tech"
  - "firebase"
  - "discovery"
reference: "http://ghostlulz.com/google-exposed-firebase-database/"
spaExclusion: true
request:
  method: "GET"
  path: "/.settings/rules.json?auth=FIREBASE_SECRET"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Could not parse auth token"
