id: "lesshst-history"
name: "Less History - File Disclosure"
severity: "low"
description: "LESSHST file is a Less History File. LESSHST file is a Less History File. Less is a terminal pager program on Unix, Windows, and Unix-like systems used to view (but not change) the contents of a text file one screen at a time."
tech:
  - "generic"
tags:
  - "misconfig"
  - "disclosure"
  - "config"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/.lesshst"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - ".less-history-file:"
  - type: "word"
    part: "all"
    words:
      - "<?xml"
      - "<env"
      - "application/javascript"
      - "application/json"
      - "application/xml"
      - "html>"
      - "text/html"
      - "image/"
    negative: true
  - type: "status"
    status:
      - 200
