id: "webpagetest-ssrf"
name: "Web Page Test - Server Side Request Forgery (SSRF)"
severity: "high"
description: "Web Page Test is vulnerable to SSRF."
tech:
  - "php"
tags:
  - "ssrf"
  - "webpagetest"
  - "oast"
  - "vuln"
cwe: "CWE-918"
reference: "https://thinkloveshare.com/hacking/preauth_remote_code_execution_web_page_test/"
spaExclusion: true
request:
  method: "GET"
  path: "/jpeginfo/jpeginfo.php?url={{guardian_canary_http}}"
control:
  method: "GET"
  path: "/jpeginfo/jpeginfo.php?url=guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "File is not a JPEG Image"
  - type: "canary"
    protocol: "http"
