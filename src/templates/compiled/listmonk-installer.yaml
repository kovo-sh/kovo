id: "listmonk-installer"
name: "Listmonk Installer Exposure"
severity: "high"
description: "Listmonk is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic"
tags:
  - "misconfig"
  - "listmonk"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/admin/login?next=%2Fadmin"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "This is a fresh install"
      - "Super Admin account"
      - "listmonk"
    condition: "and"
  - type: "status"
    status:
      - 200
