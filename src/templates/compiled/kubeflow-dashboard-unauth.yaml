id: "kubeflow-dashboard-unauth"
name: "Kubeflow Unauth"
severity: "high"
description: "Kubeflow internal data is exposed."
tech:
  - "generic-web-exposure"
tags:
  - "kubeflow"
  - "unauth"
  - "misconfig"
  - "vuln"
reference: "https://github.com/kubeflow/kubeflow"
spaExclusion: true
request:
  method: "GET"
  path: "/pipeline/apis/v1beta1/runs?page_size=5&sort_by=created_at%20desc"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "{\"runs\":[{\"id\":"
      - "resource_references"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
