id: "binom-installer"
name: "Binom Installer Exposure"
severity: "high"
description: "Binom is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "binom"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Install Binom</title>"
      - "System check"
    condition: "and"
  - type: "status"
    status:
      - 200
