id: "unauthenticated-lansweeper"
name: "Unauthenticated Lansweeper Instance"
severity: "high"
description: "Lansweeper Instance is exposed."
tech:
  - "dotnet"
  - "iis"
tags:
  - "lansweeper"
  - "unauth"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/Default.aspx"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Main page - Lansweeper"
