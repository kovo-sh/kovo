id: "artica-web-proxy-detect"
name: "Artica Web Proxy Detect"
severity: "info"
description: "Safe check derived from artica-web-proxy-detect: Artica Web Proxy Detect"
tech:
  - "php"
tags:
  - "tech"
  - "artica"
  - "proxy"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/fw.login.php"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Welcome to the Artica Web Administration Interface"
  - type: "status"
    status:
      - 200
