id: "lucee-unset-credentials"
name: "Lucee - Unset Credentials"
severity: "high"
description: "The Lucee admin panel has a first-time setup page which allows any user to set the administrator password."
tech:
  - "generic"
tags:
  - "lucee"
  - "default-login"
  - "unauth"
  - "vuln"
cwe: "CWE-798"
reference: "https://luceeserver.atlassian.net/browse/LDEV-926"
spaExclusion: true
request:
  method: "GET"
  path: "/lucee/admin/web.cfm"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Lucee"
      - "box\">New Password</div>"
    condition: "and"
  - type: "status"
    status:
      - 200
