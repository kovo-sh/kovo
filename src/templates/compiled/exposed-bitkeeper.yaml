id: "exposed-bitkeeper"
name: "BitKeeper Configuration - Detect"
severity: "low"
description: "BitKeeper configuration was detected."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "exposure"
  - "vuln"
reference: "https://www.bitkeeper.org/man/config-etc.html"
spaExclusion: true
request:
  method: "GET"
  path: "/BitKeeper/etc/config"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "BitKeeper configuration"
      - "logging"
      - "email"
      - "description"
    condition: "and"
  - type: "status"
    status:
      - 200
