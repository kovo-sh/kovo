id: "ecology-mysql-config"
name: "Fanwei OA E-Office - Information Disclosure"
severity: "medium"
description: "Fanwei E-Office mysql_config.ini file can be directly accessed, leaking database account password and other information."
tech:
  - "generic"
tags:
  - "fanwei"
  - "ecology"
  - "exposure"
  - "config"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/mysql_config.ini"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "dataurl"
      - "datapassword"
      - "datauser"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
  - type: "status"
    status:
      - 200
