id: "craftcms-log-disclosure"
name: "Craft CMS - Log File Disclosure"
severity: "medium"
description: "Detected exposed Craft CMS log files due to misconfiguration, allowing unauthenticated access to sensitive information including error messages, stack traces, database queries, and potentially credentials or session data."
tech:
  - "generic-web-exposure"
tags:
  - "craftcms"
  - "cms"
  - "exposure"
  - "logs"
  - "misconfig"
  - "vuln"
reference: "https://craftcms.com/docs/5.x/system/logging.html"
spaExclusion: true
request:
  method: "GET"
  path: "/storage/logs/web.log"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "craft_cms"
      - "UrlManager"
      - "schemaVersion"
    condition: "and"
  - type: "status"
    status:
      - 200
