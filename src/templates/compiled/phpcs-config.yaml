id: "phpcs-config"
name: "PHP_CodeSniffer Configuration Exposure - Detect"
severity: "info"
description: "PHP_CodeSniffer configuration file was detected."
tech:
  - "php"
tags:
  - "devops"
  - "exposure"
  - "php"
  - "phpcs"
  - "vuln"
cwe: "CWE-200"
reference: "https://github.com/squizlabs/PHP_CodeSniffer"
spaExclusion: true
request:
  method: "GET"
  path: "/phpcs.xml"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "ruleset name"
      - "rule ref="
      - "<file>"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/xml"
  - type: "status"
    status:
      - 200
