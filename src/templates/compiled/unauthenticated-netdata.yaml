id: "unauthenticated-netdata"
name: "Unauthenticated Netdata"
severity: "medium"
description: "Netdata is exposed."
tech:
  - "generic"
tags:
  - "netdata"
  - "unauth"
  - "misconfig"
  - "vuln"
reference: "https://github.com/netdata/netdata"
spaExclusion: true
request:
  method: "GET"
  path: "/api/v1/data?chart=system.cpu&format=json&points=125&group=average&gtime=0&options=ms%7Cflip%7Cjsonwrap%7Cnonzero&after=-120&dimensions=iowait"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "view_update_every"
      - "dimensions"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
