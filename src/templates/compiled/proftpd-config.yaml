id: "proftpd-config"
name: "ProFTPD Configuration File - Detect"
severity: "info"
description: "ProFTPD configuration file was detected."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "exposure"
  - "proftpd"
  - "vuln"
cwe: "CWE-200"
reference: "http://www.proftpd.org/docs/howto/ConfigFile.html"
spaExclusion: true
request:
  method: "GET"
  path: "/proftpd.conf"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "ProFTPD"
      - "ServerName"
    condition: "and"
  - type: "status"
    status:
      - 200
