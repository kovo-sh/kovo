id: "sap-web-dispatcher-detection"
name: "SAP Web Dispatcher detection"
severity: "info"
description: "Detection of SAP Web Dispatcher service"
tech:
  - "generic"
tags:
  - "sap"
  - "webserver"
  - "proxy"
  - "tech"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/inormalydonotexist"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "This error page was generated by SAP Web Dispatcher"
