id: "wp-security-hidden-login-exposure"
name: "WordPress All-in-One Security <=4.4.1 - Hidden Login Page Exposure"
severity: "medium"
description: "WordPress All-in-One Security plugin through 4.4.1 contains an exposure of the actual URL of the \"hidden login page\" feature."
tech:
  - "wordpress"
tags:
  - "wp-plugin"
  - "exposure"
  - "wordpress"
  - "wp"
  - "wpscan"
  - "vuln"
reference: "https://wpscan.com/vulnerability/467673ad-d0ad-46a3-80c7-8ebb3813a4b3/"
spaExclusion: true
request:
  method: "GET"
  path: "/?aiowpsec_do_log_out=1&al_additional_data=1"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Username or Email Address"
      - "wp_attempt_focus"
    condition: "and"
  - type: "status"
    status:
      - 200
