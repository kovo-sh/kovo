id: "mautic-installer"
name: "Mautic Installer Exposure"
severity: "high"
description: "Mautic is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic"
tags:
  - "misconfig"
  - "mautic"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/installer"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Mautic Installation - Environment Check"
      - "Ready to Install!"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
