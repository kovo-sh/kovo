id: "couchdb-adminparty"
name: "CouchDB Admin Default - Detect"
severity: "high"
description: "CouchDB is susceptible to requests in the context of an admin user."
tech:
  - "generic"
tags:
  - "couchdb"
  - "vuln"
cwe: "CWE-200"
reference: "https://docs.couchdb.org/en/stable/intro/security.html#authentication-database"
spaExclusion: true
request:
  method: "GET"
  path: "/_users/_all_docs"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "header"
    words:
      - "CouchDB/"
      - "Erlang OTP/"
    condition: "and"
  - type: "word"
    part: "body"
    words:
      - "total_rows"
      - "offset"
    condition: "and"
