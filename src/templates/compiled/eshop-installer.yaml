id: "eshop-installer"
name: "EShop Installer Exposure"
severity: "high"
description: "EShop is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "eshop"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "eShop Installer"
      - "Welcome to Installer"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
