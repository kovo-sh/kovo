id: "kube-api-pods"
name: "Kube API Pods"
severity: "info"
description: "Scans for kube pods"
tech:
  - "kubernetes"
tags:
  - "tech"
  - "k8s"
  - "kubernetes"
  - "devops"
  - "kube"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/api/v1/namespaces/default/pods"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "\"PodList\":"
      - "\"items\":"
    condition: "and"
