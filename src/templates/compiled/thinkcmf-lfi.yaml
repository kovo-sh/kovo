id: "thinkcmf-lfi"
name: "ThinkCMF - Local File Inclusion"
severity: "high"
description: "ThinkCMF is vulnerable to local file inclusion."
tech:
  - "generic"
tags:
  - "thinkcmf"
  - "lfi"
  - "vuln"
reference: "https://www.freebuf.com/vuls/217586.html"
spaExclusion: true
request:
  method: "GET"
  path: "/?a=display&templateFile=README.md"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "ThinkCMF"
      - "## README"
      - "## UPDATE"
    condition: "and"
  - type: "status"
    status:
      - 200
