id: "unauthenticated-tensorboard"
name: "Tensorflow Tensorboard - Unauthenticated Access"
severity: "high"
description: "Tensorflow Tensorboard was able to be accessed with no authentication requirements in place."
tech:
  - "generic"
tags:
  - "tensorflow"
  - "tensorboard"
  - "unauth"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/data/plugins_listing"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "scalars"
      - "loading_mechanism"
      - "custom_scalars"
    condition: "and"
  - type: "status"
    status:
      - 200
