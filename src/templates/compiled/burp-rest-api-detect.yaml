id: "burp-rest-api-detect"
name: "Burp Rest API Server Running"
severity: "info"
description: "Safe check derived from burp-rest-api-detect: Burp Rest API Server Running"
tech:
  - "generic"
tags:
  - "burp"
  - "tech"
  - "discovery"
reference: "https://portswigger.net/burp/documentation/enterprise/api-reference"
spaExclusion: true
request:
  method: "GET"
  path: "/v0.1/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Burp API</title>"
  - type: "word"
    part: "header"
    words:
      - "X-Burp-Version"
  - type: "status"
    status:
      - 200
