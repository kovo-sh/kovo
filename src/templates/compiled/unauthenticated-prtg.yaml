id: "unauthenticated-prtg"
name: "PRTG Traffic Grapher - Unauthenticated Access"
severity: "high"
description: "PRTG Traffic Grapher was able to be accessed with no authentication requirements in place."
tech:
  - "generic"
tags:
  - "config"
  - "unauth"
  - "prtg"
  - "edb"
  - "misconfig"
  - "vuln"
reference: "https://www.exploit-db.com/ghdb/5808"
spaExclusion: true
request:
  method: "GET"
  path: "/sensorlist.htm"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "PRTG Traffic Grapher"
    condition: "and"
  - type: "status"
    status:
      - 200
