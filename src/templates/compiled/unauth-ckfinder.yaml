id: "unauth-ckfinder"
name: "CKFinder - Unauthenticated Exposure"
severity: "high"
description: "The CKFinder file manager was found to be exposed without authentication, allowing unauthenticated users to directly access its web interface. Due to this misconfiguration, attackers were able to browse server directories, upload arbitrary files, and manage existing files."
tech:
  - "generic"
tags:
  - "ckfinder"
  - "misconfig"
  - "unauth"
  - "vuln"
reference: "https://cksource.com/ckfinder"
spaExclusion: true
request:
  method: "GET"
  path: "/ckfinder/ckfinder.html"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>CKFinder</title>"
      - "CKFinderFrameWindow"
      - "var ckfinder = new CKFinder"
      - "CKFinder.start()"
  - type: "status"
    status:
      - 200
