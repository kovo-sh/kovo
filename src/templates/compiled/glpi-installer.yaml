id: "glpi-installer"
name: "GLPI Installation Page - Exposure"
severity: "high"
description: "Detects exposed GLPI Setup page."
tech:
  - "php"
tags:
  - "misconfig"
  - "install"
  - "exposure"
  - "glpi"
  - "vuln"
reference: "https://glpi-project.org/"
spaExclusion: true
request:
  method: "GET"
  path: "/install/install.php"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Setup GLPI"
  - type: "status"
    status:
      - 200
