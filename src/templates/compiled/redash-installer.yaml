id: "redash-installer"
name: "Redash Installer Exposure"
severity: "high"
description: "Redash is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "redash"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/setup"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Redash Initial Setup"
      - "Admin User"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
