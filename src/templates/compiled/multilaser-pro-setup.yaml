id: "multilaser-pro-setup"
name: "Multilaser Pro Setup Page - Detect"
severity: "high"
description: "This allows the user to access quick setup settings and configuration page through /wizard.htm."
tech:
  - "generic"
tags:
  - "misconfig"
  - "multilaser"
  - "setup"
  - "config"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/wizard.htm"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Setup Wizard"
      - "multilaser.png"
    condition: "and"
  - type: "status"
    status:
      - 200
