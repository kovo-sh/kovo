id: "atlassian-bamboo-build"
name: "Atlassian Bamboo Build Dashboard"
severity: "info"
description: "Safe check derived from atlassian-bamboo-build: Atlassian Bamboo Build Dashboard"
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "atlassian"
  - "bamboo"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/allPlans.action"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<th>Project</th>"
      - "<th>Plan</th>"
      - "<th>Build</th>"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
