id: "apache-hertzbeat-detect"
name: "Apache Hertzbeat - Detect"
severity: "info"
description: "Detects a Apache Hertzbeat web application is in use, that is a real-time monitoring system with agentless, performance cluster, prometheus-compatible, custom monitoring and status page building capabilities."
tech:
  - "apache"
tags:
  - "tech"
  - "hertzbeat"
  - "apache"
  - "detect"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/assets/app-data.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"name\": \"HertzBeat\""
      - "hertzbeat.apache.org"
  - type: "status"
    status:
      - 200
