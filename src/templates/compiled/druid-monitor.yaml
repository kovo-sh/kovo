id: "druid-monitor"
name: "Alibaba Druid Monitor Unauthorized Access"
severity: "high"
description: "Alibaba Druid Monitor is exposed."
tech:
  - "generic-web-exposure"
tags:
  - "druid"
  - "alibaba"
  - "unauth"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/druid/index.html"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Druid Stat Index</title>"
  - type: "status"
    status:
      - 200
