id: "spip-install"
name: "SPIP Install - Exposure"
severity: "high"
description: "SPIP is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "spip"
  - "install"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/ecrire/?exec=install"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Installing publication system..."
      - "SPIP"
    condition: "and"
  - type: "status"
    status:
      - 200
