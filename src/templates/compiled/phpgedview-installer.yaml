id: "phpgedview-installer"
name: "PhpGedView Installer Exposure"
severity: "high"
description: "PhpGedView is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "phpgedview"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Installation Wizard"
      - "phpgedview"
    condition: "and"
  - type: "status"
    status:
      - 200
