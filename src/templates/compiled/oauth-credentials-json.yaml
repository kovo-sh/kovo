id: "oauth-credentials-json"
name: "Oauth Credentials Json"
severity: "low"
description: "Oauth Credentials file is exposed."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "oauth"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/oauth-credentials.json"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"client_id\":"
      - "\"client_secret\":"
    condition: "and"
  - type: "status"
    status:
      - 200
