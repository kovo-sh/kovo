id: "posteio-installer"
name: "First Poste.io Configuration Installation Wizard"
severity: "high"
description: "Poste.io is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic"
tags:
  - "misconfig"
  - "exposure"
  - "install"
  - "poste"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/admin/install/server"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Initial server configuration"
      - "Generate</button>"
    condition: "and"
  - type: "status"
    status:
      - 200
