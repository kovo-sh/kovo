id: "hivequeue-agent"
name: "HiveQueue Agent"
severity: "low"
description: "HiveQueue Agent is exposed."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "hivequeue"
  - "vuln"
reference: "https://www.facebook.com/ExWareLabs/photos/a.361854183878462/5555061814557647/"
spaExclusion: true
request:
  method: "GET"
  path: "/monitoring"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>HiveQueue Agent</title>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
