id: "apache-pinot-detect"
name: "Apache Pinot - Detect"
severity: "info"
description: "Detects a Apache Pinot web application, A realtime distributed OLAP datastore."
tech:
  - "apache"
tags:
  - "tech"
  - "pinot"
  - "apache"
  - "detect"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Apache Pinot</title>"
  - type: "status"
    status:
      - 200
