id: "pega-detect"
name: "Pega Infinity Detection"
severity: "info"
description: "Safe check derived from pega-detect: Pega Infinity Detection"
tech:
  - "generic"
tags:
  - "tech"
  - "pega"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/prweb/PRRestService/unauthenticatedAPI/v1/docs"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"description\" :\"The Pega API"
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "application/json"
