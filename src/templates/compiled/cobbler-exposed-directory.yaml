id: "cobbler-exposed-directory"
name: "Exposed Cobbler Directories"
severity: "medium"
description: "Searches for exposed Cobbler Directories"
tech:
  - "generic"
tags:
  - "cobbler"
  - "exposure"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/cobbler/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "Index of /cobbler"
      - "Index of /cblr"
