id: "acunetix-360-installer"
name: "Acunetix 360 Installer"
severity: "info"
description: "Acunetix 360 is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "exposure"
  - "install"
  - "acunetix"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/wizard/database/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Acunetix 360 - Installation Wizard"
      - "License"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
