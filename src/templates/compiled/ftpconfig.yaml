id: "ftpconfig"
name: "Atom remote-ssh ftpconfig Exposure"
severity: "high"
description: "Created by remote-ssh for Atom, contains SFTP/SSH server details and credentials"
tech:
  - "generic-web-exposure"
tags:
  - "atom"
  - "ftp"
  - "config"
  - "exposure"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/.ftpconfig"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"protocol\":"
      - "\"host\":"
      - "\"user\":"
      - "\"passphrase\":"
    condition: "and"
  - type: "status"
    status:
      - 200
