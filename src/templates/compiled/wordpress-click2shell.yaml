id: "wordpress-click2shell"
name: "WordPress Click2Shell Theme Preview Selector Injection"
severity: "high"
description: "WordPress contains a client-side selector injection in the theme installer preview route. A crafted URL opened by an authenticated administrator can cause WordPress to automatically install and preview an attacker-selected inactive theme from WordPress.org. The issue can be chained with a separate vulnerability in an installed theme to achieve code execution."
tech:
  - "wordpress"
tags:
  - "wordpress"
  - "wp"
  - "click2shell"
  - "selector-injection"
  - "vuln"
reference: "https://wordpress.org/news/2026/09/wordpress-7-1-1-maintenance-and-security-release/"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-admin/js/theme.js"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "self.view.collection.once( 'query:success', function() {"
      - "$( 'div[data-slug=\"' + slug + '\"]' ).trigger( 'click' );"
    condition: "and"
  - type: "word"
    part: "body"
    words:
      - "escapeSelector"
    negative: true
  - type: "status"
    status:
      - 200
