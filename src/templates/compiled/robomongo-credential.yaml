id: "robomongo-credential"
name: "RoboMongo Credential - Exposure"
severity: "high"
description: "A MongoDB credentials file used by RoboMongo was detected."
tech:
  - "generic"
tags:
  - "mongodb"
  - "robomongo"
  - "disclosure"
  - "config"
  - "exposure"
  - "vuln"
cwe: "CWE-200"
reference: "https://robomongo.org/"
spaExclusion: true
request:
  method: "GET"
  path: "/db/robomongo.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "databaseName"
      - "userName"
      - "userPassword"
      - "serverHost"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
