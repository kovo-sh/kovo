id: "totolink-n150rt-password-exposure"
name: "TOTOLINK N150RT - Password Exposure"
severity: "high"
description: "Detects password exposure vulnerability in TOTOLINK N150RT router where sensitive credentials are exposed in the password.htm page."
tech:
  - "generic"
tags:
  - "totolink"
  - "router"
  - "exposure"
  - "credentials"
  - "vuln"
reference: "https://github.com/fizz-is-on-the-way/Iot_vuls/blob/main/N150RT/Information_disclosure_password/imgs/2.png"
spaExclusion: true
request:
  method: "GET"
  path: "/password.htm"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "orgpassword="
      - "orgusername="
    condition: "and"
  - type: "word"
    part: "body"
    words:
      - "orgpassword=''"
    negative: true
  - type: "status"
    status:
      - 200
