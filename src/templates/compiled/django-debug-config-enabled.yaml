id: "django-debug-config-enabled"
name: "Django Debug Configuration Enabled"
severity: "medium"
description: "Django debug configuration is enabled, which allows an attacker to obtain system configuration information such as paths or settings."
tech:
  - "django"
tags:
  - "django"
  - "debug"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/NON_EXISTING_PATH/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "URLconf defined"
      - "Page not found"
      - "Django tried these URL patterns, in this order"
    condition: "and"
  - type: "status"
    status:
      - 404
