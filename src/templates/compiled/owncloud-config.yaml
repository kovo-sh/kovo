id: "owncloud-config"
name: "owncloud Config - Detect"
severity: "info"
description: "owncloud configuration information was detected."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "exposure"
  - "vuln"
cwe: "CWE-200"
reference: "https://owncloud.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/owncloud/config/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Index of"
      - "owncloud/config"
    condition: "and"
  - type: "status"
    status:
      - 200
