id: "rabbitmq-exporter-metrics"
name: "RabbitMQ Exporter"
severity: "low"
description: "RabbitMQ Exporter is exposed."
tech:
  - "generic"
tags:
  - "rabbitmq"
  - "exposure"
  - "debug"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/metrics"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "rabbitmq_up"
      - "rabbitmq_exporter_build_info"
    condition: "and"
  - type: "status"
    status:
      - 200
