id: "remotely-registration-enabled"
name: "Remotely Registration Enabled"
severity: "high"
description: "Checks if the Remotely self-hosted remote desktop and collaboration web application has its user registration endpoint enabled, potentially allowing anyone to register without invitation."
tech:
  - "generic"
tags:
  - "remotely"
  - "registration"
  - "exposure"
  - "misconfig"
  - "vuln"
reference: "https://github.com/lucent-sea/Remotely"
spaExclusion: true
request:
  method: "GET"
  path: "/Identity/Account/Register"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Create a new account."
      - "Remotely"
    condition: "and"
  - type: "word"
    part: "body"
    words:
      - "Registration is disabled."
    negative: true
  - type: "status"
    status:
      - 200
