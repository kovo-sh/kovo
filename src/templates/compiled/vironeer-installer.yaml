id: "vironeer-installer"
name: "Vironeer Installer - Exposure"
severity: "high"
description: "Vironeer is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic"
tags:
  - "misconfig"
  - "vironeer"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install/information/database"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Vironeer Installer"
  - type: "status"
    status:
      - 200
