id: "apache-zeppelin-unauth"
name: "Apache Zeppelin - Unauthenticated Access"
severity: "high"
description: "Apache Zeppelin server was able to be accessed because no authentication was required."
tech:
  - "apache"
tags:
  - "misconfig"
  - "apache"
  - "zeppelin"
  - "unauth"
  - "vuln"
cwe: "CWE-285"
reference: "https://www.adminxe.com/2172.html"
spaExclusion: true
request:
  method: "GET"
  path: "/api/security/ticket"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "status\":\"OK"
      - "\"ticket\":\"anonymous\""
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
