id: "aem-crx-browser"
name: "Adobe AEM CRX Browser Exposure"
severity: "info"
description: "Safe check derived from aem-crx-browser: Adobe AEM CRX Browser Exposure"
tech:
  - "tomcat"
  - "java"
tags:
  - "misconfig"
  - "aem"
  - "adobe"
  - "exposure"
  - "vuln"
reference: "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/aem2.txt"
spaExclusion: true
request:
  method: "GET"
  path: "/crx/explorer/browser/index.jsp"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Content Explorer - UserID: anonymous | Workspace: crx.default</title>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
