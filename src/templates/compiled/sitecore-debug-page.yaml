id: "sitecore-debug-page"
name: "SiteCore Debug Page"
severity: "low"
description: "SiteCore debug page is exposed."
tech:
  - "generic"
tags:
  - "debug"
  - "sitecore"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/sitecore/'"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "extranet\\Anonymous"
  - type: "status"
    status:
      - 404
