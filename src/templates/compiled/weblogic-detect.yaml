id: "weblogic-detect"
name: "Detect Weblogic"
severity: "info"
description: "Safe check derived from weblogic-detect: Detect Weblogic"
tech:
  - "generic"
tags:
  - "tech"
  - "weblogic"
  - "intrusive"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/{{rand}}"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "From RFC 2068"
      - "Error 404--Not Found"
    condition: "and"
  - type: "status"
    status:
      - 404
