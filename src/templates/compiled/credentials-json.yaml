id: "credentials-json"
name: "Credentials File Disclosure"
severity: "medium"
description: "Internal secret file is exposed."
tech:
  - "generic"
tags:
  - "google"
  - "secret"
  - "exposure"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/credentials.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"client_secret\":"
      - "\"client_id\":"
    condition: "and"
  - type: "status"
    status:
      - 200
