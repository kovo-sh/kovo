id: "phalcon-framework-source"
name: "Phalcon Framework - Source Code Leakage"
severity: "high"
description: "Phalcon Framework source code was discovered."
tech:
  - "generic"
tags:
  - "exposure"
  - "debug"
  - "phalcon"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/anything_here"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Phalcon Framework"
      - "AnythingHereController"
    condition: "and"
  - type: "status"
    status:
      - 200
