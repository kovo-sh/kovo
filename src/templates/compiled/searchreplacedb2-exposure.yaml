id: "searchreplacedb2-exposure"
name: "Safe Search Replace Exposure"
severity: "high"
description: "Safe Search Replace is exposed leaking internal info."
tech:
  - "php"
tags:
  - "misconfig"
  - "searchreplacedb2"
  - "exposure"
  - "vuln"
reference: "https://interconnectit.com/search-and-replace-for-wordpress-databases/"
spaExclusion: true
request:
  method: "GET"
  path: "/searchreplacedb2.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Database details"
      - "Safe Search Replace"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
