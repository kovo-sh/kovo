id: "manage-cabinet-register"
name: "Manage Cabinet Register - Exposed"
severity: "low"
description: "The path to the Cabinet Storage is omniapp/pages/cabinet/managecabinet.jsf?Action=1. If exposed, it gives an attacker insight into information such as Storage Volume Name, Cabinet Name, it's alias, Deployed AppServer IP Address and Port"
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "cabinet"
  - "exposure"
  - "vuln"
reference: "https://www.edms-consultants.com/newgen-rlos/"
spaExclusion: true
request:
  method: "GET"
  path: "/omniapp/pages/cabinet/managecabinet.jsf?Action=1"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Manage Cabinet [Register Cabinet]"
  - type: "status"
    status:
      - 200
