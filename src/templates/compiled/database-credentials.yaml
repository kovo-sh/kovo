id: "database-credentials"
name: "Database Credentials File Exposure"
severity: "low"
description: "Internal file exposed containing database credentials."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "database"
  - "config"
  - "files"
  - "vuln"
reference: "https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt"
spaExclusion: true
request:
  method: "GET"
  path: "/database_credentials.inc"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DATABASE_USER"
      - "DB_USER"
      - "USERNAME"
      - "USER"
  - type: "word"
    part: "body"
    words:
      - "DATABASE_PASS"
      - "DB_PASS"
      - "PASSWORD"
      - "PASS"
  - type: "status"
    status:
      - 200
      - 401
      - 403
  - type: "word"
    part: "body"
    words:
      - "Access denied"
      - "Unauthorized"
    negative: true
  - type: "word"
    part: "header"
    words:
      - "Content-Type: text/plain"
      - "Content-Type: application/json"
