id: "anonymous-distribution-point-sccm"
name: "Microsoft SCCM - Anonymous Distribution Point Access"
severity: "medium"
description: "Microsoft System Center Configuration Manager (SCCM) can be configured to allow anonymous access to its distribution points.This can lead to sensitive data exposure and information gathering by unauthorized users.This misconfiguration is exploitable only via HTTP."
tech:
  - "generic"
tags:
  - "misconfig"
  - "microsoft"
  - "sccm"
  - "anonymous"
  - "distribution-point"
  - "vuln"
reference: "https://www.synacktiv.com/en/publications/sccmsecretspy-exploiting-sccm-policies-distribution-for-credentials-harvesting-initial"
spaExclusion: true
request:
  method: "GET"
  path: "/SMS_DP_SMSPKG$/Datalib"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "/SMS_DP_SMSPKG\\$\\/Datalib/([0-9a-z-]+)\\.INI"
  - type: "status"
    status:
      - 200
