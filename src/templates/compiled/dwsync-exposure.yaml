id: "dwsync-exposure"
name: "Dreamweaver Dwsync.xml Exposure"
severity: "info"
description: "The Dreamweaver file dwsync.xml was discovered. The dwsync.xml file is a file generated by Dreamweaver which contains information related to what files are in the website directory."
tech:
  - "generic-web-exposure"
tags:
  - "dwsync"
  - "exposure"
  - "dreamweaver"
  - "files"
  - "vuln"
cwe: "CWE-200"
spaExclusion: true
request:
  method: "GET"
  path: "/_notes/dwsync.xml"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "application/xml"
  - type: "word"
    part: "body"
    words:
      - "<dwsync>"
      - "</dwsync>"
    condition: "and"
