id: "oob-param-based-interaction"
name: "Parameter Based Generic OOB Interaction"
severity: "info"
description: "The remote server fetched a spoofed URL from the request parameters."
tech:
  - "generic"
tags:
  - "oast"
  - "ssrf"
  - "generic"
  - "vuln"
cwe: "CWE-918"
reference: "https://github.com/PortSwigger/collaborator-everywhere"
spaExclusion: true
request:
  method: "GET"
  path: "/?u={{kovo_canary_http}}/&href={{kovo_canary_http}}/&action={{kovo_canary_http}}/&host={{kovo_canary_http}}&http_host={{kovo_canary_http}}&email=root@{{kovo_canary_http}}&url={{kovo_canary_http}}/&load={{kovo_canary_http}}/&preview={{kovo_canary_http}}/&target={{kovo_canary_http}}/&proxy={{kovo_canary_http}}/&from={{kovo_canary_http}}/&src={{kovo_canary_http}}/&ref={{kovo_canary_http}}/&referrer={{kovo_canary_http}}/"
control:
  method: "GET"
  path: "/?u=kovo-none-{{rand}}/&href=kovo-none-{{rand}}/&action=kovo-none-{{rand}}/&host=kovo-none-{{rand}}&http_host=kovo-none-{{rand}}&email=root@kovo-none-{{rand}}&url=kovo-none-{{rand}}/&load=kovo-none-{{rand}}/&preview=kovo-none-{{rand}}/&target=kovo-none-{{rand}}/&proxy=kovo-none-{{rand}}/&from=kovo-none-{{rand}}/&src=kovo-none-{{rand}}/&ref=kovo-none-{{rand}}/&referrer=kovo-none-{{rand}}/"
matchers-condition: "or"
matchers:
  - type: "canary"
    protocol: "http"
