id: "idea-folder-exposure"
name: "Public .idea Folder containing files with sensitive data"
severity: "info"
description: "Searches for .idea Folder by querying the /.idea and a few other files with sensitive data."
tech:
  - "generic-web-exposure"
tags:
  - "phpstorm"
  - "jetbrains"
  - "idea"
  - "exposure"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/.idea/deployment.xml"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "<?xml version="
      - "<project version"
    condition: "and"
