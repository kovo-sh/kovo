id: "mysql-history"
name: "Mysql History - File Disclosure"
severity: "low"
description: "The mysql_history file is a history file used by the MySQL command-line client (mysql) to store a record of the SQL commands and statements entered by a user during their interactive MySQL sessions. It serves as a command history for the MySQL client, allowing users to recall and reuse previously executed SQL commands."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "disclosure"
  - "config"
  - "vuln"
reference: "http://doc.docs.sk/mysql-refman-5.5/mysql-history-file.html"
spaExclusion: true
request:
  method: "GET"
  path: "/.mysql_history"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "_HiStOrY_V2_"
      - "show databases;"
  - type: "word"
    part: "header"
    words:
      - "application/octet-stream"
      - "text/plain"
      - "filename=\".mysql_"
  - type: "word"
    part: "all"
    words:
      - "<?xml"
      - "<env"
      - "application/javascript"
      - "application/json"
      - "application/xml"
      - "html>"
      - "text/html"
      - "image/"
    negative: true
  - type: "status"
    status:
      - 200
