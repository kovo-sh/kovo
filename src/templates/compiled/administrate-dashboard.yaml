id: "administrate-dashboard"
name: "Administrate Dashboard Exposure"
severity: "high"
description: "Administrate Dashboard was exposed."
tech:
  - "generic"
tags:
  - "exposure"
  - "administrate"
  - "misconfig"
  - "vuln"
reference: "https://github.com/thoughtbot/administrate"
spaExclusion: true
request:
  method: "GET"
  path: "/admin"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Search Customers"
      - "Administrate"
      - "New customer</a>"
    condition: "and"
  - type: "status"
    status:
      - 200
