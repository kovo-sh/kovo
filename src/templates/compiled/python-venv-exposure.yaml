id: "python-venv-exposure"
name: "Python Virtual Environment  Directory Exposure"
severity: "info"
description: "An exposed Python virtual environment directory allows public access to internal files like pyvenv.cfg, installed packages, and configurations. This can leak sensitive information and aid attackers in identifying or exploiting vulnerabilities."
tech:
  - "python"
tags:
  - "venv"
  - "exposure"
  - "python-env"
  - "info"
  - "vuln"
reference: "https://docs.python.org/3/library/venv.html"
spaExclusion: true
request:
  method: "GET"
  path: "/venv/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Index of /venv"
  - type: "status"
    status:
      - 200
