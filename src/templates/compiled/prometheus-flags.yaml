id: "prometheus-flags"
name: "Prometheus flags API endpoint"
severity: "info"
description: "The flags endpoint provides a full path to the configuration file. If the file is stored in the home directory, it may leak a username."
tech:
  - "prometheus"
tags:
  - "prometheus"
  - "leak"
  - "misconfig"
  - "vuln"
reference: "https://jfrog.com/blog/dont-let-prometheus-steal-your-fire/"
spaExclusion: true
request:
  method: "GET"
  path: "/api/v1/status/flags"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "\"data\":"
      - "\"config.file\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
