id: "artifactory-anonymous-deploy"
name: "Artifactory anonymous deploy"
severity: "high"
description: "Artifactory anonymous repo is exposed."
tech:
  - "generic"
tags:
  - "artifactory"
  - "misconfig"
  - "vuln"
reference: "https://www.errno.fr/artifactory/Attacking_Artifactory.html"
spaExclusion: true
request:
  method: "GET"
  path: "/artifactory/ui/repodata?deploy=true"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"repoKey\""
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "application/json"
