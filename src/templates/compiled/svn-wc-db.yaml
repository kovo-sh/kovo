id: "svn-wc-db"
name: "SVN wc.db File Exposure"
severity: "medium"
description: "SVN wc.db file is exposed."
tech:
  - "generic-web-exposure"
tags:
  - "msf"
  - "exposure"
  - "svn"
  - "config"
  - "files"
  - "vuln"
reference: "https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt"
spaExclusion: true
request:
  method: "GET"
  path: "/.svn/wc.db"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "SQLite format"
      - "WCROOT"
    condition: "and"
  - type: "status"
    status:
      - 200
