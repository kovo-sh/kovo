id: "awstats-listing"
name: "AWStats Listing"
severity: "low"
description: "Searches for exposed awstats Internal Information."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "aws"
  - "exposure"
  - "amazon"
  - "awstats"
  - "oss"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/awstats/data"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Index of /awstats/data/"
      - "\">awstats"
    condition: "and"
  - type: "status"
    status:
      - 200
