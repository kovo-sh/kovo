id: "gloo-unauth"
name: "Unauthenticated Gloo UI"
severity: "high"
description: "Gloo UI is exposed to external users."
tech:
  - "generic"
tags:
  - "unauth"
  - "gloo"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/fed.rpc.solo.io.GlooInstanceApi/ListClusterDetails"
  headers:
    "Content-type": "application/grpc-web+proto"
    "Referer": "/admin/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "gke-remote"
  - type: "word"
    part: "header"
    words:
      - "application/grpc-web+proto"
  - type: "status"
    status:
      - 200
