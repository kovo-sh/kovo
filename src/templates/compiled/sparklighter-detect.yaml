id: "sparklighter-detect"
name: "Spark Lighter Detection"
severity: "info"
description: "Detects a Spark Lighter server, a REST API for Apache Spark on K8S or YARN."
tech:
  - "apache"
tags:
  - "tech"
  - "lighter"
  - "spark"
  - "detect"
  - "apache"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/lighter/api"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Lighter</title>"
      - "/lighter/favicon.svg"
    condition: "and"
  - type: "status"
    status:
      - 200
