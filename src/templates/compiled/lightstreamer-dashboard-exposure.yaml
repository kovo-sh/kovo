id: "lightstreamer-dashboard-exposure"
name: "Lightstreamer Dashboard Exposure"
severity: "medium"
description: "Detected exposed Lightstreamer Server dashboard that may reveal server configuration,real-time monitoring data, session information, and internal infrastructure details."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "lightstreamer"
  - "dashboard"
  - "misconfig"
  - "unauth"
  - "vuln"
reference: "https://lightstreamer.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/dashboard/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Lightstreamer Monitoring Dashboard"
      - "performance"
    condition: "and"
  - type: "status"
    status:
      - 200
