id: "zoneminder-system-log"
name: "ZoneMinder System Log - Detect"
severity: "low"
description: "ZoneMinder system log file exposed."
tech:
  - "generic-web-exposure"
tags:
  - "logs"
  - "zoneminder"
  - "exposure"
  - "discovery"
reference: "https://www.exploit-db.com/ghdb/6926"
spaExclusion: true
request:
  method: "GET"
  path: "/?view=log"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>ZM - System Log</title>"
  - type: "status"
    status:
      - 200
