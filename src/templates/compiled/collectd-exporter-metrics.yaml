id: "collectd-exporter-metrics"
name: "Collectd Exporter Metrics"
severity: "low"
description: "Collectd Exporter Metrics is exposed."
tech:
  - "generic"
tags:
  - "collectd"
  - "exposure"
  - "debug"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/metrics"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "# HELP"
      - "collectd_"
    condition: "and"
  - type: "status"
    status:
      - 200
