id: "jetbrains-datasource"
name: "Jetbrains IDE DataSources Config - Detect"
severity: "info"
description: "Jetbrains IDE DataSources configuration information was detected."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "exposure"
  - "jetbrains"
  - "vuln"
cwe: "CWE-200"
reference: "https://www.jetbrains.com"
spaExclusion: true
request:
  method: "GET"
  path: "/.idea/dataSources.xml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DataSourceManagerImpl"
  - type: "status"
    status:
      - 200
