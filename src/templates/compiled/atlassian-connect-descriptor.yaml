id: "atlassian-connect-descriptor"
name: "Atlassian Connect Descriptor - Detect"
severity: "info"
description: "The app descriptor is a JSON file ( atlassian-connect. json ) that describes the app to the Atlassian application. The descriptor includes general information for the app, as well as the modules that the app wants to use or extend."
tech:
  - "generic"
tags:
  - "atlassian"
  - "tech"
  - "jira"
  - "discovery"
reference: "https://developer.atlassian.com/cloud/jira/platform/connect-app-descriptor/"
spaExclusion: true
request:
  method: "GET"
  path: "/atlassian-connect.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"name\":"
      - "\"vendor\":"
      - "\"key\":"
      - "\"baseUrl\":"
      - "\"authentication\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
