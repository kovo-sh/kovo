id: "nopcommerce-installer"
name: "nopCommerce Installer - Detect"
severity: "critical"
description: "nopCommerce installer panel was detected."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "nopcommerce"
  - "install"
  - "vuln"
cwe: "CWE-284"
reference: "https://www.nopcommerce.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/install"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "nopCommerce installation"
      - "Store information"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
