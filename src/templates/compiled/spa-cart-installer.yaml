id: "spa-cart-installer"
name: "SPA Cart - Installer"
severity: "high"
description: "SPA Cart installer was found."
tech:
  - "generic"
tags:
  - "spa-cart"
  - "exposure"
  - "installer"
  - "misconfig"
  - "vuln"
reference: "https://spa-cart.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/install/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>SPA Cart Installation</title>"
      - "PHP Version"
    condition: "and"
  - type: "status"
    status:
      - 200
