id: "core-dump"
name: "Exposed Core Dump - File Disclosure"
severity: "medium"
description: "Exposed Core Dump internal file is disclosed."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "files"
  - "core-dump"
  - "vuln"
reference: "https://github.com/hannob/snallygaster/blob/4c5a9b54501f64da96787c2a2e3a12ce2e09c1ab/snallygaster#L295"
spaExclusion: true
request:
  method: "GET"
  path: "/core"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "^\\x7fELF"
