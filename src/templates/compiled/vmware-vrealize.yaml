id: "vmware-vrealize"
name: "VMware vRealize"
severity: "info"
description: "Version of VMware vRealize Operations Manager"
tech:
  - "vmware"
tags:
  - "vmware"
  - "vrealize"
  - "tech"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/ui/login.action"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "word"
    part: "body"
    words:
      - "<title>vRealize Operations Manager</title>"
