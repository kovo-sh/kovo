id: "fork-installer"
name: "Fork CMS - Installer"
severity: "critical"
description: "Fork CMS installer page was detected."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "exposure"
  - "fork"
  - "cms"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install/2"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Install Fork CMS"
      - "Settings"
    condition: "and"
  - type: "status"
    status:
      - 200
