id: "apache-filename-enum"
name: "Apache Filename Enumeration"
severity: "low"
description: "If the client provides an invalid Accept header, the server will respond with a 406 Not Acceptable error containing a pseudo directory listing."
tech:
  - "apache"
tags:
  - "apache"
  - "misconfig"
  - "hackerone"
  - "vuln"
reference: "https://hackerone.com/reports/210238"
spaExclusion: true
request:
  method: "GET"
  path: "/index"
  headers:
    "Accept": "fake/value"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 406
  - type: "word"
    part: "body"
    words:
      - "Not Acceptable"
      - "Available variants:"
      - "<address>Apache Server at"
    condition: "and"
