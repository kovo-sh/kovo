id: "nginx-config"
name: "Nginx Config - Detect"
severity: "info"
description: "Nginx configuration information was detected."
tech:
  - "nginx"
tags:
  - "config"
  - "exposure"
  - "nginx"
  - "vuln"
cwe: "CWE-200"
reference: "https://nginx.org/en/"
spaExclusion: true
request:
  method: "GET"
  path: "/nginx.conf"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "html>"
    negative: true
  - type: "word"
    part: "body"
    words:
      - "server"
      - "listen"
      - "server_name"
    condition: "and"
  - type: "status"
    status:
      - 200
