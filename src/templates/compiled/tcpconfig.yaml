id: "tcpconfig"
name: "Rockwell Automation TCP/IP Configuration Information - Detect"
severity: "medium"
description: "TCP/IP configuration information was detected."
tech:
  - "generic"
tags:
  - "config"
  - "edb"
  - "logs"
  - "misconfig"
  - "vuln"
cwe: "CWE-200"
reference: "https://www.rockwellautomation.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/tcpconfig.html"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "TCP/IP Configuration"
  - type: "status"
    status:
      - 200
