id: "opensearch-dashboard-unauth"
name: "OpenSearch Dashboard - Unauth Access"
severity: "high"
description: "OpenSearch Dashboard is a visualization and management tool for OpenSearch. This template detects instances that are accessible without authentication, potentially exposing sensitive data and system information."
tech:
  - "generic-web-exposure"
tags:
  - "opensearch"
  - "dashboard"
  - "misconfig"
  - "unauth"
  - "vuln"
reference: "https://opensearch.org/docs/latest/dashboards/index/"
spaExclusion: true
request:
  method: "GET"
  path: "/app/home#/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "/ui/fonts/source_sans_3/SourceSans3"
      - "font-family: 'Source Code Pro"
      - "OpenSearch"
    condition: "and"
  - type: "status"
    status:
      - 200
