id: "vercel-source-exposure"
name: "Vercel Source Code Exposure"
severity: "medium"
description: "The Vercel Source Code Exposure misconfiguration allows an attacker to access sensitive source code files on the Vercel platform."
tech:
  - "vercel"
tags:
  - "vercel"
  - "exposure"
  - "misconfig"
  - "vuln"
reference: "https://vercel.com/docs/projects/overview#logs-and-source-protection"
spaExclusion: true
request:
  method: "GET"
  path: "/_src"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Deployment Source</title>"
      - "Deployment Source – Dashboard – Vercel"
  - type: "word"
    part: "body"
    words:
      - "<title>Login – Vercel</title>"
    negative: true
