id: "openai-plugin"
name: "OpenAI Plugin Detection"
severity: "info"
description: "OpenAI plugins connect ChatGPT to third-party applications. These plugins enable ChatGPT to interact with APIs defined by developers, enhancing ChatGPT's capabilities and allowing it to perform a wide range of actions."
tech:
  - "generic"
tags:
  - "tech"
  - "openai"
  - "plugin"
  - "discovery"
  - "ai"
reference: "https://platform.openai.com/docs/plugins/introduction"
spaExclusion: true
request:
  method: "GET"
  path: "/.well-known/ai-plugin.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"schema_version\":"
      - "\"name_for_model\":"
    condition: "and"
