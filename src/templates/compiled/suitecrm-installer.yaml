id: "suitecrm-installer"
name: "SuiteCRM Installer Exposure"
severity: "high"
description: "SuiteCRM is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "suitecrm"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install.php"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "SuiteCRM Setup Wizard:"
      - "Checking Environment"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
