id: "gitlab-uninitialized-password"
name: "Uninitialized GitLab instances"
severity: "high"
description: "Prior to version 14, GitLab installations required a root password to be set via the web UI. If the administrator skipped this step, any visitor could set a password and control the instance."
tech:
  - "gitlab"
tags:
  - "gitlab"
  - "misconfig"
  - "unauth"
  - "vuln"
reference: "https://gitlab.com/gitlab-org/gitlab/-/issues/211328"
spaExclusion: true
request:
  method: "GET"
  path: "/users/sign_in"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Change your password"
      - "New password"
      - "Confirm new password"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "gitlab_session"
  - type: "status"
    status:
      - 200
