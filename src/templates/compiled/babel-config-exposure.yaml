id: "babel-config-exposure"
name: "Babel Configuration - Detect"
severity: "info"
description: "Babel configuration information was detected."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "config"
  - "file"
  - "vuln"
cwe: "CWE-200"
reference: "https://babeljs.io/docs/en/configuration"
spaExclusion: true
request:
  method: "GET"
  path: "/babel.config.js"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "module.exports = {"
      - "presets: ["
    condition: "and"
  - type: "status"
    status:
      - 200
