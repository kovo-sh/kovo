id: "laravel-terminal-exposure"
name: "Laravel Terminal - Exposed"
severity: "high"
description: "The web application was built on the Laravel framework, with Laravel Terminal enabled and publicly accessible; this was detected in the production environment and led to disclosure of sensitive application information."
tech:
  - "laravel"
tags:
  - "laravel"
  - "terminal"
  - "exposure"
  - "misconfig"
  - "rce"
  - "vuln"
reference: "https://github.com/recca0120/laravel-terminal"
spaExclusion: true
request:
  method: "GET"
  path: "/asf/terminal"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Laravel Terminal"
      - "terminal.endpoint"
  - type: "status"
    status:
      - 200
