id: "aem-custom-script"
name: "Adobe AEM Custom Scripts Exposure"
severity: "info"
description: "Safe check derived from aem-custom-script: Adobe AEM Custom Scripts Exposure"
tech:
  - "aem"
tags:
  - "misconfig"
  - "aem"
  - "adobe"
  - "vuln"
reference: "https://www.slideshare.net/0ang3el/hacking-aem-sites"
spaExclusion: true
request:
  method: "GET"
  path: "/apps.tidy.infinity.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"jcr:primaryType\":"
      - "\"jcr:createdBy\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
