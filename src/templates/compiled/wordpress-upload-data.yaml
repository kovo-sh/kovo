id: "wordpress-upload-data"
name: "wordpress-upload-data"
severity: "medium"
description: "The remote WordPress installation contains a file 'data.txt' under the '/wp-content/uploads/' folder that has sensitive information inside it."
tech:
  - "wordpress"
tags:
  - "wordpress"
  - "listing"
  - "vuln"
reference: "https://www.exploit-db.com/ghdb/7040"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/uploads/data.txt"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "admin:"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
  - type: "status"
    status:
      - 200
