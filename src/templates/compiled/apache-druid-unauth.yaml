id: "apache-druid-unauth"
name: "Apache Druid Unauth"
severity: "low"
description: "Apache Druid is exposed to external users."
tech:
  - "apache"
tags:
  - "misconfig"
  - "druid"
  - "unauth"
  - "apache"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/unified-console.html"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Apache Druid</title>"
  - type: "status"
    status:
      - 200
