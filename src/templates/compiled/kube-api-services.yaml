id: "kube-api-services"
name: "Kube API Services"
severity: "info"
description: "Scans for kube services"
tech:
  - "kubernetes"
tags:
  - "tech"
  - "k8s"
  - "kubernetes"
  - "devops"
  - "kube"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/api/v1/namespaces/default/services"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "\"ServiceList\":"
      - "\"items\":"
    condition: "and"
