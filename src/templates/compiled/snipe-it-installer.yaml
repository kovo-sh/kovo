id: "snipe-it-installer"
name: "Snipe-IT Setup Page - Exposure"
severity: "high"
description: "Detects exposed Snipe-IT Setup page."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "install"
  - "exposure"
  - "snipe-it"
  - "vuln"
reference: "https://snipeitapp.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/setup"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Snipe-IT Setup"
      - "Create Admin User"
    condition: "and"
  - type: "status"
    status:
      - 200
