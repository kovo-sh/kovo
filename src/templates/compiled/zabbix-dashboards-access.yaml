id: "zabbix-dashboards-access"
name: "zabbix-dashboards-access"
severity: "medium"
description: "zabbix-dashboards-access guest login credentials were successful."
tech:
  - "php"
tags:
  - "edb"
  - "packetstorm"
  - "zabbix"
  - "unauth"
  - "misconfig"
  - "xss"
  - "vuln"
cwe: "CWE-522"
reference: "https://www.exploit-db.com/ghdb/5595"
spaExclusion: true
request:
  method: "GET"
  path: "/zabbix/zabbix.php?action=dashboard.list"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Create dashboard"
      - "Zabbix SIA"
    condition: "and"
  - type: "status"
    status:
      - 200
