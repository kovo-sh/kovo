id: "lychee-installer"
name: "Lychee Installer"
severity: "high"
description: "Lychee is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic"
tags:
  - "misconfig"
  - "lychee"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Lychee Installer"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
