id: "php-ini"
name: "Php.ini File Disclosure"
severity: "low"
description: "php.ini file is exposed."
tech:
  - "php"
tags:
  - "config"
  - "exposure"
  - "files"
  - "vuln"
reference: "https://www.php.net/manual/en/configuration.file.php"
spaExclusion: true
request:
  method: "GET"
  path: "/php.ini"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "[PHP]"
      - "short_open_tag"
      - "safe_mode"
      - "expose_php"
    condition: "and"
  - type: "status"
    status:
      - 200
