id: "vugex-source-detect"
name: "Vugex Framework Source Code - Detect"
severity: "medium"
description: "Detects the presence of exposed Vugex Framework source code by identifying common files and directories associated with the framework."
tech:
  - "generic"
tags:
  - "vugex"
  - "framework"
  - "disclosure"
  - "info-leak"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "@framework\\s+Vugex Framework"
      - "require_once\\s+'?/var/www/scripts/help.php'?"
    condition: "and"
