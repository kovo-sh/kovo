id: "ctrlpanel-installer"
name: "CtrlPanel Installer Exposure"
severity: "high"
description: "CtrlPanel is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "ctrlpanel"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/installer/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "CtrlPanel | installer"
      - "<title>CtrlPanel.gg installer Script"
    condition: "and"
  - type: "status"
    status:
      - 200
