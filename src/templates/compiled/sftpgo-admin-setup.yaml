id: "sftpgo-admin-setup"
name: "SFTPGo Admin - Setup"
severity: "high"
description: "SFTPGo Admin Password setup page has been exposed."
tech:
  - "generic"
tags:
  - "sftpgo"
  - "misconfig"
  - "setup"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/web/admin/setup"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "SFTPGo - Setup"
      - "SFTPGo you need to create an admin user"
  - type: "status"
    status:
      - 200
