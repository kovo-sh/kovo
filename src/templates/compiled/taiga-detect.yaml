id: "taiga-detect"
name: "Taiga - Detect"
severity: "info"
description: "Taiga, an open-source agile project management platform, was detected."
tech:
  - "generic"
tags:
  - "tech"
  - "taiga"
  - "detect"
  - "discovery"
reference: "https://taiga.io/"
spaExclusion: true
request:
  method: "GET"
  path: "/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Taiga</title>"
      - "window.TAIGA_VERSION ="
    condition: "and"
  - type: "status"
    status:
      - 200
