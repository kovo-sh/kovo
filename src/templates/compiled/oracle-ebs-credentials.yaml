id: "oracle-ebs-credentials"
name: "Oracle E-Business System Credentials Page - Detect"
severity: "high"
description: "Oracle E-Business System credentials page was detected."
tech:
  - "generic"
tags:
  - "config"
  - "exposure"
  - "oracle"
  - "vuln"
cwe: "CWE-200"
reference: "https://www.blackhat.com/docs/us-16/materials/us-16-Litchfield-Hackproofing-Oracle-eBusiness-Suite-wp-4.pdf"
spaExclusion: true
request:
  method: "GET"
  path: "/OA_HTML/jtfwrepo.xml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "password="
      - "<PUSR_LIST>"
  - type: "word"
    part: "header"
    words:
      - "text/xml"
  - type: "status"
    status:
      - 200
