id: "xampp-default-page"
name: "XAMPP Default Page"
severity: "info"
description: "Safe check derived from xampp-default-page: XAMPP Default Page"
tech:
  - "php"
  - "apache"
tags:
  - "tech"
  - "php"
  - "xampp"
  - "apache"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/dashboard/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Welcome to XAMPP</title>"
  - type: "status"
    status:
      - 200
