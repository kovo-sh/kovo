id: "gcloud-credentials"
name: "Google Cloud Credentials"
severity: "medium"
description: "Google Cloud Crdentials file is exposed."
tech:
  - "generic-web-exposure"
tags:
  - "google"
  - "cloud"
  - "devops"
  - "exposure"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/credentials.db"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "SQLite"
      - "client_id"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/octet-stream"
  - type: "status"
    status:
      - 200
