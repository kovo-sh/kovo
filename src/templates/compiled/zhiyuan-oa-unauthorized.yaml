id: "zhiyuan-oa-unauthorized"
name: "Zhiyuan Oa Unauthorized"
severity: "low"
description: "Zhiyuan Oa is exposed."
tech:
  - "generic"
tags:
  - "seeyon"
  - "unauth"
  - "zhiyuan"
  - "misconfig"
  - "vuln"
reference: "https://buaq.net/go-53721.html"
spaExclusion: true
request:
  method: "GET"
  path: "/seeyon/personalBind.do.jpg/..;/ajax.do?method=ajaxAction&managerName=mMOneProfileManager&managerMethod=getOAProfile"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "serverIdentifier"
      - "companyName"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
