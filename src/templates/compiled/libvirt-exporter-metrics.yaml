id: "libvirt-exporter-metrics"
name: "Libvirt Exporter Metrics"
severity: "low"
description: "Libvirt Exporter is leaking metrics."
tech:
  - "generic-web-exposure"
tags:
  - "libvirt"
  - "exposure"
  - "debug"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/metrics"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "# HELP"
      - "libvirt_"
    condition: "and"
  - type: "status"
    status:
      - 200
