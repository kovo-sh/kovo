id: "apache-karaf-panel"
name: "Apache Karaf Detect"
severity: "info"
description: "Safe check derived from apache-karaf-panel: Apache Karaf Detect"
tech:
  - "apache"
tags:
  - "tech"
  - "apache"
  - "karaf"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/system/console"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "header"
    words:
      - "realm=\"karaf"
