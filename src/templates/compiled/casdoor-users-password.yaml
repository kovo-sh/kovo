id: "casdoor-users-password"
name: "Casdoor get-users Account Password Disclosure"
severity: "high"
description: "Casdoor get-users Account Password is exposed."
tech:
  - "generic"
tags:
  - "casdoor"
  - "exposure"
  - "misconfig"
  - "disclosure"
  - "vuln"
reference: "https://github.com/Threekiii/Awesome-POC/blob/master/Web%E5%BA%94%E7%94%A8%E6%BC%8F%E6%B4%9E/Casbin%20get-users%20%E8%B4%A6%E5%8F%B7%E5%AF%86%E7%A0%81%E6%B3%84%E6%BC%8F%E6%BC%8F%E6%B4%9E.md?plain=1"
spaExclusion: true
request:
  method: "GET"
  path: "/api/get-users?p=123&pageSize=123"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"name\":"
      - "\"password\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
