id: "yarn-lock"
name: "Yarn Lock File Disclosure"
severity: "info"
description: "The yarn.lock file stores the versions of each Yarn dependency installed. It's a lock file for package.json."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "files"
  - "yarn"
  - "vuln"
reference: "https://classic.yarnpkg.com/lang/en/docs/yarn-lock/"
spaExclusion: true
request:
  method: "GET"
  path: "/yarn.lock"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY."
      - "# yarn lockfile v1"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
