id: "indegy-sensor-installer"
name: "Indegy Sensor Setup - Installer"
severity: "high"
description: "Indegy Sensor is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "indegy"
  - "sensor"
  - "installer"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/settings"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Setup Wizard</title>"
  - type: "status"
    status:
      - 200
