id: "dlink-config-dump"
name: "D-Link DAP-1325 - Information Disclosure"
severity: "critical"
description: "Security vulnerability known as Unauthenticated access to settings or Unauthenticated configuration download. This vulnerability occurs when a device, such as a repeater, allows the download of user settings without requiring proper authentication."
tech:
  - "dlink"
tags:
  - "misconfig"
  - "config"
  - "dump"
  - "dlink"
  - "auth-bypass"
  - "disclosure"
  - "vuln"
reference: "https://www.exploit-db.com/exploits/51556"
spaExclusion: true
request:
  method: "GET"
  path: "/cgi-bin/ExportSettings.sh"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Password"
  - type: "regex"
    part: "header"
    regex:
      - "filename=\"(.*)_Settings.dat"
      - "application/octet-stream"
    condition: "and"
  - type: "status"
    status:
      - 200
