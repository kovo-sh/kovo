id: "jira-unauthenticated-resolutions"
name: "Jira Unauthenticated Resolutions"
severity: "info"
description: "Safe check derived from jira-unauthenticated-resolutions: Jira Unauthenticated Resolutions"
tech:
  - "generic"
tags:
  - "atlassian"
  - "jira"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/rest/api/2/resolution"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "self"
      - "description"
      - "name"
    condition: "and"
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "atlassian.xsrf.token"
