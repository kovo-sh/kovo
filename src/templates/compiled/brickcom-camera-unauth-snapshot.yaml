id: "brickcom-camera-unauth-snapshot"
name: "Brickcom Camera - Unauthenticated Snapshot Access"
severity: "high"
description: "Detected Brickcom IP cameras was exposed live camera snapshots without authentication via the ONVIF media endpoint."
tech:
  - "generic"
tags:
  - "iot"
  - "camera"
  - "default-login"
  - "exposure"
  - "unauth"
reference: "https://cxsecurity.com/issue/WLB-2026020031"
spaExclusion: true
request:
  method: "GET"
  path: "/ONVIF/media.cgi?action=getSnapshot"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "image/jpeg"
