id: "springboot-dump"
name: "Detect Springboot Dump Actuator"
severity: "low"
description: "Performs a thread dump"
tech:
  - "springboot"
  - "actuator"
tags:
  - "springboot"
  - "exposure"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/dump"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "threadName"
      - "threadId"
      - "waitedTime"
      - "lockName"
      - "stackTrace"
      - "methodName"
    condition: "and"
  - type: "status"
    status:
      - 200
