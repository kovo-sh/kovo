id: "wowonder-installer"
name: "WoWonder Installation Page - Exposure"
severity: "high"
description: "Detects exposed WoWonder installation page."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "install"
  - "exposure"
  - "wowonder"
  - "vuln"
reference: "https://www.wowonder.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/install/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "WoWonder | Installation"
  - type: "status"
    status:
      - 200
