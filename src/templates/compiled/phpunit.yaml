id: "phpunit"
name: "phpunit.xml File Disclosure"
severity: "info"
description: "Phpunit.xml was created by Romain Bourdon for the development of WampServer 3.1. Phpunit.xml is packaged with WampServer 3.1.9 and XAMPP 5.6.40."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "files"
  - "vuln"
cwe: "CWE-200"
reference: "https://www.wampserver.com/en/"
spaExclusion: true
request:
  method: "GET"
  path: "/phpunit.xml"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<phpunit"
      - "</phpunit>"
    condition: "and"
  - type: "status"
    status:
      - 200
