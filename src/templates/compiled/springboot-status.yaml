id: "springboot-status"
name: "Spring Boot Status Actuator Panel - Detect"
severity: "info"
description: "Spring Boot Status Actuator panel was detected."
tech:
  - "springboot"
  - "actuator"
tags:
  - "misconfig"
  - "springboot"
  - "exposure"
  - "vuln"
cwe: "CWE-200"
spaExclusion: true
request:
  method: "GET"
  path: "/status"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"freeMemory\":"
      - "\"maxMemory\":"
    condition: "and"
  - type: "status"
    status:
      - 200
