id: "nginx-shards"
name: "NGINX Shards Disclosure"
severity: "medium"
description: "NGINX internal information, shards page exposed."
tech:
  - "nginx"
tags:
  - "exposure"
  - "shards"
  - "nginx"
  - "vuln"
reference: "https://infosecwriteups.com/how-i-got-rce-in-the-world-largest-russian-company-8e6e8288bc4e"
spaExclusion: true
request:
  method: "GET"
  path: "/static/shards.html"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Logs"
      - "Database"
      - "online shards only"
    condition: "and"
  - type: "status"
    status:
      - 200
