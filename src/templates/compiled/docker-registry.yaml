id: "docker-registry"
name: "Docker Registry Listing"
severity: "medium"
description: "Docker Registry Listing enabled."
tech:
  - "docker"
tags:
  - "misconfig"
  - "docker"
  - "devops"
  - "vuln"
reference: "https://notsosecure.com/anatomy-of-a-hack-docker-registry"
spaExclusion: true
request:
  method: "GET"
  path: "/v2/_catalog"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"repositories\":"
  - type: "word"
    part: "header"
    words:
      - "application/json"
