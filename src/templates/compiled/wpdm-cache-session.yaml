id: "wpdm-cache-session"
name: "Wpdm-Cache Session"
severity: "medium"
description: "Leaked session of Wpdm Cache wordpress plugin."
tech:
  - "wordpress"
tags:
  - "wordpress"
  - "edb"
  - "vuln"
reference: "https://www.exploit-db.com/ghdb/7004"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/uploads/wpdm-cache/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Index of /"
      - ".txt"
      - "wpdm-cache"
    condition: "and"
  - type: "status"
    status:
      - 200
