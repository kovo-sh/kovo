id: "node-red-unauth"
name: "Node-RED - Unauthenticated Access"
severity: "high"
description: "Node-RED flow editor is accessible without authentication. Node-RED is a flow-based programming tool that can execute arbitrary system commands, read/write files, and make network requests. Unauthenticated access leads to remote code execution."
tech:
  - "node"
tags:
  - "misconfig"
  - "nodered"
  - "unauth"
  - "rce"
cwe: "CWE-306"
reference: "https://nodered.org/docs/user-guide/runtime/securing-node-red"
spaExclusion: true
request:
  method: "GET"
  path: "/flows"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"id\""
      - "\"type\""
      - "\"wires\""
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
