id: "huiwen-bibliographic-info-leak"
name: "Huiwen library bibliographic Retrieval System - Information Exposure"
severity: "high"
description: "Huiwen library bibliographic retrieval system /include/config.properties file contains sensitive information, attackers can directly access to obtain information"
tech:
  - "generic"
tags:
  - "huiwen"
  - "exposure"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/include/config.properties"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "host="
      - "port="
      - "user="
      - "password="
    condition: "and"
  - type: "status"
    status:
      - 200
