id: "azure-pipelines-exposed"
name: "Azure Pipelines Configuration File Disclosure"
severity: "medium"
description: "Azure Pipelines internal critical file is disclosed."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "exposure"
  - "azure"
  - "microsoft"
  - "cloud"
  - "devops"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/.azure-pipelines.yml"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "trigger:"
      - "pool:"
      - "variables:"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
    negative: true
  - type: "status"
    status:
      - 200
