id: "wp-registration-enabled"
name: "WordPress User Registration Panel - Detect"
severity: "info"
description: "WordPress user registration is currently configured so that anyone can register as a user, thereby enabling an attacker to possibly access sensitive data and execute unathorized operations."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "wp"
  - "misconfig"
  - "vuln"
cwe: "CWE-200"
reference: "https://www.acunetix.com/vulnerabilities/web/wordpress-user-registration-enabled/"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-login.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "?action=register\""
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
