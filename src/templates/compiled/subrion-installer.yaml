id: "subrion-installer"
name: "Subrion CMS Web Installer - Exposure"
severity: "high"
description: "Subrion CMS Web Installer has been exposed."
tech:
  - "generic-web-exposure"
tags:
  - "subrion"
  - "cms"
  - "install"
  - "misconfig"
  - "vuln"
reference: "https://github.com/intelliants/subrion"
spaExclusion: true
request:
  method: "GET"
  path: "/install/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Subrion CMS Web Installer"
      - "Installation wizard"
    condition: "and"
  - type: "status"
    status:
      - 200
