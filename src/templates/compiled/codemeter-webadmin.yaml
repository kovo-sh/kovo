id: "codemeter-webadmin"
name: "CodeMeter Webadmin Dashboard"
severity: "low"
description: "CodeMeter Webadmin Dashboard is exposed."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "exposure"
  - "codemeter"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/index.html"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "WebAdmin | Dashboard"
      - "CodeMeter"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
