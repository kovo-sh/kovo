id: "weaver-userselect-unauth"
name: "OA E-Office UserSelect Unauthorized Access"
severity: "high"
description: "OA E-Office UserSelect interface has an unauthorized access vulnerability, through which attackers can obtain sensitive information"
tech:
  - "generic"
tags:
  - "weaver"
  - "e-office"
  - "oa"
  - "unauth"
  - "vuln"
reference: "https://github.com/achuna33/MYExploit/blob/8ffbf7ee60cbd77ad90b0831b93846aba224ab29/src/main/java/com/achuna33/Controllers/WeaverEOfficeController.java"
spaExclusion: true
request:
  method: "GET"
  path: "/UserSelect/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>选择人员</title>"
      - "/UserSelect/dept.php"
    condition: "and"
  - type: "status"
    status:
      - 200
