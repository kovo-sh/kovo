id: "simatic-dashboard-exposed"
name: "Siemens SIMATIC 300 Dashboard - Exposed"
severity: "high"
description: "An unauthenticated exposed web interface for Siemens SIMATIC S7-300 was discovered, potentially allowing access without any login credentials."
tech:
  - "generic"
tags:
  - "siemens"
  - "simatic"
  - "plc"
  - "scada"
  - "iot"
  - "misconfig"
  - "unauth"
  - "vuln"
reference: "https://new.siemens.com"
spaExclusion: true
request:
  method: "GET"
  path: "/Portal0000.htm"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "SIMATIC\\s*300"
  - type: "word"
    part: "body"
    words:
      - "alt=\"Simatic S7 CP\""
  - type: "status"
    status:
      - 200
