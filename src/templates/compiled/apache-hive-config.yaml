id: "apache-hive-config"
name: "Apache Hive Configuration - Exposure"
severity: "medium"
description: "Detects if the config page of the Apache Hive is exposed."
tech:
  - "apache"
tags:
  - "apache"
  - "hive"
  - "config"
  - "exposure"
  - "vuln"
reference: "https://github.com/apache/hive"
spaExclusion: true
request:
  method: "GET"
  path: "/conf"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "hive.conf."
      - "<configuration>"
    condition: "and"
  - type: "status"
    status:
      - 200
