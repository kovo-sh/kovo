id: "bigant-db-install"
name: "Bigant DataBase - Exposed Installation"
severity: "high"
description: "Bigant DataBase Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "install"
  - "bigant"
  - "database"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install/update.html"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "BigAnt Database Upgrade Wizard1"
      - "//DB-MS"
      - "<title>BigAntSetup"
    condition: "and"
  - type: "status"
    status:
      - 200
