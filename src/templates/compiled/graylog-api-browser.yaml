id: "graylog-api-browser"
name: "Detect Graylog REST API"
severity: "info"
description: "Safe check derived from graylog-api-browser: Detect Graylog REST API"
tech:
  - "generic"
tags:
  - "tech"
  - "graylog"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/api/api-browser/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Graylog"
      - "REST API browser"
      - "swagger"
    condition: "and"
  - type: "status"
    status:
      - 200
