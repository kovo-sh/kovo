id: "nginx-vhost-traffic-status"
name: "Nginx Vhost Traffic Status"
severity: "low"
description: "Nginx Vhost Traffic status is exposed."
tech:
  - "nginx"
tags:
  - "status"
  - "nginx"
  - "misconfig"
  - "vuln"
reference: "https://github.com/vozlt/nginx-module-vts"
spaExclusion: true
request:
  method: "GET"
  path: "/status"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Nginx Vhost Traffic Status"
      - "Host"
      - "Zone"
    condition: "and"
  - type: "status"
    status:
      - 200
