id: "typo3-installer"
name: "TYPO3 Installer"
severity: "medium"
description: "TYPO3 is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "typo3"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/typo3/install.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Installing TYPO3 CMS</title>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
