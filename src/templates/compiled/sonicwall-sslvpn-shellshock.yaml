id: "sonicwall-sslvpn-shellshock"
name: "Sonicwall SSLVPN - Remote Code Execution (ShellShock)"
severity: "critical"
description: "Sonicwall SSLVPN contains a 'ShellShock' vulnerability which allows remote unauthenticated attackers to execute arbitrary commands."
tech:
  - "generic"
tags:
  - "shellshock"
  - "sonicwall"
  - "rce"
  - "vpn"
  - "vuln"
cwe: "CWE-77"
reference: "https://twitter.com/chybeta/status/1353974652540882944"
spaExclusion: true
request:
  method: "GET"
  path: "/cgi-bin/jarrewrite.sh"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "status"
    status:
      - 200
