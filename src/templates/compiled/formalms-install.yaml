id: "formalms-install"
name: "Formalms Exposed Installation"
severity: "high"
description: "Formalms Installation is exposed."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "formalms"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>forma.lms installer</title>"
      - "<h1>forma.lms - Installation</h1>"
    condition: "and"
  - type: "status"
    status:
      - 200
