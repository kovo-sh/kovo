id: "composer-auth-json"
name: "Composer-auth Json File Disclosure"
severity: "low"
description: "Composer Auth JSON file is disclosed."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "devops"
  - "files"
  - "vuln"
reference: "https://www.exploit-db.com/ghdb/5768"
spaExclusion: true
request:
  method: "GET"
  path: "/.composer-auth.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "github-oauth"
      - "github.com"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
    negative: true
  - type: "status"
    status:
      - 200
