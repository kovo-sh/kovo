id: "phpmyfaq-installer"
name: "phpMyFAQ Installation - Exposure"
severity: "high"
description: "phpMyFAQ installation is exposed."
tech:
  - "php"
tags:
  - "misconfig"
  - "phpmyfaq"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/setup/index.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>phpMyFAQ"
      - "Setup</title>"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "phpmyfaq-setup"
