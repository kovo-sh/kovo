id: "poste-io-installer"
name: "Poste.io - Installer"
severity: "high"
description: "Poste.io is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic"
tags:
  - "misconfig"
  - "exposure"
  - "poste-io"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/admin/install/server"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Initial server configuration"
      - "poste"
    condition: "and"
  - type: "status"
    status:
      - 200
