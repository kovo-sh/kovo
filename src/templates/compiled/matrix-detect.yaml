id: "matrix-detect"
name: "Matrix Server Detect"
severity: "info"
description: "Detects Matrix servers based on .well-known entries. See https://en.wikipedia.org/wiki/Matrix_(protocol)"
tech:
  - "generic"
tags:
  - "tech"
  - "matrix"
  - "discovery"
reference: "https://spec.matrix.org/v1.3/server-server-api/#getwell-knownmatrixserver"
spaExclusion: true
request:
  method: "GET"
  path: "/.well-known/matrix/server"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "\"m\\.([a-z]+)\":"
  - type: "word"
    part: "header"
    words:
      - "text/html"
    negative: true
  - type: "status"
    status:
      - 200
