id: "apache-nifi-rce"
name: "Apache NiFi - Remote Code Execution"
severity: "critical"
description: "Apache NiFi is designed for data streaming. It supports highly configurable data routing, transformation, and system mediation logic that indicate graphs. The system has unauthorized remote command execution vulnerability."
tech:
  - "apache"
tags:
  - "packetstorm"
  - "apache"
  - "nifi"
  - "rce"
  - "vuln"
reference: "https://github.com/imjdl/Apache-NiFi-Api-RCE"
spaExclusion: true
request:
  method: "GET"
  path: "/nifi-api/process-groups/root"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "revision"
      - "canRead"
      - "permissions"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
