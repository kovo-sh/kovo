id: "unauth-jupyter-lab"
name: "Jupyter Lab - Unauthenticated Access"
severity: "critical"
description: "JupyterLab was able to be accessed without authentication."
tech:
  - "generic-web-exposure"
tags:
  - "unauth"
  - "jupyter"
  - "jupyterlab"
  - "misconfig"
  - "vuln"
cwe: "CWE-288"
reference: "https://paper.seebug.org/2058/"
spaExclusion: true
request:
  method: "GET"
  path: "/lab/api/settings/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"id\":"
      - "\"settings\""
      - "\"schema\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
