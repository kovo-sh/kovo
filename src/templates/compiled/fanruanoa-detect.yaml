id: "fanruanoa-detect"
name: "FanRuanOA-detect"
severity: "info"
description: "Safe check derived from fanruanoa-detect: FanRuanOA-detect"
tech:
  - "dotnet"
tags:
  - "oa"
  - "tech"
  - "dotnet"
  - "fanruan"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/WebReport/ReportServer"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "DeploySuccess._init"
