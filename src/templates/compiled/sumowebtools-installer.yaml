id: "sumowebtools-installer"
name: "SumoWebTools Installer Exposure"
severity: "high"
description: "SumoWebTools is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "sumowebtools"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "SumoWebTools Installer"
      - "configure"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
