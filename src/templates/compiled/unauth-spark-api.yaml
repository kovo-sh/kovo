id: "unauth-spark-api"
name: "Unauthenticated Spark REST API"
severity: "critical"
description: "The Spark product's REST API interface allows access to unauthenticated users."
tech:
  - "generic"
tags:
  - "spark"
  - "unauth"
  - "vuln"
cwe: "CWE-77"
reference: "https://xz.aliyun.com/t/2490"
spaExclusion: true
request:
  method: "GET"
  path: "/v1/submissions"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 400
  - type: "word"
    part: "body"
    words:
      - "Missing an action"
      - "serverSparkVersion"
    condition: "and"
