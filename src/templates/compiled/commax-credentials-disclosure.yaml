id: "commax-credentials-disclosure"
name: "COMMAX Smart Home Ruvie CCTV Bridge DVR - RTSP Credentials Disclosure"
severity: "critical"
description: "The COMMAX CCTV Bridge for the DVR service allows an unauthenticated attacker to disclose real time streaming protocol (RTSP) credentials in plain-text."
tech:
  - "generic"
tags:
  - "commax"
  - "exposure"
  - "camera"
  - "iot"
  - "vuln"
reference: "https://www.zeroscience.mk/en/vulnerabilities/ZSL-2021-5665.php"
spaExclusion: true
request:
  method: "GET"
  path: "/overview.asp"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DVR Lists"
      - "rtsp://"
      - "login_check.js"
      - "MAX USER :"
    condition: "and"
