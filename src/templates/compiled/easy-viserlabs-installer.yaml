id: "easy-viserlabs-installer"
name: "Easy Installer by ViserLab - Exposure"
severity: "high"
description: "Checks for the presence of a Easy Installer by ViserLab."
tech:
  - "generic-web-exposure"
tags:
  - "install"
  - "easy"
  - "exposure"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Easy Installer by ViserLab</title>"
  - type: "status"
    status:
      - 200
