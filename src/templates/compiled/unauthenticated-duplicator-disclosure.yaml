id: "unauthenticated-duplicator-disclosure"
name: "WordPress Duplicator Plugin - Information disclosure"
severity: "medium"
description: "Unauthenticated Information disclosure of Duplicator WordPress plugin sensitive files."
tech:
  - "wordpress"
tags:
  - "wordpress"
  - "wp"
  - "wp-plugin"
  - "misconfig"
  - "disclosure"
  - "unauth"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/backups-dup-lite/tmp/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Index of /wp-content/backups-dup-lite/"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
