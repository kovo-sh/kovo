id: "unauthorized-hp-printer"
name: "Unauthorized HP Printer"
severity: "high"
description: "HP Printer is exposed."
tech:
  - "generic"
tags:
  - "hp"
  - "iot"
  - "unauth"
  - "misconfig"
  - "intrusive"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/SSI/Auth/ip_snmp.htm"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "HP"
      - "<h1>SNMP</h1>"
    condition: "and"
  - type: "status"
    status:
      - 200
