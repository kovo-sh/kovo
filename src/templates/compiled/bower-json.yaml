id: "bower-json"
name: "bower.json File Disclosure"
severity: "info"
description: "Bower is a package manager which stores package information in the bower.json file"
tech:
  - "generic"
tags:
  - "exposure"
  - "files"
  - "bower"
  - "vuln"
reference: "https://github.com/bower/spec/blob/master/json.md"
spaExclusion: true
request:
  method: "GET"
  path: "/bower.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "name"
      - "description"
      - "main"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
