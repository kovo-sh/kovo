id: "jira-unauthenticated-projectcategories"
name: "Jira Unauthenticated Project Categories"
severity: "info"
description: "Safe check derived from jira-unauthenticated-projectcategories: Jira Unauthenticated Project Categories"
tech:
  - "generic"
tags:
  - "atlassian"
  - "jira"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/rest/api/2/projectCategory?maxResults=1000"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "self"
      - "description"
      - "name"
    condition: "and"
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "atlassian.xsrf.token"
