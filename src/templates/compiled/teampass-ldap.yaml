id: "teampass-ldap"
name: "Teampass LDAP Debug Config - Detect"
severity: "medium"
description: "Teampass ldap.debug.txt config was detected. This file is generated on \"/files/ldap.debug.txt\" for versions earlier than 3.0.0.0 when utilizing the \"Test current configuration\" in LDAP settings."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "teampass"
  - "ldap"
  - "logs"
  - "vuln"
cwe: "CWE-200"
reference: "https://github.com/nilsteampassnet/TeamPass/commit/ea9838481a58879cdf3def31046955efcff5a546#diff-61809be6a8fff101e3748a0c7dfad90bR16"
spaExclusion: true
request:
  method: "GET"
  path: "/files/ldap.debug.txt"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "header"
    words:
      - "base_dn"
      - "search_base"
      - "bind_dn"
      - "bind_passwd"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
  - type: "status"
    status:
      - 200
