id: "keycloak-json"
name: "Keycloak JSON File"
severity: "info"
description: "Safe check derived from keycloak-json: Keycloak JSON File"
tech:
  - "keycloak"
tags:
  - "exposure"
  - "keycloak"
  - "config"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/keycloak.json"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "realm"
      - "resource"
      - "auth-server-url"
    condition: "and"
  - type: "status"
    status:
      - 200
