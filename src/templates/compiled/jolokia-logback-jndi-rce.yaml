id: "jolokia-logback-jndi-rce"
name: "Jolokia Logback JNDI - Remote Code Execution"
severity: "high"
description: "Jolokia Logback is vulnerable to RCE."
tech:
  - "springboot"
  - "tomcat"
tags:
  - "jolokia"
  - "springboot"
  - "tomcat"
  - "rce"
  - "vuln"
reference: "https://thinkloveshare.com/hacking/ssrf_to_rce_with_jolokia_and_mbeans/"
spaExclusion: true
request:
  method: "GET"
  path: "/jolokia/list"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "ch.qos.logback.classic.jmx.JMXConfigurator"
      - "reloadByURL"
    condition: "and"
  - type: "status"
    status:
      - 200
