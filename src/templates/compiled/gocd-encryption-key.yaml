id: "gocd-encryption-key"
name: "GoCd Encryption Key"
severity: "low"
description: "GoCd Encryption Key is exposed."
tech:
  - "go"
tags:
  - "go"
  - "gocd"
  - "exposure"
  - "misconfig"
  - "vuln"
reference: "https://attackerkb.com/assessments/9101a539-4c6e-4638-a2ec-12080b7e3b50"
spaExclusion: true
request:
  method: "GET"
  path: "/go/add-on/business-continuity/api/cipher.aes"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "regex"
    part: "body"
    regex:
      - "([a-z0-9]){32}"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
