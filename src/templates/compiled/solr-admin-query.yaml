id: "solr-admin-query"
name: "Solr - Admin Page Access"
severity: "high"
description: "Solr's admin page was able to be accessed with no authentication requirements in place."
tech:
  - "generic"
tags:
  - "solr"
  - "unauth"
  - "edb"
  - "misconfig"
  - "discovery"
reference: "https://www.exploit-db.com/ghdb/5856"
spaExclusion: true
request:
  method: "GET"
  path: "/admin/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Solr admin page</title>"
  - type: "status"
    status:
      - 200
