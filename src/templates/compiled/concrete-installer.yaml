id: "concrete-installer"
name: "Concrete Installer"
severity: "high"
description: "Concrete is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "exposure"
  - "install"
  - "concrete"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/index.php/install"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "install concrete"
      - "choose language"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
