id: "unauth-mautic-upgrade"
name: "Unauthenticated Mautic Upgrade.php Exposure"
severity: "high"
description: "Upgrade.php page in Mautic is exposed."
tech:
  - "php"
tags:
  - "misconfig"
  - "unauth"
  - "mautic"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/upgrade.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Upgrade Mautic"
      - "Click here to start upgrade"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
