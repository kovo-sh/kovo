id: "request-baskets-exposure"
name: "Request Baskets - Exposure"
severity: "low"
description: "Request Baskets is exposed."
tech:
  - "generic"
tags:
  - "misconfig"
  - "requests-baskets"
  - "exposure"
  - "vuln"
reference: "https://notes.sjtu.edu.cn/s/MUUhEymt7#"
spaExclusion: true
request:
  method: "GET"
  path: "/web"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>Request Baskets</title>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
