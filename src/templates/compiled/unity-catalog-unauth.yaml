id: "unity-catalog-unauth"
name: "Unity Catalog - Unauthenticated API Access"
severity: "high"
description: "Unity Catalog OSS ships with server.authorization set to disable by default. In this mode the server does not register its authentication decorators, so the Unity Catalog REST API is reachable without a token. An unauthenticated GET /api/2.1/unity-catalog/catalogs returns the catalog listing, and the same access allows reading and changing schemas, tables, volumes, functions and models."
tech:
  - "generic"
tags:
  - "unity-catalog"
  - "exposure"
  - "misconfig"
  - "unauth"
cwe: "CWE-306"
reference: "https://docs.unitycatalog.io/server/auth/"
spaExclusion: true
request:
  method: "GET"
  path: "/api/2.1/unity-catalog/catalogs"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"catalogs\":"
      - "\"next_page_token\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
