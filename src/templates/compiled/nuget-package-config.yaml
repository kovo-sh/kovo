id: "nuget-package-config"
name: "NuGet Package.config File Disclosure"
severity: "info"
description: "Safe check derived from nuget-package-config: NuGet Package.config File Disclosure"
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "sass"
  - "devops"
  - "cicd"
  - "nuget"
  - "files"
  - "vuln"
reference: "https://learn.microsoft.com/en-us/nuget/reference/packages-config"
spaExclusion: true
request:
  method: "GET"
  path: "/packages.config"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
      - "<packages>"
      - "</packages>"
    condition: "and"
  - type: "status"
    status:
      - 200
