id: "sap-netweaver-webgui"
name: "SAP NetWeaver WebGUI Detection"
severity: "info"
description: "Detection of SAP NetWeaver ABAP Webserver WebGUI"
tech:
  - "generic"
tags:
  - "sap"
  - "webserver"
  - "tech"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/sap/bc/gui/sap/its/webgui"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "sap-system-login"
      - "<title>Logon</title>"
