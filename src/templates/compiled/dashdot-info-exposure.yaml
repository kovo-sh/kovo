id: "dashdot-info-exposure"
name: "Dashdot - Server Information Exposure"
severity: "medium"
description: "Dashdot is a self-hosted server dashboard that ships with no authentication by design, and its backend serves an unauthenticated /info endpoint returning static host information: operating system and kernel details, CPU brand and model, memory and storage layout, network interface details including the public IP, and the running Dashdot version. Any unauthenticated visitor to an internet-facing instance can read this host inventory without a credential."
tech:
  - "generic"
tags:
  - "dashdot"
  - "exposure"
  - "misconfig"
  - "discovery"
  - "unauth"
cwe: "CWE-200"
reference: "https://github.com/MauriceNino/dashdot"
spaExclusion: true
request:
  method: "GET"
  path: "/info"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"dash_version\""
      - "\"dash_buildhash\""
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
