id: "unauth-cyber-power-systems"
name: "Cyber Power Systems - Unauthenticated"
severity: "high"
description: "Detects unauthenticated access to Cyber Power Systems, which could lead to unauthorized control or information disclosure."
tech:
  - "generic"
tags:
  - "unauth"
  - "cyber-power"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/#/devices"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>PDNU</title>"
  - type: "status"
    status:
      - 200
