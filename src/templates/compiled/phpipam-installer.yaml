id: "phpipam-installer"
name: "PHP IPAM Installation Page - Exposed"
severity: "high"
description: "PHP IPAM is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "exposure"
  - "install"
  - "phpipam"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/index.php?page=install"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>phpipam installation</title>"
  - type: "status"
    status:
      - 200
