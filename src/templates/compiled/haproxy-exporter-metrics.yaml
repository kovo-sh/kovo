id: "haproxy-exporter-metrics"
name: "Detect Haproxy Exporter"
severity: "low"
description: "Haproxy metrics is exposed."
tech:
  - "generic"
tags:
  - "haproxy"
  - "exposure"
  - "debug"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/metrics"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "HELP haproxy_"
  - type: "word"
    part: "body"
    words:
      - "haproxy_exporter"
      - "haproxy_backend"
  - type: "status"
    status:
      - 200
