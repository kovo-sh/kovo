id: "msmtp-config"
name: "Msmtp - Config Exposure"
severity: "high"
description: "Msmtp configuration was discovered."
tech:
  - "generic"
tags:
  - "exposure"
  - "msmtp"
  - "vuln"
reference: "https://wiki.archlinux.org/title/Msmtp"
spaExclusion: true
request:
  method: "GET"
  path: "/.msmtprc"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "account"
      - "host"
      - "from"
      - "auth"
      - "tls"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
      - "octet-stream"
  - type: "status"
    status:
      - 200
