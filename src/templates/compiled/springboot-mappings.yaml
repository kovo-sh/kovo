id: "springboot-mappings"
name: "Detect Springboot Mappings Actuator"
severity: "low"
description: "Additional routes may be displayed"
tech:
  - "springboot"
  - "actuator"
tags:
  - "springboot"
  - "exposure"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/mappings"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "mappings"
      - "method"
      - "produces"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
      - "application/vnd.spring-boot.actuator"
      - "application/vnd.spring-boot.actuator.v1+json"
  - type: "status"
    status:
      - 200
