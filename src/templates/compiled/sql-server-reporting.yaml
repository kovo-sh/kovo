id: "sql-server-reporting"
name: "Detect Microsoft SQL Server Reporting"
severity: "info"
description: "Safe check derived from sql-server-reporting: Detect Microsoft SQL Server Reporting"
tech:
  - "dotnet"
  - "iis"
tags:
  - "tech"
  - "microsoft"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/Reports/Pages/Folder.aspx"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Report Manager"
