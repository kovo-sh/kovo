id: "kube-state-metrics"
name: "Kube State Metrics Exposure"
severity: "low"
description: "An attacker can detect the public instance of a Kube-State-Metrics metrics. The Kubernetes API server exposes data about the count, health, and availability of pods, nodes, and other Kubernetes objects."
tech:
  - "kubernetes"
tags:
  - "misconfig"
  - "exposure"
  - "kube-state-metrics"
  - "k8s"
  - "kubernetes"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/metrics"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "kube-state-metrics"
      - "go_goroutines"
    condition: "and"
  - type: "status"
    status:
      - 200
