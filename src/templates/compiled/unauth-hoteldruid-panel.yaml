id: "unauth-hoteldruid-panel"
name: "Hoteldruid Management Panel Access"
severity: "high"
description: "A vulnerability in Hoteldruid Panel allows remote unauthenticated users access to the management portal without authentication."
tech:
  - "php"
tags:
  - "hoteldruid"
  - "panel"
  - "unauth"
  - "vuln"
cwe: "CWE-522"
reference: "https://github.com/nomi-sec/PoC-in-GitHub/blob/master/2021/CVE-2021-42949.json"
spaExclusion: true
request:
  method: "GET"
  path: "/hoteldruid/inizio.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "<title> HotelDruid </title>"
      - "<b>INSERT:</b>"
      - "<b>TABLES:</b>"
    condition: "and"
