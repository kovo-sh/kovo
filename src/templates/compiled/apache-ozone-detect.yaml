id: "apache-ozone-detect"
name: "Apache Ozone - Detect"
severity: "info"
description: "Detects a Apache Ozone web application, a scalable, redundant, and distributed object store for Hadoop and Cloud-native environments."
tech:
  - "apache"
tags:
  - "tech"
  - "ozone"
  - "apache"
  - "detect"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/static/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Apache Ozone</title>"
  - type: "status"
    status:
      - 200
