id: "exposed-service-now"
name: "ITMS-Misconfigured"
severity: "info"
description: "Detection of misconfigured ServiceNow ITSM instances."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "servicenow"
  - "vuln"
reference: "https://medium.com/@th3g3nt3l/multiple-information-exposed-due-to-misconfigured-service-now-itsm-instances-de7a303ebd56"
spaExclusion: true
request:
  method: "GET"
  path: "/kb_view_customer.do?sysparm_article=KB00xxxx"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Unfortunately the article you are looking for could not be found."
  - type: "status"
    status:
      - 200
