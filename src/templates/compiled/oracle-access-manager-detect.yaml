id: "oracle-access-manager-detect"
name: "Oracle Access Manager Detect"
severity: "info"
description: "Safe check derived from oracle-access-manager-detect: Oracle Access Manager Detect"
tech:
  - "generic"
tags:
  - "tech"
  - "oracle"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/oamfed/idp/soap"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "processing the SOAP Request"
  - type: "word"
    part: "header"
    words:
      - "text/xml"
  - type: "status"
    status:
      - 200
