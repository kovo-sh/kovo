id: "ftp-credentials-exposure"
name: "FTP Credentials Exposure"
severity: "high"
description: "FTP credentials were detected."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "ftp"
  - "exposure"
  - "vuln"
cwe: "CWE-200"
spaExclusion: true
request:
  method: "GET"
  path: "/ftpsync.settings"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "FTPSync"
      - "overwrite_newer_prevention"
      - "default_folder_permissions"
    condition: "and"
  - type: "status"
    status:
      - 200
