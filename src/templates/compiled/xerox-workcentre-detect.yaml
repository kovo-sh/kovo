id: "xerox-workcentre-detect"
name: "Xerox Workcentre Detect"
severity: "info"
description: "Safe check derived from xerox-workcentre-detect: Xerox Workcentre Detect"
tech:
  - "generic"
tags:
  - "tech"
  - "xerox"
  - "workcentre"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/index.dhtml"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "XEROX WORKCENTRE"
      - "/header.php?tab=status"
    condition: "and"
  - type: "status"
    status:
      - 200
