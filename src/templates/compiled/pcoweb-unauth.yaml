id: "pcoweb-unauth"
name: "pCOWeb - Unauth"
severity: "high"
description: "Safe check derived from pcoweb-unauth: pCOWeb - Unauth"
tech:
  - "generic-web-exposure"
tags:
  - "pcoweb"
  - "unauth"
  - "misconfig"
  - "exposure"
  - "vuln"
reference: "https://docs.librenms.org/Support/Device-Notes/Carel-pCOweb-Devices/#:~:text=Accessing%20the%20pCOWeb%20card,-Log%20on%20to&text=The%20default%20username%20and%20password%20is%20admin%2Ffadmin%20."
spaExclusion: true
request:
  method: "GET"
  path: "/config/pw_left_bar.html"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "all"
    words:
      - "System is using"
      - "pCOWeb"
      - "Configuration"
    condition: "and"
  - type: "status"
    status:
      - 200
