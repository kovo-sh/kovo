id: "npm-anonymous-cli"
name: "NPM Anonymous CLI Metrics Exposure"
severity: "info"
description: "Safe check derived from npm-anonymous-cli: NPM Anonymous CLI Metrics Exposure"
tech:
  - "generic"
tags:
  - "exposure"
  - "npm"
  - "config"
  - "files"
  - "vuln"
reference: "https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt"
spaExclusion: true
request:
  method: "GET"
  path: "/.npm/anonymous-cli-metrics.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"metricId\":"
      - "\"metrics\":"
      - "\"successfulInstalls\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
