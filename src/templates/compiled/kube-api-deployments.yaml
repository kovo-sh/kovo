id: "kube-api-deployments"
name: "Kube API Deployments"
severity: "info"
description: "Scans for kube deployments"
tech:
  - "kubernetes"
tags:
  - "tech"
  - "k8s"
  - "kubernetes"
  - "devops"
  - "kube"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/apis/apps/v1/namespaces/default/deployments"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "\"DeploymentList\":"
      - "\"items\":"
    condition: "and"
