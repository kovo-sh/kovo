id: "wanhuoa-officeserverservlet-file-upload"
name: "Wanhu OA OfficeServerServlet - Arbitrary File Upload"
severity: "critical"
description: "Wanhu OA officeserverservlet file upload vulnerability"
tech:
  - "generic"
tags:
  - "wanhu"
  - "oa"
  - "officeserver"
  - "fileupload"
  - "intrusive"
  - "vuln"
reference: "https://github.com/onMey/WH/blob/main/poc.py"
spaExclusion: true
request:
  method: "GET"
  path: "/defaultroot/officeserverservlet"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "DBSTEP V3.0"
      - "Post"
    condition: "and"
  - type: "status"
    status:
      - 200
