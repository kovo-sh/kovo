id: "package-json"
name: "NPM package.json Disclosure"
severity: "low"
description: "All NodeJS packages contain a file, usually in the project root, called package.json - this file holds various metadata relevant to the project generated by package managers such as npm, yarn, pnpm."
tech:
  - "node"
tags:
  - "config"
  - "exposure"
  - "node"
  - "npm"
  - "vuln"
cwe: "CWE-552"
reference: "https://docs.npmjs.com/cli/v9/configuring-npm/package-json"
spaExclusion: true
request:
  method: "GET"
  path: "/package.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "name"
      - "version"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
