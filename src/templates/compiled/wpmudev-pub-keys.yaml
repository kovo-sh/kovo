id: "wpmudev-pub-keys"
name: "Wpmudev Dashboard Pub Key"
severity: "medium"
description: "Wpmudev Wordpress Plugin public key leaked."
tech:
  - "wordpress"
tags:
  - "wordpress"
  - "edb"
  - "vuln"
reference: "https://www.exploit-db.com/ghdb/6443"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/wpmudev-updates/keys/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Index of /"
      - ".pub"
      - "wpmudev"
    condition: "and"
  - type: "status"
    status:
      - 200
