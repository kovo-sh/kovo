id: "revive-adserver-installer"
name: "Revive Adserver - Exposed Installer"
severity: "high"
description: "Detected exposed Revive Adserver installation wizard that allows unauthorized installation and configuration."
tech:
  - "php"
tags:
  - "misconfig"
  - "revive"
  - "adserver"
  - "exposure"
  - "unauth"
reference: "https://github.com/revive-adserver/revive-adserver"
spaExclusion: true
request:
  method: "GET"
  path: "/www/admin/install.php?action=welcome"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Installing Revive Adserver"
      - "installer"
    condition: "and"
  - type: "status"
    status:
      - 200
