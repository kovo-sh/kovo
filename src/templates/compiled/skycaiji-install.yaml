id: "skycaiji-install"
name: "SkyCaiji - Exposed Installation"
severity: "high"
description: "SkyCaiji was discovered."
tech:
  - "php"
tags:
  - "tech"
  - "skycaiji"
  - "exposure"
  - "misconfig"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/index.php?s=/install/index/index"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<title>蓝天采集器 SkyCaiji 安装</title>"
      - "https://www.skycaiji.com"
      - "<a href=\"/index.php?s=/Install/Index/step1\" class=\"btn btn-lg btn-success\">"
    condition: "and"
  - type: "status"
    status:
      - 200
