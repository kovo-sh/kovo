id: "moodle-installer"
name: "Moodle Installation Exposure"
severity: "high"
description: "Moodle is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "moodle"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install.php"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Installation - Moodle"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
