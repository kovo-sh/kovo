id: "sap-message-server-console"
name: "SAP Message Server Console - Exposure"
severity: "info"
description: "Detected the SAP Message Server HTTP console on /msgserver. When accessed directly, the message server returns an HTML page."
tech:
  - "generic"
tags:
  - "sap"
  - "console"
  - "exposure"
spaExclusion: true
request:
  method: "GET"
  path: "/msgserver"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<TITLE>List of commands</TITLE>"
      - "/msgserver/commands"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "SAP Message Server"
  - type: "status"
    status:
      - 200
