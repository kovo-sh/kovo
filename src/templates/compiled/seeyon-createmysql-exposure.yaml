id: "seeyon-createmysql-exposure"
name: "Seeyon OA A6 createMysql.jsp Database - Information Disclosure"
severity: "medium"
description: "Seeyon OA A6 has leaked sensitive database information. An attacker can obtain the database account and password MD5 by accessing a specific URL."
tech:
  - "tomcat"
  - "java"
tags:
  - "seeyon"
  - "oa"
  - "info-leak"
  - "vuln"
reference: "https://github.com/achuna33/MYExploit/blob/8ffbf7ee60cbd77ad90b0831b93846aba224ab29/src/main/java/com/achuna33/Controllers/SeeyonController.java"
spaExclusion: true
request:
  method: "GET"
  path: "/yyoa/createMysql.jsp"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "root</br>"
  - type: "regex"
    part: "body"
    regex:
      - "[*][0-zA-Z]{40}</br>"
  - type: "status"
    status:
      - 200
