id: "forgejo-repo-exposure"
name: "Forgejo Repositories - Exposure"
severity: "medium"
description: "The Forgejo repo is being exposed publically."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "exposure"
  - "forgejo"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/explore/repos"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Powered by Forgejo"
      - "Explore</a>"
      - "Repositories"
    condition: "and"
  - type: "status"
    status:
      - 200
