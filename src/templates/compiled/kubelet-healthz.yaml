id: "kubelet-healthz"
name: "Kubelet Healthz"
severity: "info"
description: "Scans for kubelet healthz"
tech:
  - "kubernetes"
tags:
  - "tech"
  - "k8s"
  - "kubernetes"
  - "devops"
  - "kubelet"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/healthz"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "regex"
    part: "header"
    regex:
      - "text/plain"
  - type: "word"
    part: "body"
    words:
      - "ok"
  - type: "word"
    part: "header"
    words:
      - "Kubernetes"
