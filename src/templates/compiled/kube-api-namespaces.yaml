id: "kube-api-namespaces"
name: "Kube API Namespaces"
severity: "info"
description: "Scans for kube namespaces"
tech:
  - "kubernetes"
tags:
  - "tech"
  - "k8s"
  - "kubernetes"
  - "devops"
  - "kube"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/api/v1/namespaces"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "\"NamespaceList\":"
      - "\"items\":"
    condition: "and"
