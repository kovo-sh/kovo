id: "gnuboard-detect"
name: "Gnuboard CMS - Detect"
severity: "info"
description: "Gnuboard CMS was detected."
tech:
  - "generic"
tags:
  - "tech"
  - "gnuboard"
  - "discovery"
cwe: "CWE-200"
reference: "https://sir.kr/"
spaExclusion: true
request:
  method: "GET"
  path: "/LICENSE.txt"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "GNU Board"
      - "http://sir.kr"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/plain"
