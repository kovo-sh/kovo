id: "nagios-logserver-installer"
name: "Nagios Log Server - Install"
severity: "high"
description: "Detects the presence of a Nagios Log Server installation page, which can expose configuration setup information or initialization steps."
tech:
  - "generic"
tags:
  - "misconfig"
  - "install"
  - "nagios"
  - "nagios-logserver"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/nagioslogserver/install"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Nagios Log Server"
      - "Install</a>"
    condition: "and"
  - type: "status"
    status:
      - 200
