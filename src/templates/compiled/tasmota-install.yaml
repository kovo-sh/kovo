id: "tasmota-install"
name: "Tasmota Installer Exposure"
severity: "high"
description: "Tasmota is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "tasmota"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Install Tasmota"
      - "Tasmota Installer"
  - type: "status"
    status:
      - 200
