id: "cold-fusion-cfcache-map"
name: "Discover Cold Fusion cfcache.map Files"
severity: "low"
description: "Adobe Cold Fusion cfcache.map file is exposed."
tech:
  - "generic"
tags:
  - "exposure"
  - "coldfusion"
  - "adobe"
  - "files"
  - "vuln"
reference: "https://securiteam.com/windowsntfocus/5bp081f0ac/"
spaExclusion: true
request:
  method: "GET"
  path: "/cfcache.map"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Mapping="
      - "SourceTimeStamp="
    condition: "and"
  - type: "status"
    status:
      - 200
