id: "wordpress-redirection-plugin-listing"
name: "WordPress Redirection Plugin Directory Listing"
severity: "info"
description: "Searches for sensitive directories present in the redirection plugin."
tech:
  - "wordpress"
tags:
  - "wordpress"
  - "listing"
  - "plugin"
  - "edb"
  - "vuln"
reference: "https://www.exploit-db.com/ghdb/6436"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/redirection/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Index of"
      - "/wp-content/plugins/redirection/"
    condition: "and"
  - type: "status"
    status:
      - 200
