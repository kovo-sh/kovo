id: "webuzo-installer"
name: "Webuzo Installer"
severity: "high"
description: "Webuzo is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "misconfig"
  - "webuzo"
  - "install"
  - "exposure"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/install.php"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Webuzo Installer"
      - "Webuzo Initial Setup"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
