id: "virtual-smartzone-installer"
name: "Virtual SmartZone Setup Wizard - Exposure"
severity: "high"
description: "Detects exposed Virtual SmartZone Installation page."
tech:
  - "generic-web-exposure"
tags:
  - "misconfig"
  - "install"
  - "exposure"
  - "virtual-smartzone"
  - "vuln"
reference: "https://support.ruckuswireless.com/products/83-virtual-smartzone-vsz"
spaExclusion: true
request:
  method: "GET"
  path: "/adminweb/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Virtual SmartZone"
      - "Setup Wizard"
    condition: "and"
  - type: "status"
    status:
      - 200
