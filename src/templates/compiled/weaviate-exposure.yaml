id: "weaviate-exposure"
name: "Weaviate - Exposure"
severity: "low"
description: "Detected an exposed Weaviate instance by accessing its API endpoints. Verified exposure by identifying meta information, schema details, and specific endpoint references in the response, confirming that the instance was publicly accessible."
tech:
  - "generic"
tags:
  - "weaviate"
  - "exposure"
  - "api"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/v1/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Meta information about this instance/cluster"
      - "view complete schema"
    condition: "and"
  - type: "regex"
    part: "body"
    regex:
      - "\"href\":\"/v1/schema\""
  - type: "status"
    status:
      - 200
