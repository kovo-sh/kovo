id: "desktop-ini-exposure"
name: "desktop.ini exposure"
severity: "info"
description: "Safe check derived from desktop-ini-exposure: desktop.ini exposure"
tech:
  - "generic"
tags:
  - "exposure"
  - "config"
  - "files"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/desktop.ini"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "header"
    words:
      - "application/json"
      - "application/html"
    condition: "and"
    negative: true
  - type: "word"
    part: "body"
    words:
      - "[.ShellClassInfo]"
      - "[LocalizedFileNames]"
      - "[ViewState]"
  - type: "status"
    status:
      - 200
