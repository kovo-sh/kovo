id: "wekan-signup-page"
name: "Wekan Sign Up Page - Exposure"
severity: "medium"
description: "Detected exposed Wekan sign-up functionality, indicating that unauthenticated users could access the registration page and potentially create new accounts."
tech:
  - "generic"
tags:
  - "wekan"
  - "sign-up"
  - "register"
  - "exposure"
  - "vuln"
reference: "https://wekan.fi/"
spaExclusion: true
request:
  method: "GET"
  path: "/sign-up"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "__meteor_runtime_config__"
      - "Wekan"
    condition: "and"
  - type: "regex"
    part: "body"
    regex:
      - "<link rel=\"stylesheet\".*meteor_css_resource=true"
