id: "python-metrics"
name: "Detect Python Exposed Metrics"
severity: "low"
description: "Information Disclosure of Garbage Collection"
tech:
  - "python"
tags:
  - "exposure"
  - "devops"
  - "python"
  - "misconfig"
  - "vuln"
reference: "https://gist.github.com/ruanbekker/e5b1e7895f62b020ff29b5f40767190c"
spaExclusion: true
request:
  method: "GET"
  path: "/metrics"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "python_gc_objects_collected_total"
      - "python_info"
    condition: "and"
  - type: "status"
    status:
      - 200
