id: "kubelet-pods"
name: "Kubelet Scan"
severity: "info"
description: "Scans for kubelet pods"
tech:
  - "kubernetes"
tags:
  - "tech"
  - "k8s"
  - "kubernetes"
  - "devops"
  - "kubelet"
  - "pods"
  - "discovery"
spaExclusion: true
request:
  method: "GET"
  path: "/pods"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "body"
    words:
      - "\"PodList\":"
      - "\"items\":"
    condition: "and"
