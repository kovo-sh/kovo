id: "firebase-debug-log"
name: "Firebase Debug Log File Exposure"
severity: "low"
description: "Firebase debug log file was exposed."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "firebase"
  - "logs"
  - "debug"
  - "vuln"
reference: "https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt"
spaExclusion: true
request:
  method: "GET"
  path: "/firebase-debug.log"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "[debug]"
      - "firebase"
      - "googleapis.com"
    condition: "and"
  - type: "status"
    status:
      - 200
