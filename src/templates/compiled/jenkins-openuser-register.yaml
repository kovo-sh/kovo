id: "jenkins-openuser-register"
name: "Jenkins Open User registration"
severity: "medium"
description: "The Jenkins allows registering a new user and accessing the dashboard."
tech:
  - "jenkins"
  - "apache"
  - "tomcat"
tags:
  - "misconfig"
  - "jenkins"
  - "apache"
  - "tomcat"
  - "vuln"
reference: "https://www.acunetix.com/vulnerabilities/web/jenkins-open-user-registration/"
spaExclusion: true
request:
  method: "GET"
  path: "/signup"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Create an account! [Jenkins]"
      - "Register [Jenkins]"
      - "Register - Jenkins"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
