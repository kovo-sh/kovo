id: "rethinkdb-admin-console"
name: "RethinkDB Administration Console - Detect"
severity: "medium"
description: "RethinkDB Administration Console was detected."
tech:
  - "generic"
tags:
  - "misconfig"
  - "rethinkdb"
  - "console"
  - "dashboard"
  - "vuln"
cwe: "CWE-200"
reference: "https://rethinkdb.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/#dashboard"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "RethinkDB Administration Console"
  - type: "status"
    status:
      - 200
