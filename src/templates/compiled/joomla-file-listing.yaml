id: "joomla-file-listing"
name: "Joomla! Database File List"
severity: "medium"
description: "A Joomla! database directory /libraries/joomla/database/ was found exposed and has directory indexing enabled."
tech:
  - "generic-web-exposure"
tags:
  - "exposure"
  - "joomla"
  - "listing"
  - "database"
  - "edb"
  - "vuln"
cwe: "CWE-548"
reference: "https://www.exploit-db.com/ghdb/6377"
spaExclusion: true
request:
  method: "GET"
  path: "/libraries/joomla/database/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Index of /libraries/joomla/database"
      - "Parent Directory"
    condition: "and"
  - type: "status"
    status:
      - 200
