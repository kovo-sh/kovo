id: "turbo-website-installer"
name: "Turbo Website Reviewer Installer Panel"
severity: "high"
description: "Turbo Website Reviewer is susceptible to the Installation page exposure due to misconfiguration."
tech:
  - "php"
tags:
  - "turbo"
  - "misconfig"
  - "exposure"
  - "install"
  - "vuln"
spaExclusion: true
request:
  method: "GET"
  path: "/admin/install/install.php"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Turbo Website Reviewer | Installer panel"
      - ">Admin!</a> </p>"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/html"
  - type: "status"
    status:
      - 200
