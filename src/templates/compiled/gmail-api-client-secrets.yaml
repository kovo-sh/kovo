id: "gmail-api-client-secrets"
name: "GMail API - Detect"
severity: "info"
description: "GMail API was detected."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "exposure"
  - "vuln"
cwe: "CWE-200"
reference: "https://developers.google.com/gmail/api/auth/web-server"
spaExclusion: true
request:
  method: "GET"
  path: "/client_secrets.json"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "client_id"
      - "auth_uri"
      - "token_uri"
    condition: "and"
  - type: "status"
    status:
      - 200
  - type: "word"
    part: "header"
    words:
      - "application/json"
