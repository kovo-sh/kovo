id: "docusaurus-detect"
name: "Docusaurus - Detect"
severity: "info"
description: "Docusaurus is an open-source static site generator designed for documentation websites."
tech:
  - "generic"
tags:
  - "tech"
  - "docusaurus"
  - "documentation"
  - "static-site-generator"
  - "detect"
reference: "https://docusaurus.io/"
spaExclusion: true
request:
  method: "GET"
  path: "/"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "regex"
    part: "body"
    regex:
      - "<meta name=\"generator\" content=\"Docusaurus v[0-9]+\\.[0-9]+"
  - type: "word"
    part: "body"
    words:
      - "name=\"docusaurus_locale\""
      - "name=\"docusaurus_tag\""
    condition: "and"
  - type: "status"
    status:
      - 200
