id: "rexify-config-exposure"
name: "Rexify Configuration - Exposure"
severity: "high"
description: "Rexfile configuration from the Rex/Rexify automation framework was exposed. These files may contain SSH credentials, server hostnames, private key paths, and other sensitive data."
tech:
  - "generic"
tags:
  - "exposure"
  - "config"
  - "rexify"
  - "rex"
  - "devops"
  - "vuln"
reference: "https://www.rexify.org/"
spaExclusion: true
request:
  method: "GET"
  path: "/Rexfile"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "use Rex"
      - "task"
      - "group"
      - "user"
      - "password"
      - "desc"
    condition: "and"
  - type: "status"
    status:
      - 200
