id: "wp-user-enum"
name: "WordPress REST API User Enumeration"
severity: "low"
description: "The REST API exposed user data for all users who had authored a post of a public post type. WordPress 4.7.1 limits this to only post types which have specified that they should be shown within the REST API."
tech:
  - "wordpress"
tags:
  - "cve2017"
  - "cve"
  - "wordpress"
  - "wp"
  - "edb"
  - "vuln"
reference: "https://www.acunetix.com/vulnerabilities/web/wordpress-rest-api-user-enumeration/"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-json/wp/v2/users/"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"id\":"
      - "\"name\":"
      - "\"slug\":"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "application/json"
  - type: "status"
    status:
      - 200
