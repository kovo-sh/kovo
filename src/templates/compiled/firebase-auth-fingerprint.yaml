id: "firebase-auth-fingerprint"
name: "Firebase Authentication - Fingerprint"
severity: "info"
description: "Identifies applications using Firebase for authentication by requesting the auth helper script and checking for Firebase license, SDK version, and terms-of-service references."
tech:
  - "generic"
tags:
  - "firebase"
  - "fingerprint"
  - "tech"
reference: "https://firebase.google.com/docs/auth/web/redirect-best-practices"
spaExclusion: true
request:
  method: "GET"
  path: "/__/auth/handler.js"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "@license Firebase"
  - type: "regex"
    part: "body"
    regex:
      - "Build: [0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?"
  - type: "word"
    part: "body"
    words:
      - "https://firebase.google.com/terms/"
