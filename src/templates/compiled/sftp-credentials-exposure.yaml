id: "sftp-credentials-exposure"
name: "SFTP Configuration File - Credentials Exposure"
severity: "high"
description: "SFTP configuration file was detected."
tech:
  - "generic-web-exposure"
tags:
  - "sftp"
  - "config"
  - "exposure"
  - "vuln"
cwe: "CWE-200"
reference: "https://blog.sucuri.net/2012/11/psa-sftpftp-password-exposure-via-sftp-config-json.html"
spaExclusion: true
request:
  method: "GET"
  path: "/sftp-config.json"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "or"
matchers:
  - type: "word"
    part: "body"
    words:
      - "\"host\":"
      - "\"user\":"
      - "\"password\":"
      - "\"remote_path\":"
    condition: "and"
  - type: "word"
    part: "body"
    words:
      - "file_permissions"
      - "extra_list_connections"
    condition: "and"
