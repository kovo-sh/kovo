id: "exposed-mysql-initial"
name: "mysql.initial Config - Detect"
severity: "info"
description: "mysql.initial configuration file was detected."
tech:
  - "generic-web-exposure"
tags:
  - "config"
  - "exposure"
  - "hackerone"
  - "vuln"
cwe: "CWE-200"
reference: "https://hackerone.com/reports/1081817"
spaExclusion: true
request:
  method: "GET"
  path: "/mysql.initial.sql"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "Roundcube Webmail initial database structure"
  - type: "status"
    status:
      - 200
