id: "circarlife-installer"
name: "CirCarLife - Installer"
severity: "critical"
description: "A CirCarLife admin panel was accessed. CirCarLife is an internet-connected electric vehicle charging station"
tech:
  - "generic-web-exposure"
tags:
  - "scada"
  - "circontrol"
  - "circarlife"
  - "setup"
  - "exposure"
  - "panel"
  - "installer"
  - "misconfig"
cwe: "CWE-284"
reference: "https://circontrol.com/"
spaExclusion: true
request:
  method: "GET"
  path: "/html/setup.html"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "header"
    words:
      - "CirCarLife Scada"
  - type: "word"
    part: "body"
    words:
      - "<title>- setup</title>"
      - "Network setup"
      - "Modem setup"
      - "Security setup"
    condition: "and"
  - type: "status"
    status:
      - 200
