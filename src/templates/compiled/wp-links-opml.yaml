id: "wp-links-opml"
name: "WordPress wp-links-opml.php - Version Disclosure"
severity: "info"
description: "WordPress wp-links-opml.php file was publicly accessible and expossed the WordPress version in the generator tag."
tech:
  - "wordpress"
  - "php"
tags:
  - "exposure"
  - "wordpress"
  - "wp"
  - "version"
  - "files"
  - "vuln"
reference: "https://www.acunetix.com/vulnerabilities/web/wordpress-version-disclosed/"
spaExclusion: true
request:
  method: "GET"
  path: "/wp-links-opml.php"
control:
  method: "GET"
  path: "/.kovo-none-{{rand}}"
matchers-condition: "and"
matchers:
  - type: "word"
    part: "body"
    words:
      - "generator="
      - "WordPress/"
    condition: "and"
  - type: "word"
    part: "header"
    words:
      - "text/xml"
  - type: "status"
    status:
      - 200
