# Kovo Hunter LabRunner compose file: single hardened service, no ports / privileged / cap_add / host mounts.
# LabRunner re-emits its own sanitized `docker run` (--internal network, --cap-drop ALL, --read-only).
services:
  app:
    build: .
    internalPort: 3000
    healthPath: /health
    environment:
      - HELD_OUT_SAAS_LAB=1
