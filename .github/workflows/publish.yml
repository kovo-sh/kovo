name: Publish

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First publication only; subsequent releases use trusted publishing
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Serialize bootstrap and OIDC releases without cancelling a publish in progress.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_USERCONFIG: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deliberately omit registry-url: setup-node must not create token auth
      # configuration for the trusted-publishing path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Pin npm
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@kovo-security/cli' ||
              pkg.license !== 'SEE LICENSE IN LICENSE' ||
              typeof pkg.version !== 'string' ||
              !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pkg.version) ||
              ['dependencies', 'optionalDependencies', 'peerDependencies'].some(
                key => pkg[key] !== undefined && (pkg[key] === null ||
                  typeof pkg[key] !== 'object' || Array.isArray(pkg[key]) ||
                  Object.keys(pkg[key]).length !== 0))) {
            throw new Error('Invalid release package metadata');
          }
          const { RELEASE_EVENT: event, RELEASE_REF: ref } = process.env;
          if (event !== 'workflow_dispatch' || ref !== 'refs/heads/main') {
            throw new Error('Release must be dispatched on main');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${pkg.name}\nversion=${pkg.version}\n`);
          NODE
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Build and smoke test
        run: |
          npm run build
          (cd dist && sha256sum --check kovo.js.sha256)
          node dist/kovo.js --version
      - name: Pack the verified release
        id: pack
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          node --input-type=module <<'NODE'
          import { appendFileSync, lstatSync, readFileSync, readdirSync, renameSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const files = readdirSync('release');
          if (files.length !== 1 || !files[0].endsWith('.tgz') ||
              !lstatSync(`release/${files[0]}`).isFile()) {
            throw new Error('Pack must produce exactly one tarball');
          }
          renameSync(`release/${files[0]}`, 'release/package.tgz');
          const sha256 = createHash('sha256').update(readFileSync('release/package.tgz')).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: release/package.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_USERCONFIG: /dev/null
      TARBALL_PATH: ${{ github.workspace }}/release/package.tgz
    steps:
      # No source checkout or package dependency installation in this job.
      # Omit registry-url so setup-node does not create token auth configuration.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Pin npm
        run: npm install --global npm@11.5.1 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: release
      - name: Verify tarball and release metadata
        id: verified
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_NAME: ${{ needs.build.outputs.name }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { lstatSync, readFileSync, readdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const files = readdirSync('release');
          if (files.length !== 1 || files[0] !== 'package.tgz' ||
              !lstatSync(process.env.TARBALL_PATH).isFile()) {
            throw new Error('Artifact must contain exactly one tarball file');
          }
          const digest = createHash('sha256').update(readFileSync(process.env.TARBALL_PATH)).digest('hex');
          if (!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_SHA256 ?? '') ||
              digest !== process.env.EXPECTED_SHA256) {
            throw new Error('Tarball digest mismatch');
          }
          NODE
          metadata_dir=$(mktemp -d)
          trap 'rm -rf "$metadata_dir"' EXIT
          # Extract only metadata to stdout: never unpack or execute package code.
          tar --extract --gzip --file "$TARBALL_PATH" --to-stdout -- package/package.json > "$metadata_dir/package.json"
          RELEASE_METADATA="$metadata_dir/package.json" node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync(process.env.RELEASE_METADATA, 'utf8'));
          if (pkg.name !== '@kovo-security/cli' ||
              pkg.license !== 'SEE LICENSE IN LICENSE' ||
              typeof pkg.version !== 'string' ||
              !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pkg.version) ||
              ['dependencies', 'optionalDependencies', 'peerDependencies'].some(
                key => pkg[key] !== undefined && (pkg[key] === null ||
                  typeof pkg[key] !== 'object' || Array.isArray(pkg[key]) ||
                  Object.keys(pkg[key]).length !== 0)) ||
              pkg.name !== process.env.EXPECTED_NAME || pkg.version !== process.env.EXPECTED_VERSION) {
            throw new Error('Invalid release package metadata');
          }
          const { RELEASE_EVENT: event, RELEASE_REF: ref } = process.env;
          if (event !== 'workflow_dispatch' || ref !== 'refs/heads/main') {
            throw new Error('Release must be dispatched on main');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${pkg.name}\nversion=${pkg.version}\n`);
          NODE
      - name: Require an absent package for bootstrap or a newer OIDC version
        env:
          PACKAGE_NAME: ${{ steps.verified.outputs.name }}
          PACKAGE_VERSION: ${{ steps.verified.outputs.version }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          node --input-type=module <<'NODE'
          const pkg = { name: process.env.PACKAGE_NAME, version: process.env.PACKAGE_VERSION };
          const response = await fetch('https://registry.npmjs.org/@kovo-security%2fcli', {
            signal: AbortSignal.timeout(30000),
            redirect: 'error',
          });
          const body = await response.json();
          if (process.env.BOOTSTRAP === 'true') {
            if (response.status !== 404 || body.error !== 'Not found') {
              throw new Error('Bootstrap requires an absent package; registry lookup refused');
            }
          } else {
            if (process.env.BOOTSTRAP !== 'false' || response.status !== 200 ||
                body.name !== pkg.name || !body.versions ||
                typeof body.versions !== 'object' || Array.isArray(body.versions) ||
                Object.keys(body.versions).length === 0) {
              throw new Error('Trusted publishing requires existing registry versions');
            }
            const next = pkg.version.split('.').map(BigInt);
            for (const version of Object.keys(body.versions)) {
              const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?$/.exec(version);
              if (!match || [match[4], match[5]].some(suffix =>
                  suffix && suffix.split('.').some(part => !/^[0-9A-Za-z-]+$/.test(part))) ||
                  match[4]?.split('.').some(part => /^0\d+$/.test(part))) {
                throw new Error('Malformed registry version');
              }
              const previous = match.slice(1, 4).map(BigInt);
              const different = next.findIndex((part, i) => part !== previous[i]);
              if (different === -1 ? !match[4] : next[different] < previous[different]) {
                throw new Error('Release version must be newer than every published version');
              }
            }
          }
          NODE
      - name: Publish first version with provenance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CLI_BOOTSTRAP_TOKEN }}
        run: |
          umask 077
          auth_file=$(mktemp)
          trap 'rm -f "$auth_file"' EXIT
          # npm expands this placeholder; keep the credential out of the file.
          # shellcheck disable=SC2016
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$auth_file"
          NPM_CONFIG_USERCONFIG="$auth_file" npm publish "$TARBALL_PATH" --provenance --access public
      - name: Publish with OIDC provenance
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bootstrap) }}
        run: npm publish "$TARBALL_PATH" --provenance --access public
