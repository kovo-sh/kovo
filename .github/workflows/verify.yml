name: Verify Kovo Hunter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run worker:install
      - name: Fast static ratchets (v8 contamination, fixture contamination, unwired exports, contract-change)
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/check-v8-contamination.ts
          node scripts/check-fixture-contamination.ts
          node scripts/check-unwired.ts
          node scripts/check-contract-change.ts --base "$CONTRACT_BASE"
      - name: Typecheck and enforce tsc memory/time budget
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          npm run check -- --extendedDiagnostics | tee /tmp/tsc-extended-diagnostics.txt
          node scripts/check-tsc-budget.ts --from-file /tmp/tsc-extended-diagnostics.txt
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Enable unprivileged userns for Chromium sandbox (Ubuntu 24.04)
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run fast hermetic unit suites (quarantine & orphan enforced)
        run: bash scripts/run-fast-tests.sh --suites-only --quarantine tests/QUARANTINE.json
      - run: npm run worker:build
      - run: bash scripts/docker-smoke.sh
      - name: Run npm run test:boundaries
        env:
          KOVO_ALLOW_LOCAL_MODEL: "1"
        run: npm run test:boundaries
      - name: Run live Chromium E2E journeys
        timeout-minutes: 12
        run: KOVO_ALLOW_LOCAL_MODEL=1 node --test tests/e2e-ui-journeys.test.ts
