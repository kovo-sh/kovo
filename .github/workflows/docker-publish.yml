name: Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  pr-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reclaim runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare image names
        id: prep
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "worker_image=ghcr.io/${owner}/kovo-worker:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          echo "kovo_image=ghcr.io/${owner}/kovo:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kovo-worker (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.prep.outputs.worker_image }}
          cache-from: type=gha,scope=kovo-worker-amd64
          cache-to: type=gha,mode=max,scope=kovo-worker-amd64
          sbom: false
          provenance: false

      - name: Smoke-test kovo-worker (UID 10001 + bridge handshake)
        env:
          KOVO_WORKER_IMAGE: ${{ steps.prep.outputs.worker_image }}
        run: bash scripts/docker-smoke.sh

      - name: Build kovo (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            KOVO_WORKER_IMAGE=${{ steps.prep.outputs.worker_image }}
          tags: ${{ steps.prep.outputs.kovo_image }}
          cache-from: type=gha,scope=kovo-amd64
          cache-to: type=gha,mode=max,scope=kovo-amd64
          sbom: false
          provenance: false

      - name: Smoke-test kovo startup health check
        env:
          KOVO_IMAGE: ${{ steps.prep.outputs.kovo_image }}
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm -p 18000:8000 "$KOVO_IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          uid="$(docker exec "$cid" id -u)"
          test "$uid" != "0"
          docker exec "$cid" docker --version
          for i in $(seq 1 30); do
            if docker exec "$cid" node -e "fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "kovo /health OK"
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid" >&2 || true
          exit 1

  build-worker:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Reclaim runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare owner
        id: prep
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for kovo-worker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push kovo-worker (${{ matrix.platform }}) by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=kovo-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kovo-worker-${{ matrix.arch }}
          sbom: true
          provenance: mode=max

      - name: Export kovo-worker digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload kovo-worker digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-worker-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-kovo:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Reclaim runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare owner and worker image reference
        id: prep
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "worker_image=ghcr.io/${owner}/kovo-worker:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "worker_image=ghcr.io/${owner}/kovo-worker:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for kovo
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push kovo (${{ matrix.platform }}) by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            KOVO_WORKER_IMAGE=${{ steps.prep.outputs.worker_image }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=kovo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kovo-${{ matrix.arch }}
          sbom: true
          provenance: mode=max

      - name: Export kovo digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload kovo digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-kovo-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    if: github.event_name != 'pull_request'
    needs: [build-worker, build-kovo]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare owner
        id: prep
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"

      - name: Download kovo-worker digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-worker-*
          merge-multiple: true
          path: /tmp/digests-worker

      - name: Download kovo digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-kovo-*
          merge-multiple: true
          path: /tmp/digests-kovo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for kovo-worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Create and push kovo-worker multi-arch manifest
        id: merge-worker
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker"
          TAG_ARGS=()
          first_tag=""
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              TAG_ARGS+=(--tag "$tag")
              [[ -z "$first_tag" ]] && first_tag="$tag"
            fi
          done <<< "${{ steps.meta-worker.outputs.tags }}"
          test -n "$first_tag"
          SOURCES=()
          for f in /tmp/digests-worker/*; do
            SOURCES+=("${image}@sha256:$(basename "$f")")
          done
          test "${#SOURCES[@]}" -ge 2
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
          digest="sha256:$(docker buildx imagetools inspect --raw "$first_tag" | sha256sum | awk '{print $1}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$first_tag"

      - name: Attest kovo-worker provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker
          subject-digest: ${{ steps.merge-worker.outputs.digest }}
          push-to-registry: true

      - name: Extract metadata for kovo
        id: meta-kovo
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Create and push kovo multi-arch manifest
        id: merge-kovo
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo"
          TAG_ARGS=()
          first_tag=""
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              TAG_ARGS+=(--tag "$tag")
              [[ -z "$first_tag" ]] && first_tag="$tag"
            fi
          done <<< "${{ steps.meta-kovo.outputs.tags }}"
          test -n "$first_tag"
          SOURCES=()
          for f in /tmp/digests-kovo/*; do
            SOURCES+=("${image}@sha256:$(basename "$f")")
          done
          test "${#SOURCES[@]}" -ge 2
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
          digest="sha256:$(docker buildx imagetools inspect --raw "$first_tag" | sha256sum | awk '{print $1}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$first_tag"

      - name: Attest kovo provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo
          subject-digest: ${{ steps.merge-kovo.outputs.digest }}
          push-to-registry: true
