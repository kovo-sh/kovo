name: Publish Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: 'Semver release tag to publish (e.g. v0.8.0 or v0.8.0-rc.1)'
        required: true
        type: string
      ref:
        description: 'Git commit SHA to checkout and build'
        required: true
        type: string
      publish_latest:
        description: 'Whether to also tag and push :latest for non-prerelease tags'
        required: false
        default: true
        type: boolean
    outputs:
      worker_digest:
        description: 'Published multi-arch manifest digest for kovo-worker'
        value: ${{ jobs.merge-manifests.outputs.worker_digest }}
      kovo_digest:
        description: 'Published multi-arch manifest digest for kovo'
        value: ${{ jobs.merge-manifests.outputs.kovo_digest }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  pr-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reclaim runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare image names
        id: prep
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          worker_source_hash="$(git rev-parse --verify HEAD:worker)"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "worker_source_hash=${worker_source_hash}" >> "$GITHUB_OUTPUT"
          echo "worker_image=ghcr.io/${owner}/kovo-worker:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          echo "kovo_image=ghcr.io/${owner}/kovo:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kovo-worker (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            KOVO_WORKER_SOURCE_HASH=${{ steps.prep.outputs.worker_source_hash }}
          tags: ${{ steps.prep.outputs.worker_image }}
          cache-from: type=gha,scope=kovo-worker-amd64
          cache-to: type=gha,mode=max,scope=kovo-worker-amd64
          sbom: false
          provenance: false

      - name: Smoke-test kovo-worker (UID 10001 + bridge handshake)
        env:
          KOVO_WORKER_IMAGE: ${{ steps.prep.outputs.worker_image }}
        run: bash scripts/docker-smoke.sh

      - name: Build kovo (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            KOVO_WORKER_IMAGE=${{ steps.prep.outputs.worker_image }}
          tags: ${{ steps.prep.outputs.kovo_image }}
          cache-from: type=gha,scope=kovo-amd64
          cache-to: type=gha,mode=max,scope=kovo-amd64
          sbom: false
          provenance: false

      - name: Smoke-test kovo startup health check
        env:
          KOVO_IMAGE: ${{ steps.prep.outputs.kovo_image }}
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm -p 18000:8000 "$KOVO_IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          uid="$(docker exec "$cid" id -u)"
          test "$uid" != "0"
          docker exec "$cid" docker --version
          for i in $(seq 1 30); do
            if docker exec "$cid" node -e "fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "kovo /health OK"
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid" >&2 || true
          exit 1

  build-worker:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Reclaim runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}

      - name: Prepare owner, labels, and worker source hash
        id: prep
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          git_sha="$(git rev-parse HEAD)"
          short_sha="${git_sha:0:7}"
          worker_source_hash="$(git rev-parse --verify HEAD:worker)"
          is_release="false"
          release_tag="unused"
          minor_tag="unused"
          enable_minor="false"
          enable_latest="false"
          oci_version="sha-${short_sha}"

          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            if [[ ! "$INPUT_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Invalid release_tag: ${INPUT_RELEASE_TAG}" >&2
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            prerelease="${BASH_REMATCH[4]}"
            is_release="true"
            release_tag="$INPUT_RELEASE_TAG"
            oci_version="$INPUT_RELEASE_TAG"
            if [[ -z "$prerelease" ]]; then
              minor_tag="${major}.${minor}"
              enable_minor="true"
              if [[ "$INPUT_PUBLISH_LATEST" == "true" ]]; then
                enable_latest="true"
              fi
            fi
          fi

          {
            echo "owner=${owner}"
            echo "git_sha=${git_sha}"
            echo "oci_version=${oci_version}"
            echo "worker_source_hash=${worker_source_hash}"
            echo "is_release=${is_release}"
            echo "release_tag=${release_tag}"
            echo "minor_tag=${minor_tag}"
            echo "enable_minor=${enable_minor}"
            echo "enable_latest=${enable_latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for kovo-worker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker
          labels: |
            org.opencontainers.image.revision=${{ steps.prep.outputs.git_sha }}
            org.opencontainers.image.version=${{ steps.prep.outputs.oci_version }}
          tags: |
            type=raw,value=edge,enable=${{ steps.prep.outputs.is_release != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.prep.outputs.is_release != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.prep.outputs.release_tag }},enable=${{ steps.prep.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.prep.outputs.minor_tag }},enable=${{ steps.prep.outputs.enable_minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.prep.outputs.enable_latest == 'true' }}

      - name: Build and push kovo-worker (${{ matrix.platform }}) by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            KOVO_WORKER_SOURCE_HASH=${{ steps.prep.outputs.worker_source_hash }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=kovo-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kovo-worker-${{ matrix.arch }}
          sbom: true
          provenance: mode=max

      - name: Export kovo-worker digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload kovo-worker digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-worker-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-kovo:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Reclaim runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}

      - name: Prepare owner, labels, and worker image reference
        id: prep
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          git_sha="$(git rev-parse HEAD)"
          short_sha="${git_sha:0:7}"
          is_release="false"
          release_tag="unused"
          minor_tag="unused"
          enable_minor="false"
          enable_latest="false"
          oci_version="sha-${short_sha}"
          worker_image="ghcr.io/${owner}/kovo-worker:sha-${short_sha}"

          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            if [[ ! "$INPUT_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Invalid release_tag: ${INPUT_RELEASE_TAG}" >&2
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            prerelease="${BASH_REMATCH[4]}"
            is_release="true"
            release_tag="$INPUT_RELEASE_TAG"
            oci_version="$INPUT_RELEASE_TAG"
            worker_image="ghcr.io/${owner}/kovo-worker:${INPUT_RELEASE_TAG}"
            if [[ -z "$prerelease" ]]; then
              minor_tag="${major}.${minor}"
              enable_minor="true"
              if [[ "$INPUT_PUBLISH_LATEST" == "true" ]]; then
                enable_latest="true"
              fi
            fi
          fi

          {
            echo "owner=${owner}"
            echo "git_sha=${git_sha}"
            echo "oci_version=${oci_version}"
            echo "worker_image=${worker_image}"
            echo "is_release=${is_release}"
            echo "release_tag=${release_tag}"
            echo "minor_tag=${minor_tag}"
            echo "enable_minor=${enable_minor}"
            echo "enable_latest=${enable_latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for kovo
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo
          labels: |
            org.opencontainers.image.revision=${{ steps.prep.outputs.git_sha }}
            org.opencontainers.image.version=${{ steps.prep.outputs.oci_version }}
          tags: |
            type=raw,value=edge,enable=${{ steps.prep.outputs.is_release != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.prep.outputs.is_release != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.prep.outputs.release_tag }},enable=${{ steps.prep.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.prep.outputs.minor_tag }},enable=${{ steps.prep.outputs.enable_minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.prep.outputs.enable_latest == 'true' }}

      - name: Build and push kovo (${{ matrix.platform }}) by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            KOVO_WORKER_IMAGE=${{ steps.prep.outputs.worker_image }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=kovo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kovo-${{ matrix.arch }}
          sbom: true
          provenance: mode=max

      - name: Export kovo digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload kovo digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-kovo-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    if: github.event_name != 'pull_request'
    needs: [build-worker, build-kovo]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      worker_digest: ${{ steps.merge-worker.outputs.digest }}
      kovo_digest: ${{ steps.merge-kovo.outputs.digest }}
    steps:
      - name: Prepare owner and release tags
        id: prep
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          is_release="false"
          release_tag="unused"
          minor_tag="unused"
          enable_minor="false"
          enable_latest="false"

          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            if [[ ! "$INPUT_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Invalid release_tag: ${INPUT_RELEASE_TAG}" >&2
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            prerelease="${BASH_REMATCH[4]}"
            is_release="true"
            release_tag="$INPUT_RELEASE_TAG"
            if [[ -z "$prerelease" ]]; then
              minor_tag="${major}.${minor}"
              enable_minor="true"
              if [[ "$INPUT_PUBLISH_LATEST" == "true" ]]; then
                enable_latest="true"
              fi
            fi
          fi

          {
            echo "owner=${owner}"
            echo "is_release=${is_release}"
            echo "release_tag=${release_tag}"
            echo "minor_tag=${minor_tag}"
            echo "enable_minor=${enable_minor}"
            echo "enable_latest=${enable_latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Download kovo-worker digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-worker-*
          merge-multiple: true
          path: /tmp/digests-worker

      - name: Download kovo digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-kovo-*
          merge-multiple: true
          path: /tmp/digests-kovo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for kovo-worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker
          tags: |
            type=raw,value=edge,enable=${{ steps.prep.outputs.is_release != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.prep.outputs.is_release != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.prep.outputs.release_tag }},enable=${{ steps.prep.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.prep.outputs.minor_tag }},enable=${{ steps.prep.outputs.enable_minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.prep.outputs.enable_latest == 'true' }}

      - name: Create and push kovo-worker multi-arch manifest
        id: merge-worker
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker"
          TAG_ARGS=()
          first_tag=""
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              TAG_ARGS+=(--tag "$tag")
              [[ -z "$first_tag" ]] && first_tag="$tag"
            fi
          done <<< "${{ steps.meta-worker.outputs.tags }}"
          test -n "$first_tag"
          SOURCES=()
          for f in /tmp/digests-worker/*; do
            SOURCES+=("${image}@sha256:$(basename "$f")")
          done
          test "${#SOURCES[@]}" -ge 2
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
          digest="sha256:$(docker buildx imagetools inspect --raw "$first_tag" | sha256sum | awk '{print $1}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$first_tag"

      - name: Attest kovo-worker provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo-worker
          subject-digest: ${{ steps.merge-worker.outputs.digest }}
          push-to-registry: true

      - name: Extract metadata for kovo
        id: meta-kovo
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo
          tags: |
            type=raw,value=edge,enable=${{ steps.prep.outputs.is_release != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.prep.outputs.is_release != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.prep.outputs.release_tag }},enable=${{ steps.prep.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.prep.outputs.minor_tag }},enable=${{ steps.prep.outputs.enable_minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.prep.outputs.enable_latest == 'true' }}

      - name: Create and push kovo multi-arch manifest
        id: merge-kovo
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo"
          TAG_ARGS=()
          first_tag=""
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              TAG_ARGS+=(--tag "$tag")
              [[ -z "$first_tag" ]] && first_tag="$tag"
            fi
          done <<< "${{ steps.meta-kovo.outputs.tags }}"
          test -n "$first_tag"
          SOURCES=()
          for f in /tmp/digests-kovo/*; do
            SOURCES+=("${image}@sha256:$(basename "$f")")
          done
          test "${#SOURCES[@]}" -ge 2
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
          digest="sha256:$(docker buildx imagetools inspect --raw "$first_tag" | sha256sum | awk '{print $1}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$first_tag"

      - name: Attest kovo provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/kovo
          subject-digest: ${{ steps.merge-kovo.outputs.digest }}
          push-to-registry: true
