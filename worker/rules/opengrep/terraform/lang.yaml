rules:
- id: ec2-imdsv1-optional
  languages:
  - hcl
  message: AWS EC2 Instance allowing use of the IMDSv1
  metadata:
    cwe:
    - 'CWE-918: Server-Side Request Forgery (SSRF)'
    references:
    - https://aws.amazon.com/blogs/security/defense-in-depth-open-firewalls-reverse-proxies-ssrf-vulnerabilities-ec2-instance-metadata-service
    - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/instance#metadata-options
    category: security
    technology:
    - terraform
    - aws
    owasp:
    - A10:2021 - Server-Side Request Forgery (SSRF)
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
  pattern-either:
  - patterns:
    - pattern: http_tokens = "optional"
    - pattern-inside: 'metadata_options { ... }

        '
  - patterns:
    - pattern: "resource \"aws_instance\" \"$NAME\" {\n  ...\n}\n"
    - pattern-not: "resource \"aws_instance\" \"$NAME\" {\n  ...\n  metadata_options\
        \ {\n    ...\n    http_tokens = \"required\"\n    ...\n  }\n  ...\n}\n"
    - pattern-not: "resource \"aws_instance\" \"$NAME\" {\n  ...\n  metadata_options\
        \ {\n    ...\n    http_tokens = \"optional\"\n    ...\n  }\n  ...\n}\n"
    - pattern-not: "resource \"aws_instance\" \"$NAME\" {\n  ...\n  metadata_options\
        \ {\n    ...\n    http_endpoint = \"disabled\"\n    ...\n  }\n  ...\n}\n"
  severity: ERROR
- id: ecr-image-scan-on-push
  patterns:
  - pattern: resource
  - pattern-not-inside: "resource \"aws_ecr_repository\" \"...\" {\n  ...\n  image_scanning_configuration\
      \ {\n    ...\n    scan_on_push=true\n    ...\n  }\n  ...\n}\n"
  - pattern-inside: "resource \"aws_ecr_repository\" \"...\" {\n  ...\n}\n"
  languages:
  - hcl
  message: The ECR Repository isn't configured to scan images on push
  severity: WARNING
  metadata:
    cwe:
    - 'CWE-1104: Use of Unmaintained Third Party Components'
    category: security
    technology:
    - terraform
    - aws
    owasp:
    - A06:2021 - Vulnerable and Outdated Components
    references:
    - https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
- id: eks-insufficient-control-plane-logging
  patterns:
  - pattern: 'name = ...

      '
  - pattern-inside: "resource \"aws_eks_cluster\" \"...\" {\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_eks_cluster\" \"...\" {\n  ...\n  enabled_cluster_log_types\
      \ = [..., \"api\", ..., \"audit\", ...]\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_eks_cluster\" \"...\" {\n  ...\n  enabled_cluster_log_types\
      \ = [..., \"audit\", ..., \"api\", ...]\n  ...\n}\n"
  languages:
  - hcl
  message: Missing EKS control plane logging. It is recommended to enable at least
    Kubernetes API server component logs ("api") and audit logs ("audit") of the EKS
    control plane through the enabled_cluster_log_types attribute.
  severity: WARNING
  metadata:
    references:
    - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/eks_cluster#enabling-control-plane-logging
    - https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
    category: security
    cwe:
    - 'CWE-778: Insufficient Logging'
    technology:
    - terraform
    - aws
    owasp:
    - A10:2017 - Insufficient Logging & Monitoring
    - A09:2021 - Security Logging and Monitoring Failures
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
    license: Commons Clause License Condition v1.0[LGPL-2.1-only]
- id: eks-public-endpoint-enabled
  patterns:
  - pattern: 'resource

      '
  - pattern-inside: 'resource "aws_eks_cluster" "..." {...}

      '
  - pattern-not-inside: "resource \"aws_eks_cluster\" \"...\"{\n  ...\n  vpc_config{\n\
      \    ...\n    endpoint_public_access = false\n    ...\n  }\n  ...\n}\n"
  languages:
  - hcl
  message: The vpc_config resource inside the eks cluster has not explicitly disabled
    public endpoint access
  severity: WARNING
  metadata:
    category: security
    cwe:
    - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
    technology:
    - terraform
    - aws
    owasp:
    - A01:2021 - Broken Access Control
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
