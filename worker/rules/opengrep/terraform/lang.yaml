  message: Ensure IAM policies don't allow resource exposure. These actions can expose
    AWS resources to the public. For example `ecr:SetRepositoryPolicy` could let an
    attacker retrieve container images. Instead, use another action that doesn't expose
    AWS resources.
  metadata:
    references:
    - https://cloudsplaining.readthedocs.io/en/latest/glossary/resource-exposure/
    - https://github.com/bridgecrewio/checkov/blob/ca830e14745c2c8e1b941985f305abe985d7f1f9/checkov/terraform/checks/data/aws/IAMPermissionsManagement.py
    category: security
    cwe:
    - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
    license: Commons Clause License Condition v1.0[LGPL-2.1-only]
    technology:
    - terraform
    - aws
    owasp:
    - A01:2021 - Broken Access Control
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
  languages:
  - hcl
  severity: WARNING
- id: no-iam-star-actions
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: "resource $TYPE \"...\" {\n  ...\n  policy = jsonencode({\n\
          \    ...\n    Statement = [\n      ...\n    ]\n    ...\n  })\n  ...\n}\n"
      - pattern-not-inside: "resource $TYPE \"...\" {\n  ...\n  policy = jsonencode({\n\
          \    ...\n    Statement = [\n      ...,\n      {... Effect = \"Deny\" ...},\n\
          \      ...\n    ]\n    ...\n  })\n  ...\n}\n"
      - pattern-either:
        - pattern: Action = "*"
        - pattern: Action = ["*"]
      - metavariable-pattern:
          metavariable: $TYPE
          pattern-either:
          - pattern: '"aws_iam_role_policy"

              '
          - pattern: '"aws_iam_policy"

              '
          - pattern: '"aws_iam_user_policy"

              '
          - pattern: '"aws_iam_group_policy"

              '
    - patterns:
      - pattern-inside: "data aws_iam_policy_document \"...\" {\n  ...\n  statement\
          \ {\n    ...\n  }\n  ...\n}\n"
      - pattern-not-inside: "data aws_iam_policy_document \"...\" {\n  ...\n  statement\
          \ {\n    ...\n    effect = \"Deny\"\n    ...\n  }\n  ...\n}\n"
      - pattern: 'actions = ["*"]

          '
  message: Ensure that no IAM policies allow "*" as a statement's actions. This allows
    all actions to be performed on the specified resources, and is a violation of
    the principle of least privilege. Instead, specify the actions that a certain
    user or policy is allowed to take.
  metadata:
    references:
    - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/iam_policy
    - https://github.com/bridgecrewio/checkov/blob/ca830e14745c2c8e1b941985f305abe985d7f1f9/checkov/terraform/checks/data/aws/StarActionPolicyDocument.py
    category: security
    cwe:
    - 'CWE-269: Improper Privilege Management'
    license: Commons Clause License Condition v1.0[LGPL-2.1-only]
    technology:
    - terraform
    - aws
    owasp:
    - A04:2021 - Insecure Design
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
  languages:
  - hcl
  severity: WARNING
- id: rds-insecure-password-storage-in-source-code
  pattern-either:
  - patterns:
    - pattern: password = "..."
    - pattern-inside: "resource \"aws_db_instance\" \"...\" {\n  ...\n}\n"
  - patterns:
    - pattern: master_password = "..."
    - pattern-inside: "resource \"aws_rds_cluster\" \"...\" {\n  ...\n}\n"
  languages:
  - hcl
  severity: WARNING
  message: RDS instance or cluster with hardcoded credentials in source code. It is
    recommended to pass the credentials at runtime, or generate random credentials
    using the random_password resource.
  metadata:
    references:
