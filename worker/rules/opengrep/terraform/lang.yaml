    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
- id: elastic-search-encryption-at-rest
  patterns:
  - pattern: 'resource

      '
  - pattern-not-inside: "resource \"aws_elasticsearch_domain\" \"...\"{\n  ...\n \
      \ encrypt_at_rest{\n    ...\n    enabled = true\n    ...\n  }\n  ...\n}\n"
  - pattern-inside: 'resource "aws_elasticsearch_domain" "..." {...}

      '
  languages:
  - hcl
  message: Encryption at rest is not enabled for the elastic search domain resource
  severity: WARNING
  metadata:
    category: security
    cwe:
    - 'CWE-311: Missing Encryption of Sensitive Data'
    technology:
    - terraform
    - aws
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A04:2021 - Insecure Design
    references:
    - https://owasp.org/Top10/A04_2021-Insecure_Design
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
- id: no-iam-admin-privileges
  pattern-either:
  - patterns:
    - pattern-inside: "resource $TYPE \"...\" {\n  ...\n  policy = jsonencode({\n\
        \    ...\n    Statement = [\n      ...\n    ]\n    ...\n  })\n  ...\n}\n"
    - pattern-not-inside: "resource $TYPE \"...\" {\n  ...\n  policy = jsonencode({\n\
        \    ...\n    Statement = [\n      ...,\n      {... Effect = \"Deny\" ...},\n\
        \      ...\n    ]\n    ...\n  })\n  ...\n}\n"
    - patterns:
      - pattern: '{..., Action = "*", ...}

          '
      - pattern: '{..., Resource = "*", ...}

          '
    - metavariable-pattern:
        metavariable: $TYPE
        pattern-either:
        - pattern: '"aws_iam_role_policy"

            '
        - pattern: '"aws_iam_policy"

            '
        - pattern: '"aws_iam_user_policy"

            '
        - pattern: '"aws_iam_group_policy"

            '
  - patterns:
    - pattern-inside: "data aws_iam_policy_document \"...\" {\n  ...\n  statement\
        \ {\n    ...\n  }\n  ...\n}\n"
    - pattern-not-inside: "data aws_iam_policy_document \"...\" {\n  ...\n  statement\
        \ {\n    ...\n    effect = \"Deny\"\n    ...\n  }\n  ...\n}\n"
    - patterns:
      - pattern: '{..., resources = ["*"], ...}

          '
      - pattern: '{..., actions = ["*"], ...}

          '
  message: IAM policies that allow full "*-*" admin privileges violates the principle
    of least privilege. This allows an attacker to take full control over all AWS
    account resources. Instead, give each user more fine-grained control with only
    the privileges they need. $TYPE
  metadata:
    references:
    - https://github.com/bridgecrewio/checkov/blob/master/checkov/terraform/checks/data/aws/AdminPolicyDocument.py
    category: security
    cwe:
    - 'CWE-269: Improper Privilege Management'
    license: Commons Clause License Condition v1.0[LGPL-2.1-only]
    technology:
    - terraform
    - aws
    owasp:
    - A04:2021 - Insecure Design
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
  languages:
  - hcl
  severity: WARNING
