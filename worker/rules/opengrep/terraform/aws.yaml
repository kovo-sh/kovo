rules:
- id: aws-athena-client-can-disable-workgroup-encryption
  patterns:
  - pattern: "resource \"aws_athena_workgroup\" $ANYTHING {\n  ...\n  configuration\
      \ {\n    ...\n    enforce_workgroup_configuration = false\n    ...\n    result_configuration\
      \ {\n      ...\n      encryption_configuration {\n        ...\n      }\n   \
      \   ...\n    }\n    ...\n  }\n  ...\n}\n"
  message: The Athena workgroup configuration can be overriden by client-side settings.
    The client can make changes to disable encryption settings. Enforce the configuration
    to prevent client overrides.
  languages:
  - hcl
  severity: WARNING
  metadata:
    category: security
    technology:
    - terraform
    - aws
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A04:2021 - Insecure Design
    cwe:
    - 'CWE-311: Missing Encryption of Sensitive Data'
    references:
    - https://owasp.org/Top10/A04_2021-Insecure_Design
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
- id: aws-athena-database-unencrypted
  patterns:
  - pattern: "resource \"aws_athena_database\" $ANYTHING {\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_athena_database\" $ANYTHING {\n  ...\n  encryption_configuration\
      \ {\n    ...\n  }\n  ...\n}\n"
  message: The Athena database is unencrypted at rest. These databases are generally
    derived from data in S3 buckets and should have the same level of at rest protection.
    The AWS KMS encryption key protects database contents. To create your own, create
    a aws_kms_key resource or use the ARN string of a key in your account.
  languages:
  - hcl
  severity: WARNING
  metadata:
    category: security
    technology:
    - terraform
    - aws
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A04:2021 - Insecure Design
    cwe:
    - 'CWE-311: Missing Encryption of Sensitive Data'
    references:
    - https://owasp.org/Top10/A04_2021-Insecure_Design
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
- id: aws-athena-workgroup-unencrypted
  patterns:
  - pattern: "resource \"aws_athena_workgroup\" $ANYTHING {\n  ...\n  configuration\
      \ {\n    ...\n    result_configuration {\n      ...\n    }\n    ...\n  }\n \
      \ ...\n}\n"
  - pattern-not-inside: "resource \"aws_athena_workgroup\" $ANYTHING {\n  ...\n  configuration\
      \ {\n    ...\n    result_configuration {\n      ...\n      encryption_configuration\
      \ {\n        ...\n      }\n      ...\n    }\n    ...\n  }\n  ...\n}\n"
  message: The AWS Athena Work Group is unencrypted. The AWS KMS encryption key protects
    backups in the work group. To create your own, create a aws_kms_key resource or
    use the ARN string of a key in your account.
  languages:
  - hcl
  severity: WARNING
  metadata:
    category: security
    technology:
    - terraform
    - aws
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A04:2021 - Insecure Design
    cwe:
    - 'CWE-311: Missing Encryption of Sensitive Data'
    references:
    - https://owasp.org/Top10/A04_2021-Insecure_Design
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
- id: aws-backup-vault-unencrypted
  patterns:
  - pattern-not-inside: "resource \"aws_backup_vault\" $BACKUP {\n  ...\n  kms_key_arn\
      \ = ...\n  ...\n}\n"
  - pattern: resource "aws_backup_vault" $BACKUP {...}
  message: The AWS Backup vault is unencrypted. The AWS KMS encryption key protects
    backups in the Backup vault. To create your own, create a aws_kms_key resource
    or use the ARN string of a key in your account.
  languages:
  - hcl
  severity: WARNING
  metadata:
    owasp:
    - A03:2017 - Sensitive Data Exposure
    cwe:
    - 'CWE-320: CWE CATEGORY: Key Management Errors'
    technology:
    - aws
    - terraform
    category: security
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
- id: aws-insecure-cloudfront-distribution-tls-version
  patterns:
  - pattern: "resource \"aws_cloudfront_distribution\" $ANYTHING {\n  ...\n  viewer_certificate\
      \ {\n    ...\n  }\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_cloudfront_distribution\" $ANYTHING {\n  ...\n\
      \  viewer_certificate {\n    ...\n    minimum_protocol_version = \"TLSv1.2_2018\"\
      \n    ...\n  }\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_cloudfront_distribution\" $ANYTHING {\n  ...\n\
      \  viewer_certificate {\n    ...\n    minimum_protocol_version = \"TLSv1.2_2019\"\
      \n    ...\n  }\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_cloudfront_distribution\" $ANYTHING {\n  ...\n\
      \  viewer_certificate {\n    ...\n    minimum_protocol_version = \"TLSv1.2_2021\"\
      \n    ...\n  }\n  ...\n}\n"
  message: Detected an AWS CloudFront Distribution with an insecure TLS version. TLS
    versions less than 1.2 are considered insecure because they can be broken. To
    fix this, set your `minimum_protocol_version` to `"TLSv1.2_2018", "TLSv1.2_2019"
    or "TLSv1.2_2021"`.
  metadata:
    category: security
    technology:
    - terraform
    - aws
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
  languages:
  - hcl
  severity: WARNING
- id: aws-cloudtrail-encrypted-with-cmk
  patterns:
  - pattern: "resource \"aws_cloudtrail\" $ANYTHING {\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_cloudtrail\" $ANYTHING {\n  ...\n  kms_key_id\
      \ = ...\n  ...\n}\n"
  message: Ensure CloudTrail logs are encrypted at rest using KMS CMKs. CMKs gives
