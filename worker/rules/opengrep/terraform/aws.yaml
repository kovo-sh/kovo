  - pattern-not-inside: "resource \"aws_codebuild_project\" $ANYTHING {\n  ...\n \
      \ artifacts {\n    type = \"NO_ARTIFACTS\"\n    encryption_disabled = true\n\
      \  }\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_codebuild_project\" $ANYTHING {\n  ...\n \
