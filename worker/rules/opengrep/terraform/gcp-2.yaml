rules:
- id: gcp-storage-bucket-uniform-access
  patterns:
  - pattern: resource
  - pattern-inside: 'resource "google_storage_bucket" "..." {

      ...

      }

      '
  - pattern-not-inside: 'resource "google_storage_bucket" "..." {

      ...

      uniform_bucket_level_access = true

      ...

      }

      '
  message: Ensure that Cloud Storage buckets have uniform bucket-level access enabled
  metadata:
    owasp:
    - A05:2017 - Broken Access Control
    - A01:2021 - Broken Access Control
    cwe:
    - 'CWE-284: Improper Access Control'
    category: security
    technology:
    - terraform
    - gcp
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
  languages:
  - hcl
  severity: WARNING
- id: gcp-sub-network-logging-enabled
