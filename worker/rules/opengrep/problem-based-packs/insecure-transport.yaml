        '
  - patterns:
    - pattern: 'URI.create($URI)

        '
    - pattern-inside: 'String $URI = "=~/[hH][tT][tT][pP]://.*/";

        ...

        HttpClient $CLIENT = ...;

        ...

        HttpRequest $REQ = ...;

        ...

        $CLIENT.send(...);

        '
  - patterns:
    - pattern: 'URI.create($URI)

        '
    - pattern-inside: 'String $URI = "=~/[hH][tT][tT][pP]://.*/";

        ...

        HttpClient $CLIENT = ...;

        ...

        HttpRequest $REQ = ...;

        ...

        $CLIENT.sendAsync(...);

        '
