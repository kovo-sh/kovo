        \  ...\n  $CONTEXT = {$NAME: <... $VAR ...>};\n  ...\n  $OPTS = {sandbox:\
        \ <... $CONTEXT ...>};\n  ...\n  new VM($OPTS,...);\n  ...\n}\n"
    - pattern: "function (...,$INPUT,...) {\n  ...\n  new NodeVM({sandbox: <... $INPUT\
        \ ...>},...);\n  ...\n}\n"
    - pattern: "function (...,$INPUT,...) {\n  ...\n  $CONTEXT = <... $INPUT ...>;\n\
