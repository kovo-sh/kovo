rules:
- id: jquery-insecure-method
  message: User controlled data in a jQuery's `.$METHOD(...)` is an anti-pattern that
    can lead to XSS vulnerabilities
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    references:
    - https://owasp.org/www-community/attacks/xss/
    - https://bugs.jquery.com/ticket/9521
    category: security
    technology:
    - jquery
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
  languages:
  - javascript
  - typescript
  severity: WARNING
  options:
    symbolic_propagation: true
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: $.$METHOD($VAR,...)
      - pattern: $(...).$METHOD($VAR,...)
      - pattern: jQuery.$METHOD($VAR,...)
      - pattern: jQuery(...).$METHOD($VAR,...)
    - pattern-not: $.$METHOD("...",...)
    - pattern-not: $(...).$METHOD("...",...)
    - pattern-not: jQuery.$METHOD("...",...)
    - pattern-not: jQuery(...).$METHOD("...",...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(html|append|prepend|wrap|wrapInner|wrapAll|before|after|globalEval|getScript)$
  - patterns:
    - pattern-either:
      - pattern: $(...).$METHOD($VAR,...)
      - pattern: jQuery(...).$METHOD($VAR,...)
    - pattern-not: $("...",...).$METHOD(...)
    - pattern-not: jQuery("...",...).$METHOD(...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(appendTo|insertAfter|insertBefore|prependTo)$
- id: jquery-insecure-selector
  message: User controlled data in a `$(...)` is an anti-pattern that can lead to
    XSS vulnerabilities
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    references:
    - https://owasp.org/www-community/attacks/xss/
    - https://bugs.jquery.com/ticket/9521
    category: security
    technology:
    - jquery
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
  languages:
  - javascript
  - typescript
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: '$(<... window ...>)

        '
    - pattern: '$(<... location ...>)

        '
    - patterns:
      - pattern: '$X = <... window ...>;

          ...

          $(<... $X ...>);

          '
      - focus-metavariable: $X
    - patterns:
      - pattern: '$X = <... location ...>;

          ...

          $(<... $X ...>);

          '
      - focus-metavariable: $X
    - patterns:
      - pattern-either:
        - pattern-inside: "function $FUNC(..., $Y, ...) {\n  ...\n}\n"
        - pattern-inside: "function (..., $Y, ...) {\n  ...\n}\n"
        - pattern-inside: "function $FUNC(...,$Z,...) {\n  ...\n  $Y = <... $Z ...>;\n\
            \  ...\n}\n"
        - pattern-inside: "function (...,$Z,...) {\n  ...\n  $Y = <... $Z ...>;\n\
            \  ...\n}\n"
      - pattern-either:
        - pattern: '$(<... $Y ...>)

            '
        - pattern: '$("..." + (<... $Y ...>))

            '
        - pattern: '$((<... $Y ...>) + "...")

            '
      - pattern-not-inside: "$JQUERY.each(function($INDEX, $Y) {\n  ...\n})\n"
      - focus-metavariable: $Y
  - pattern-not: '$(window)

      '
  - pattern-not: '$(document)

      '
  - pattern-not: '$(this)

      '
- id: prohibit-jquery-html
  message: JQuery's `html` function is susceptible to Cross Site Scripting (XSS) attacks.
    If you're just passing text, consider `text` instead. Otherwise, use a function
    that escapes HTML such as edX's `HtmlUtils.setHtml()`.
  metadata:
    shortDesription: Use of JQuery's unsafe html() function.
    help: '## Remediation

      Avoid using JQuery''s html() function. If the string is plain text, use the
      text() function instead.

      Otherwise, use a function that escapes html such as edx''s HtmlUtils.setHtml().

      '
    tags:
    - security
    precision: high
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    references:
    - https://edx.readthedocs.io/projects/edx-developer-guide/en/latest/preventing_xss/preventing_xss.html#javascript-concat-html
    - https://stackoverflow.com/questions/8318581/html-vs-innerhtml-jquery-javascript-xss-attacks
    - https://api.jquery.com/text/#text-text
    category: security
    technology:
    - jquery
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
  languages:
  - javascript
  - typescript
  severity: WARNING
  patterns:
  - pattern: '$X.html(...)

      '
  - pattern-not: '$X.html("...",...)

      '
