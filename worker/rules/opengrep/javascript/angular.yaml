    category: security
    technology:
    - angular
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
  languages:
  - javascript
  - typescript
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: '$SOURCE = $scope.$INPUT;

        $sce.trustAsCss($SOURCE);

        '
    - pattern: '$sce.trustAsCss($scope.$INPUT);

        '
  - pattern-inside: 'app.controller(..., function($scope,$sce){

      ...

      });

      '
