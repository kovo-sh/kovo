- id: react-insecure-request
  message: Unencrypted request over HTTP detected.
  metadata:
    vulnerability: Insecure Transport
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    references:
    - https://www.npmjs.com/package/axios
    category: security
    technology:
    - react
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
  languages:
  - typescript
  - javascript
  severity: ERROR
  patterns:
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern-inside: 'import $AXIOS from ''axios'';

            ...

            $AXIOS.$METHOD(...)

            '
        - pattern-inside: '$AXIOS = require(''axios'');

            ...

            $AXIOS.$METHOD(...)

            '
      - pattern: $AXIOS.$VERB("$URL",...)
      - metavariable-regex:
          metavariable: $VERB
          regex: ^(get|post|delete|head|patch|put|options)
    - patterns:
      - pattern-either:
        - pattern-inside: 'import $AXIOS from ''axios'';

            ...

            $AXIOS(...)

            '
        - pattern-inside: '$AXIOS = require(''axios'');

            ...

            $AXIOS(...)

            '
      - pattern-either:
        - pattern: '$AXIOS({url: "$URL"}, ...)'
        - pattern: '$OPTS = {url: "$URL"}

            ...

            $AXIOS($OPTS, ...)

            '
    - pattern: fetch("$URL", ...)
  - metavariable-regex:
      metavariable: $URL
      regex: ^([Hh][Tt][Tt][Pp]:\/\/(?!localhost).*)
- id: react-markdown-insecure-html
  message: Overwriting `transformLinkUri` or `transformImageUri` to something insecure,
    or turning `allowDangerousHtml` on, or turning `escapeHtml` off, will open the
    code up to XSS vectors.
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    references:
    - https://www.npmjs.com/package/react-markdown#security
    category: security
    technology:
    - react
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
  languages:
  - typescript
  - javascript
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern-inside: '$X = require(''react-markdown/with-html'');

        ...

        '
    - pattern-inside: '$X = require(''react-markdown'');

        ...

        '
    - pattern-inside: 'import ''react-markdown/with-html'';

        ...

        '
    - pattern-inside: 'import ''react-markdown'';

        ...

        '
  - pattern-either:
    - pattern: '<$EL allowDangerousHtml />

        '
    - pattern: '<$EL escapeHtml={false} />

        '
    - pattern: '<$EL transformLinkUri=... />

        '
    - pattern: '<$EL transformImageUri=... />

        '
