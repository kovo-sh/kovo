rules:
- id: flask-cache-query-string
  patterns:
  - pattern-either:
    - pattern: "@app.route(\"...\")\n@cache.cached(...)\ndef $HANDLER(...):\n  ...\n\
        \  request.args.get(...)\n"
    - pattern: "@app.route(\"...\", methods=[..., \"POST\", ...])\n@cache.cached(...)\n\
        def $HANDLER(...):\n  ...\n"
    - pattern: "@app.route(\"...\", methods=[..., \"PUT\", ...])\n@cache.cached(...)\n\
        def $HANDLER(...):\n  ...\n"
    - pattern: "@app.route(\"...\", methods=[..., \"DELETE\", ...])\n@cache.cached(...)\n\
        def $HANDLER(...):\n  ...\n"
    - pattern: "@app.route(\"...\", methods=[..., \"PATCH\", ...])\n@cache.cached(...)\n\
        def $HANDLER(...):\n  ...\n"
  - pattern-not: "@app.route(\"...\")\n@cache.cached(..., query_string=True)\ndef\
      \ $HANDLER(...):\n  ...\n  request.args.get(...)\n"
  message: Flask-caching doesn't cache query strings by default. You have to use `query_string=True`.
    Also you shouldn't cache verbs that can mutate state.
  severity: WARNING
  languages:
  - python
  metadata:
    category: caching
    technology:
    - flask
- id: avoid_app_run_with_bad_host
  message: Running flask app with host 0.0.0.0 could expose the server publicly.
  metadata:
    cwe:
    - 'CWE-668: Exposure of Resource to Wrong Sphere'
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - flask
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
  languages:
  - python
  severity: WARNING
  pattern-either:
  - pattern: app.run(..., host="0.0.0.0", ...)
  - pattern: app.run(..., "0.0.0.0", ...)
- id: avoid_using_app_run_directly
  patterns:
  - pattern-not-inside: "if __name__ == '__main__':\n  ...\n"
  - pattern-not-inside: "def $X(...):\n  ...\n"
  - pattern: app.run(...)
  message: top-level app.run(...) is ignored by flask. Consider putting app.run(...)
    behind a guard, like inside a function
  metadata:
    cwe:
    - 'CWE-668: Exposure of Resource to Wrong Sphere'
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - flask
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
  languages:
  - python
  severity: WARNING
- id: debug-enabled
  patterns:
  - pattern-inside: 'import flask

      ...

      '
  - pattern: $APP.run(..., debug=True, ...)
  message: Detected Flask app with debug=True. Do not deploy to production with this
    flag enabled as it will leak sensitive information. Instead, consider using Flask
    configuration variables or setting 'debug' using system environment variables.
  metadata:
    cwe:
    - 'CWE-489: Active Debug Code'
    owasp: A06:2017 - Security Misconfiguration
    references:
    - https://labs.detectify.com/2015/10/02/how-patreon-got-hacked-publicly-exposed-werkzeug-debugger/
    category: security
    technology:
    - flask
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
  severity: WARNING
  languages:
  - python
- id: directly-returned-format-string
  message: Detected Flask route directly returning a formatted string. This is subject
    to cross-site scripting if user input can reach the string. Consider using the
    template engine instead and rendering pages with 'render_template()'.
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    category: security
    technology:
    - flask
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: MEDIUM
  languages:
  - python
  severity: WARNING
  mode: taint
  pattern-sources:
  - pattern-either:
    - patterns:
      - pattern-inside: "@$APP.route(...)\ndef $FUNC(..., $PARAM, ...):\n  ...\n"
      - pattern: $PARAM
    - pattern: 'request.$FUNC.get(...)

        '
    - pattern: 'request.$FUNC(...)

        '
    - pattern: request.$FUNC[...]
  pattern-sinks:
  - patterns:
    - pattern-not-inside: return "..."
    - pattern-either:
      - pattern: return "...".format(...)
      - pattern: return "..." % ...
      - pattern: return "..." + ...
      - pattern: return ... + "..."
      - pattern: return f"...{...}..."
      - patterns:
        - pattern: return $X
        - pattern-either:
          - pattern-inside: '$X = "...".format(...)

              ...

              '
          - pattern-inside: '$X = "..." % ...

              ...

              '
          - pattern-inside: '$X = "..." + ...

              ...

              '
          - pattern-inside: '$X = ... + "..."

              ...

              '
          - pattern-inside: '$X = f"...{...}..."

              ...

              '
        - pattern-not-inside: '$X = "..."

            ...

            '
- id: flask-cors-misconfiguration
  message: Setting 'support_credentials=True' together with 'origin="*"' is a CORS
    misconfiguration that can allow third party origins to read sensitive data. Using
    this configuration, flask_cors will dynamically reflects the Origin of each request
    in the Access-Control-Allow-Origin header, allowing all origins and allowing cookies
    and credentials to be sent along with request. It is recommended to specify allowed
    origins instead of using "*" when setting 'support_credentials=True'.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: '@cross_origin(..., origins="*", supports_credentials=True, ...)

        '
    - pattern: 'CORS(..., supports_credentials=True, origins="*", ...)

        '
    - pattern: 'CORS(..., resources={"...": {...,"origins": "*",

        "supports_credentials": True,...}})

        '
  metadata:
    category: security
    subcategory:
    - audit
    cwe:
    - 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    confidence: LOW
    likelihood: LOW
    impact: HIGH
    technology:
    - flask
    references:
    - https://pypi.org/project/Flask-Cors/
    - https://flask-cors.readthedocs.io/en/latest/index.html
- id: avoid_hardcoded_config_TESTING
  message: Hardcoded variable `TESTING` detected. Use environment variables or config
    files instead
  severity: WARNING
  metadata:
    likelihood: LOW
    impact: LOW
    confidence: LOW
    category: security
    cwe:
    - 'CWE-489: Active Debug Code'
    owasp:
    - A05:2021 - Security Misconfiguration
    references:
    - https://bento.dev/checks/flask/avoid-hardcoded-config/
    - https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#builtin-configuration-values
    - https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#environment-and-debug-features
    subcategory:
    - audit
    technology:
    - flask
  languages:
  - python
  pattern-either:
  - pattern: $M.config['TESTING'] = True
  - pattern: $M.config['TESTING'] = False
  - pattern: $M.update(TESTING=True, ...)
  - pattern: $M.update(TESTING=False, ...)
- id: avoid_hardcoded_config_SECRET_KEY
  message: Hardcoded variable `SECRET_KEY` detected. Use environment variables or
    config files instead
  severity: ERROR
  metadata:
    likelihood: LOW
    impact: LOW
    confidence: LOW
    category: security
    cwe:
    - 'CWE-489: Active Debug Code'
    owasp:
    - A05:2021 - Security Misconfiguration
    references:
    - https://bento.dev/checks/flask/avoid-hardcoded-config/
    - https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#builtin-configuration-values
    - https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#environment-and-debug-features
    subcategory:
    - audit
    technology:
    - flask
  languages:
  - python
  pattern-either:
  - pattern: $M.update(SECRET_KEY="=~/.*/")
  - pattern: $M.config['SECRET_KEY'] = "=~/.*/"
- id: avoid_hardcoded_config_ENV
  message: Hardcoded variable `ENV` detected. Set this by using FLASK_ENV environment
    variable
  severity: WARNING
  metadata:
    likelihood: LOW
    impact: LOW
    confidence: LOW
    category: security
    cwe:
    - 'CWE-489: Active Debug Code'
    owasp:
    - A05:2021 - Security Misconfiguration
    references:
    - https://bento.dev/checks/flask/avoid-hardcoded-config/
    - https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#builtin-configuration-values
    - https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#environment-and-debug-features
    subcategory:
    - audit
    technology:
    - flask
  languages:
  - python
  pattern-either:
  - pattern: $M.update(ENV="=~/^development|production$/")
  - pattern: $M.config['ENV'] = "=~/^development|production$/"
- id: avoid_hardcoded_config_DEBUG
  message: Hardcoded variable `DEBUG` detected. Set this by using FLASK_DEBUG environment
    variable
  severity: WARNING
  metadata:
    likelihood: LOW
    impact: LOW
    confidence: LOW
    category: security
    cwe:
    - 'CWE-489: Active Debug Code'
    owasp:
    - A05:2021 - Security Misconfiguration
