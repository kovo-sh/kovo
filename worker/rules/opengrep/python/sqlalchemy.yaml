rules:
- id: avoid-sqlalchemy-text
  mode: taint
  pattern-sinks:
  - pattern: 'sqlalchemy.text(...)

      '
  pattern-sources:
  - patterns:
    - pattern: '$X + $Y

        '
    - metavariable-type:
        metavariable: $X
        type: string
  - patterns:
    - pattern: '$X + $Y

        '
    - metavariable-type:
        metavariable: $Y
        type: string
  - patterns:
    - pattern: 'f"..."

        '
  - patterns:
    - pattern: '$X.format(...)

        '
    - metavariable-type:
        metavariable: $X
        type: string
  - patterns:
    - pattern: '$X % $Y

        '
    - metavariable-type:
        metavariable: $X
        type: string
  message: sqlalchemy.text passes the constructed SQL statement to the database mostly
    unchanged. This means that the usual SQL injection protections are not applied
    and this function is vulnerable to SQL injection if user input can reach here.
    Use normal SQLAlchemy operators (such as or_, and_, etc.) to construct SQL.
  metadata:
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command
      (''SQL Injection'')'
    category: security
    technology:
    - sqlalchemy
    confidence: MEDIUM
    references:
    - https://docs.sqlalchemy.org/en/14/core/tutorial.html#using-textual-sql
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
  languages:
  - python
  severity: ERROR
- id: sqlalchemy-execute-raw-query
  message: 'Avoiding SQL string concatenation: untrusted input concatenated with raw
    SQL query can result in SQL Injection. In order to execute raw query safely, prepared
    statement should be used. SQLAlchemy provides TextualSQL to easily used prepared
    statement with named parameters. For complex SQL composition, use SQL Expression
    Language or Schema Definition Language. In most cases, SQLAlchemy ORM will be
    a better option.'
  metadata:
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command
      (''SQL Injection'')'
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    references:
    - https://docs.sqlalchemy.org/en/14/core/tutorial.html#using-textual-sql
    - https://www.tutorialspoint.com/sqlalchemy/sqlalchemy_quick_guide.htm
    - https://docs.sqlalchemy.org/en/14/core/tutorial.html#using-more-specific-text-with-table-expression-literal-column-and-expression-column
    category: security
    technology:
    - sqlalchemy
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    confidence: LOW
  severity: ERROR
  languages:
  - python
  pattern-either:
  - pattern: '$CONNECTION.execute( $SQL + ..., ... )

      '
  - pattern: '$CONNECTION.execute( $SQL % (...), ...)

      '
  - pattern: '$CONNECTION.execute( $SQL.format(...), ... )

      '
  - pattern: '$CONNECTION.execute(f"...{...}...", ...)

      '
  - patterns:
    - pattern-inside: '$QUERY = $SQL + ...

        ...

        '
    - pattern: '$CONNECTION.execute($QUERY, ...)

        '
  - patterns:
    - pattern-inside: '$QUERY = $SQL % (...)

        ...

        '
    - pattern: '$CONNECTION.execute($QUERY, ...)

        '
  - patterns:
    - pattern-inside: '$QUERY = $SQL.format(...)

        ...

        '
    - pattern: '$CONNECTION.execute($QUERY, ...)

        '
  - patterns:
    - pattern-inside: '$QUERY = f"...{...}..."

        ...

        '
    - pattern: '$CONNECTION.execute($QUERY, ...)

        '
- id: sqlalchemy-sql-injection
  patterns:
  - pattern-either:
    - pattern: "def $FUNC(...,$VAR,...):\n  ...\n  $SESSION.query(...).$SQLFUNC(\"\
        ...\".$FORMATFUNC(...,$VAR,...))\n"
    - pattern: "def $FUNC(...,$VAR,...):\n  ...\n  $SESSION.query.join(...).$SQLFUNC(\"\
        ...\".$FORMATFUNC(...,$VAR,...))\n"
    - pattern: "def $FUNC(...,$VAR,...):\n  ...\n  $SESSION.query.$SQLFUNC(\"...\"\
        .$FORMATFUNC(...,$VAR,...))\n"
    - pattern: "def $FUNC(...,$VAR,...):\n  ...\n  query.$SQLFUNC(\"...\".$FORMATFUNC(...,$VAR,...))\n"
  - metavariable-regex:
      metavariable: $SQLFUNC
      regex: (group_by|order_by|distinct|having|filter)
  - metavariable-regex:
      metavariable: $FORMATFUNC
      regex: (?!bindparams)
  message: Distinct, Having, Group_by, Order_by, and Filter in SQLAlchemy can cause
    sql injections if the developer inputs raw SQL into the before-mentioned clauses.
    This pattern captures relevant cases in which the developer inputs raw SQL into
    the distinct, having, group_by, order_by or filter clauses and injects user-input
    into the raw SQL with any function besides "bindparams". Use bindParams to securely
    bind user-input to SQL statements.
  fix-regex:
    regex: format
    replacement: bindparams
  languages:
  - python
  severity: WARNING
  metadata:
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command
      (''SQL Injection'')'
    category: security
    technology:
    - sqlalchemy
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
