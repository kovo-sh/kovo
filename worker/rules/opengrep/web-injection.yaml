rules:
  - id: guardian.js.sqli-template-query
    languages: [javascript, typescript]
    severity: ERROR
    message: "Potential SQL injection: interpolated template literal or string concatenation passed to database query."
    metadata:
      cwe: "CWE-89"
    pattern-either:
      - pattern: $DB.query(`...${$INPUT}...`, ...)
      - pattern: $DB.execute(`...${$INPUT}...`, ...)
      - pattern: $DB.raw(`...${$INPUT}...`, ...)
      - pattern: $DB.query($SQL + $INPUT, ...)
      - pattern: $DB.execute($SQL + $INPUT, ...)
      - pattern: $DB.prepare(`...${$INPUT}...`)

  - id: guardian.py.sqli-execute-format
    languages: [python]
    severity: ERROR
    message: "Potential SQL injection: formatted or concatenated SQL query passed to execute()."
    metadata:
      cwe: "CWE-89"
    pattern-either:
      - pattern: $CURSOR.execute(f"...{$X}...")
      - pattern: $CURSOR.execute($Q.format(...))
      - pattern: $CURSOR.execute($Q % $X)
      - pattern: $CURSOR.execute($Q + $X)

  - id: guardian.go.sqli-sprintf
    languages: [go]
    severity: ERROR
    message: "Potential SQL injection: fmt.Sprintf query string passed to database query."
    metadata:
      cwe: "CWE-89"
    pattern-either:
      - pattern: $DB.Query(fmt.Sprintf($FMT, ...), ...)
      - pattern: $DB.QueryRow(fmt.Sprintf($FMT, ...), ...)
      - pattern: $DB.Exec(fmt.Sprintf($FMT, ...), ...)

  - id: guardian.js.cmd-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: "Potential OS command injection via shell execution with dynamic input."
    metadata:
      cwe: "CWE-78"
    pattern-either:
      - pattern: exec(`...${$X}...`, ...)
      - pattern: execSync(`...${$X}...`, ...)
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)
      - pattern: exec($CMD + $X, ...)
      - pattern: execSync($CMD + $X, ...)

  - id: guardian.py.cmd-injection
    languages: [python]
    severity: ERROR
    message: "Potential OS command injection via os.system or subprocess with shell=True."
    metadata:
      cwe: "CWE-78"
    pattern-either:
      - pattern: os.system($CMD)
      - pattern: os.popen($CMD)
      - pattern: subprocess.run($CMD, ..., shell=True, ...)
      - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
      - pattern: subprocess.call($CMD, ..., shell=True, ...)
      - pattern: subprocess.check_output($CMD, ..., shell=True, ...)

  - id: guardian.js.code-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: "Dynamic code execution via eval() or new Function()."
    metadata:
      cwe: "CWE-95"
    pattern-either:
      - pattern: eval($X)
      - pattern: new Function(..., $X)

  - id: guardian.js.nosqli-where
    languages: [javascript, typescript]
    severity: ERROR
    message: "Potential NoSQL injection via $where operator or unvalidated request body in query filter."
    metadata:
      cwe: "CWE-943"
    pattern-either:
      - pattern: |
          { $where: $X }
      - pattern: $MODEL.find(req.body)
      - pattern: $MODEL.findOne(req.body)
      - pattern: $MODEL.find(req.query)
      - pattern: $MODEL.findOne(req.query)

  - id: guardian.py.ssti-render-template-string
    languages: [python]
    severity: ERROR
    message: "Potential Server-Side Template Injection (SSTI) via render_template_string or jinja2.Template."
    metadata:
      cwe: "CWE-1336"
    pattern-either:
      - pattern: render_template_string($TPL, ...)
      - pattern: flask.render_template_string($TPL, ...)
      - pattern: jinja2.Template($TPL).render(...)
      - pattern: Template($TPL).render(...)

  - id: guardian.js.ssti-render-string
    languages: [javascript, typescript]
    severity: ERROR
    message: "Potential Server-Side Template Injection via dynamic template string rendering."
    metadata:
      cwe: "CWE-1336"
    pattern-either:
      - pattern: ejs.render($TPL, ...)
      - pattern: nunjucks.renderString($TPL, ...)
      - pattern: pug.render($TPL, ...)
      - pattern: Handlebars.compile($TPL)

  - id: guardian.js.path-traversal-fs
    languages: [javascript, typescript]
    severity: WARNING
    message: "Potential path traversal: user-controlled request value flows into filesystem read or response file send."
    metadata:
      cwe: "CWE-22"
    pattern-either:
      - pattern: fs.readFile(path.join($BASE, req.$SRC.$PARAM), ...)
      - pattern: fs.readFileSync(path.join($BASE, req.$SRC.$PARAM), ...)
      - pattern: readFile(path.join($BASE, req.$SRC.$PARAM), ...)
      - pattern: readFileSync(path.join($BASE, req.$SRC.$PARAM), ...)
      - pattern: res.sendFile(path.join($BASE, req.$SRC.$PARAM), ...)

  - id: guardian.py.unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: "Unsafe deserialization via pickle.loads or yaml.load without SafeLoader."
    metadata:
      cwe: "CWE-502"
    pattern-either:
      - pattern: pickle.loads($X)
      - pattern: pickle.load($X)
      - pattern: yaml.load($X)
      - pattern: yaml.unsafe_load($X)

  - id: guardian.js.dom-xss-sink
    languages: [javascript, typescript]
    severity: WARNING
    message: "Potential DOM XSS via innerHTML, outerHTML, or document.write."
    metadata:
      cwe: "CWE-79"
    pattern-either:
      - pattern: $EL.innerHTML = $VAL
      - pattern: $EL.outerHTML = $VAL
      - pattern: document.write($VAL)

  - id: guardian.react.dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: "Potential DOM XSS via React dangerouslySetInnerHTML sink."
    metadata:
      cwe: "CWE-79"
    pattern-regex: 'dangerouslySetInnerHTML\s*=\s*\{\{\s*__html\s*:'
