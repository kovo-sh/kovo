    stopBy: end
---
id: kovo-ast-ts-exec-template
language: TypeScript
severity: error
message: "Interpolated template literal passed to exec/execSync."
metadata:
  cwe: "CWE-78"
rule:
  any:
    - pattern: exec(`$$$`)
    - pattern: execSync(`$$$`)
    - pattern: $CP.exec(`$$$`)
    - pattern: $CP.execSync(`$$$`)
  has:
    kind: template_substitution
    stopBy: end
---
id: kovo-ast-ts-postmessage-wildcard
language: TypeScript
severity: warning
message: "window.postMessage called with wildcard '*' targetOrigin."
metadata:
  cwe: "CWE-345"
rule:
  pattern: $TARGET.postMessage($DATA, '*')
---
