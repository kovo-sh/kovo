id: kovo-ast-ts-innerhtml
language: TypeScript
severity: warning
message: "Direct assignment to innerHTML may introduce DOM XSS."
metadata:
  cwe: "CWE-79"
rule:
  pattern: $EL.innerHTML = $VAL
---
id: kovo-ast-js-innerhtml
language: JavaScript
severity: warning
message: "Direct assignment to innerHTML may introduce DOM XSS."
metadata:
  cwe: "CWE-79"
rule:
  pattern: $EL.innerHTML = $VAL
---
id: kovo-ast-tsx-dangerous-html
language: Tsx
severity: warning
message: "React dangerouslySetInnerHTML sink requires strict sanitization."
metadata:
  cwe: "CWE-79"
rule:
  kind: jsx_attribute
  regex: '^dangerouslySetInnerHTML\s*='
