id: kovo-ast-ts-sqli-query
language: TypeScript
severity: error
message: "Interpolated template literal passed to database query/execute."
metadata:
  cwe: "CWE-89"
rule:
  any:
    - pattern: $DB.query(`$$$`)
    - pattern: $DB.execute(`$$$`)
    - pattern: $DB.prepare(`$$$`)
  has:
    kind: template_substitution
    stopBy: end
---
id: kovo-ast-js-sqli-query
language: JavaScript
severity: error
message: "Interpolated template literal passed to database query/execute."
metadata:
  cwe: "CWE-89"
rule:
  any:
    - pattern: $DB.query(`$$$`)
    - pattern: $DB.execute(`$$$`)
    - pattern: $DB.prepare(`$$$`)
  has:
